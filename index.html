<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Task Adventurer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d1a; --panel:#12102a; --border:#4a3a8a; --gold:#ffd700;
    --hp-green:#44cc44; --hp-yellow:#ffcc00; --hp-orange:#ff8800; --hp-red:#ee2222;
    --text:#e8e0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'Press Start 2P',monospace;}
  body{display:flex;justify-content:center;padding:8px;-webkit-font-smoothing:none;}
  #app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:8px;}
  .panel{background:var(--panel);border:3px solid var(--border);box-shadow:inset 0 0 12px rgba(0,0,0,.7);}
  .row{display:flex;gap:8px;}

  /* Portrait */
  #portraitPanel{width:35%;position:relative;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1430;transition:background .6s;}
  #portraitCanvas{image-rendering:pixelated;width:100%;height:auto;display:block;}
  .nameplate{margin-top:4px;font-size:7px;color:var(--gold);text-shadow:1px 1px #000;letter-spacing:1px;}

  /* Stats */
  #statsPanel{width:65%;padding:10px;display:flex;flex-direction:column;gap:9px;justify-content:center;}
  .stat-label{font-size:6px;color:#9a8ad0;}
  .stat-name{font-size:9px;color:var(--gold);text-shadow:1px 1px #000;}
  .hp-row{font-size:6px;display:flex;justify-content:space-between;align-items:center;}
  .barwrap{margin-top:4px;height:14px;border:2px solid #2a2050;background:#070710;padding:2px;}
  .bar{height:100%;width:100%;transition:width .5s, background-color .5s;}
  .tasks-stat{font-size:6px;color:var(--text);}
  .status-badge{font-size:6px;padding:4px;text-align:center;border:2px solid;letter-spacing:1px;}

  /* Map */
  #mapPanel{padding:4px;}
  #mapCanvas{image-rendering:pixelated;width:100%;height:auto;display:block;}

  /* Form */
  #formPanel{padding:8px;display:flex;flex-direction:column;gap:8px;}
  #formPanel input{font-family:inherit;font-size:7px;background:#070710;color:var(--text);border:2px solid var(--border);padding:8px;outline:none;width:100%;}
  #formPanel input::-webkit-calendar-picker-indicator{filter:invert(.8);}
  #addBtn{font-family:inherit;font-size:8px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:9px;cursor:pointer;letter-spacing:1px;width:100%;}
  #addBtn:active{transform:translateY(2px);border-bottom-width:1px;}

  /* Task list */
  #listPanel{padding:6px;display:flex;flex-direction:column;gap:6px;}
  .empty{font-size:7px;color:#6a5aa0;text-align:center;padding:14px;line-height:1.8;}
  .task{display:flex;align-items:center;gap:6px;background:#0c0a20;border:2px solid #2a2050;padding:6px;font-size:7px;transition:opacity .4s;}
  .task.overdue{border-color:var(--hp-red);box-shadow:0 0 6px rgba(238,34,34,.4);}
  .task.done{opacity:.4;}
  .task.done .tname{text-decoration:line-through;}
  .cb{width:16px;height:16px;flex:0 0 16px;border:2px solid var(--border);background:#070710;cursor:pointer;position:relative;}
  .cb.checked{background:var(--hp-green);border-color:var(--hp-green);}
  .cb.checked::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;border:solid #062;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .25s;}
  @keyframes pop{0%{transform:rotate(45deg) scale(0);}100%{transform:rotate(45deg) scale(1);}}
  .tname{flex:1;line-height:1.5;word-break:break-word;}
  .badge{font-size:6px;padding:3px 4px;border:1px solid;white-space:nowrap;}
  .badge.due{color:#9ad0ff;border-color:#3a5a8a;}
  .badge.over{color:#fff;background:var(--hp-red);border-color:#ff6a6a;}
  .del{flex:0 0 auto;font-family:inherit;font-size:8px;background:#2a0a14;color:#ff8888;border:1px solid #6a2030;padding:4px 6px;cursor:pointer;}
  .del:active{transform:translateY(1px);}

  /* Game over */
  #gameover{position:fixed;inset:0;background:rgba(20,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:20px;}
  #gameover.show{display:flex;}
  #gameover h1{font-size:18px;color:var(--hp-red);text-shadow:2px 2px #000;}
  #gameover p{font-size:8px;line-height:1.8;color:#ffcccc;}
  #reviveBtn{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div class="row">
    <div id="portraitPanel" class="panel">
      <canvas id="portraitCanvas" width="130" height="180"></canvas>
      <div class="nameplate">HERO</div>
    </div>
    <div id="statsPanel" class="panel">
      <div>
        <div class="stat-label">NAME</div>
        <div class="stat-name">HERO</div>
      </div>
      <div>
        <div class="hp-row"><span class="stat-label">HP</span><span id="hpText">100/100</span></div>
        <div class="barwrap"><div class="bar" id="hpBar"></div></div>
      </div>
      <div class="tasks-stat">TASKS <span id="taskStat">0/0</span></div>
      <div class="status-badge" id="statusBadge">READY</div>
    </div>
  </div>

  <div id="mapPanel" class="panel">
    <canvas id="mapCanvas" width="400" height="260"></canvas>
  </div>

  <div id="formPanel" class="panel">
    <input type="text" id="taskName" placeholder="QUEST NAME..." maxlength="60">
    <input type="date" id="taskDate">
    <button id="addBtn">+ ADD QUEST</button>
  </div>

  <div id="listPanel" class="panel"></div>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p>ALL QUESTS OVERDUE.<br>THE HERO HAS FALLEN.</p>
  <button id="reviveBtn">REVIVE (RESTORE HP)</button>
</div>

<script>
//============ STATE ============
const HP_MAX = 100;
let state = { hp: HP_MAX, tasks: [] };

function load(){
  try{
    const t = JSON.parse(localStorage.getItem('ta_tasks')||'[]');
    if(Array.isArray(t)) state.tasks = t;
    const h = parseInt(localStorage.getItem('ta_hp'));
    if(!isNaN(h)) state.hp = h;
  }catch(e){}
}
function save(){
  localStorage.setItem('ta_tasks', JSON.stringify(state.tasks));
  localStorage.setItem('ta_hp', String(state.hp));
}

function isOverdue(task){
  if(task.done || !task.due) return false;
  const due = new Date(task.due+'T23:59:59');
  return new Date() > due;
}

function recalcHP(){
  const incomplete = state.tasks.filter(t=>!t.done);
  const overdue = state.tasks.filter(t=>isOverdue(t));
  let hp = HP_MAX - overdue.length*10;
  const allOverdue = incomplete.length>0 && overdue.length===incomplete.length;
  if(hp < 1){
    hp = allOverdue ? 0 : 1;
  }
  state.hp = Math.max(0, Math.min(HP_MAX, hp));
}

//============ STATE LEVELS ============
function hpLevel(){
  const hp = state.hp;
  if(hp>=75) return 0;
  if(hp>=50) return 1;
  if(hp>=25) return 2;
  return 3;
}
const STATUS = ['READY','FATIGUED','WOUNDED','CRITICAL'];
const STATUS_COLOR = ['#44cc44','#ffcc00','#ff8800','#ee2222'];
const PANEL_BG = ['#0e1430','#2a2410','#2a1808','#2a0a0a'];
function hpColor(){
  const hp=state.hp;
  if(hp>=60) return '#44cc44';
  if(hp>=35) return '#ffcc00';
  if(hp>=18) return '#ff8800';
  return '#ee2222';
}

//============ STATS UI ============
function renderStats(){
  const lvl = hpLevel();
  document.getElementById('hpText').textContent = state.hp+'/'+HP_MAX;
  const bar = document.getElementById('hpBar');
  bar.style.width = (state.hp/HP_MAX*100)+'%';
  const c = hpColor();
  bar.style.backgroundColor=c;
  bar.style.backgroundImage='repeating-linear-gradient(90deg,'+c+' 0 5px, rgba(0,0,0,.28) 5px 6px)';
  const done = state.tasks.filter(t=>t.done).length;
  document.getElementById('taskStat').textContent = done+'/'+state.tasks.length;
  const sb = document.getElementById('statusBadge');
  sb.textContent = STATUS[lvl];
  sb.style.color = STATUS_COLOR[lvl];
  sb.style.borderColor = STATUS_COLOR[lvl];
  document.getElementById('portraitPanel').style.background = PANEL_BG[lvl];
}

//============ TASK LIST UI ============
function fmtDue(due){
  if(!due) return '';
  const d = new Date(due+'T00:00:00');
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return 'Due '+m[d.getMonth()]+' '+d.getDate();
}
function sortTasks(){
  return [...state.tasks].sort((a,b)=>{
    const ao=isOverdue(a), bo=isOverdue(b);
    if(ao!==bo) return ao?-1:1;
    if(a.done!==b.done) return a.done?1:-1;
    const ad=a.due||'9999-99-99', bd=b.due||'9999-99-99';
    return ad.localeCompare(bd);
  });
}
function renderList(){
  const el = document.getElementById('listPanel');
  el.innerHTML='';
  if(state.tasks.length===0){
    el.innerHTML='<div class="empty">NO QUESTS YET.<br>ADD ONE TO BEGIN!</div>';
    return;
  }
  sortTasks().forEach(task=>{
    const over = isOverdue(task);
    const div = document.createElement('div');
    div.className='task'+(over?' overdue':'')+(task.done?' done':'');
    const cb = document.createElement('div');
    cb.className='cb'+(task.done?' checked':'');
    cb.onclick=()=>toggleTask(task.id);
    const name = document.createElement('div');
    name.className='tname'; name.textContent=task.name;
    div.appendChild(cb); div.appendChild(name);
    if(task.due){
      const badge=document.createElement('div');
      if(over){ badge.className='badge over'; badge.textContent='OVERDUE'; }
      else{ badge.className='badge due'; badge.textContent=fmtDue(task.due); }
      div.appendChild(badge);
    }
    const del=document.createElement('button');
    del.className='del'; del.textContent='X';
    del.onclick=()=>deleteTask(task.id);
    div.appendChild(del);
    el.appendChild(div);
  });
}

//============ ACTIONS ============
function addTask(name,due){
  state.tasks.push({id:Date.now()+Math.random(), name, due, done:false});
  recalcHP(); save(); rebuildMarkers(); refresh();
}
function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.done){
    t.done=true;
    state.hp = Math.min(HP_MAX, state.hp+15);
    sparkleAt(t.markerX, t.markerY);
  }else{
    t.done=false;
    recalcHP();
  }
  save(); rebuildMarkers(); refresh();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  recalcHP(); save(); rebuildMarkers(); refresh();
}

function refresh(){
  renderStats(); renderList(); checkGameOver();
}
function checkGameOver(){
  const incomplete = state.tasks.filter(t=>!t.done);
  const overdue = state.tasks.filter(t=>isOverdue(t));
  const allOver = incomplete.length>0 && overdue.length===incomplete.length;
  const go = document.getElementById('gameover');
  if(state.hp<=0 && allOver) go.classList.add('show');
  else go.classList.remove('show');
}

//============ PORTRAIT CANVAS ============
const pc = document.getElementById('portraitCanvas');
const px = pc.getContext('2d');
function drawPortrait(bob){
  const lvl = hpLevel();
  const W=130,H=180;
  px.clearRect(0,0,W,H);
  const grad = px.createRadialGradient(65,80,20,65,90,110);
  grad.addColorStop(0, '#1a2050'); grad.addColorStop(1,'#05050f');
  px.fillStyle=grad; px.fillRect(0,0,W,H);
  px.save();
  px.translate(0, bob);

  const cx=65;
  px.fillStyle=['#4466cc','#aa8822','#aa5522','#882222'][lvl];
  px.beginPath();
  px.moveTo(20,180); px.lineTo(38,135); px.lineTo(65,150); px.lineTo(92,135); px.lineTo(110,180);
  px.closePath(); px.fill();
  px.fillStyle='#cfe0ff';
  px.beginPath(); px.moveTo(55,148);px.lineTo(65,160);px.lineTo(75,148);px.lineTo(65,142);px.closePath();px.fill();

  px.fillStyle='#f0c9a0';
  px.fillRect(54,118,22,24);
  px.fillStyle='#f7d5af';
  px.beginPath();
  px.moveTo(cx,40);
  px.bezierCurveTo(28,42,30,95,52,118);
  px.bezierCurveTo(60,128,70,128,78,118);
  px.bezierCurveTo(100,95,102,42,cx,40);
  px.closePath(); px.fill();
  px.strokeStyle='#3a2818'; px.lineWidth=1.5; px.stroke();

  px.fillStyle='#5a3a8a';
  px.beginPath();
  px.moveTo(30,70);
  px.lineTo(26,30); px.lineTo(44,52); px.lineTo(48,22);
  px.lineTo(62,48); px.lineTo(70,18); px.lineTo(80,50);
  px.lineTo(94,26); px.lineTo(98,52); px.lineTo(106,34);
  px.lineTo(102,72);
  px.bezierCurveTo(95,52,35,52,30,70);
  px.closePath(); px.fill();
  px.fillStyle='#4a2e74';
  px.beginPath(); px.moveTo(30,68);px.lineTo(34,100);px.lineTo(42,72);px.closePath();px.fill();
  px.beginPath(); px.moveTo(102,68);px.lineTo(98,100);px.lineTo(90,72);px.closePath();px.fill();

  const eyeY=88;
  function eyeWhite(x){px.fillStyle='#fff';px.beginPath();px.ellipse(x,eyeY,9,11,0,0,7);px.fill();}
  function iris(x,squint){
    px.fillStyle='#3a6ad0';px.beginPath();px.ellipse(x,eyeY+1,5,squint?4:7,0,0,7);px.fill();
    px.fillStyle='#0a1a40';px.beginPath();px.ellipse(x,eyeY+1,2.5,squint?2:3.5,0,0,7);px.fill();
    px.fillStyle='#fff';px.beginPath();px.arc(x-2,eyeY-2,1.8,0,7);px.fill();
  }
  px.lineWidth=1.5; px.strokeStyle='#3a2818';

  if(lvl===0){
    eyeWhite(50);eyeWhite(80);iris(50,false);iris(80,false);
    px.beginPath();px.moveTo(42,74);px.lineTo(58,72);px.moveTo(72,72);px.lineTo(88,74);px.stroke();
    px.beginPath();px.moveTo(56,110);px.quadraticCurveTo(67,118,80,108);px.stroke();
  } else if(lvl===1){
    eyeWhite(50);eyeWhite(80);iris(50,true);iris(80,true);
    px.beginPath();px.moveTo(42,80);px.lineTo(58,84);px.moveTo(72,84);px.lineTo(88,80);px.stroke();
    px.fillStyle='#f0c9a0';px.fillRect(40,80,20,4);px.fillRect(70,80,20,4);
    px.strokeStyle='#3a2818';px.beginPath();px.moveTo(58,112);px.quadraticCurveTo(67,108,78,112);px.stroke();
    px.fillStyle='#6cf';px.beginPath();px.moveTo(96,72);px.quadraticCurveTo(100,82,96,86);px.quadraticCurveTo(92,82,96,72);px.fill();
  } else if(lvl===2){
    eyeWhite(50);iris(50,false);
    px.strokeStyle='#3a2818';px.lineWidth=2;
    px.beginPath();px.moveTo(72,90);px.quadraticCurveTo(80,86,88,90);px.stroke();
    px.lineWidth=1.5;
    px.beginPath();px.moveTo(42,76);px.lineTo(58,76);px.moveTo(72,80);px.lineTo(88,78);px.stroke();
    px.fillStyle='#e8dcc0';px.save();px.translate(85,108);px.rotate(-0.4);px.fillRect(-12,-4,24,8);
    px.strokeStyle='#b0a080';px.beginPath();px.moveTo(-6,-4);px.lineTo(-2,4);px.moveTo(2,-4);px.lineTo(6,4);px.stroke();px.restore();
    px.strokeStyle='#3a2818';px.fillStyle='#fff';
    px.fillRect(54,107,26,7);px.strokeRect(54,107,26,7);
    px.beginPath();px.moveTo(61,107);px.lineTo(61,114);px.moveTo(67,107);px.lineTo(67,114);px.moveTo(73,107);px.lineTo(73,114);px.stroke();
  } else {
    px.strokeStyle='#3a2818';px.lineWidth=2;
    px.beginPath();
    px.moveTo(45,83);px.lineTo(56,93);px.moveTo(56,83);px.lineTo(45,93);
    px.moveTo(75,83);px.lineTo(86,93);px.moveTo(86,83);px.lineTo(75,93);
    px.stroke();
    px.lineWidth=1.5;
    px.beginPath();px.moveTo(42,78);px.lineTo(58,80);px.moveTo(72,80);px.lineTo(88,78);px.stroke();
    px.fillStyle='#5a2020';px.beginPath();px.ellipse(67,110,6,4,0,0,7);px.fill();
    px.fillStyle='#6cf';px.beginPath();px.arc(96,80,3,0,7);px.fill();
    px.beginPath();px.arc(36,86,3,0,7);px.fill();
  }
  px.strokeStyle='#d0a070';px.lineWidth=1.5;
  px.beginPath();px.moveTo(66,96);px.lineTo(63,102);px.lineTo(67,103);px.stroke();
  px.restore();
}

//============ MAP CANVAS ============
const mc = document.getElementById('mapCanvas');
const mx = mc.getContext('2d');
const TS=20, COLS=20, ROWS=13;
let MAP = buildMap();
function buildMap(){
  const m=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++){r.push(0);}m.push(r);}
  for(let y=4;y<=8;y++)for(let x=7;x<=12;x++)m[y][x]=2;
  for(let x=0;x<COLS;x++)m[6][x]=m[6][x]===2?2:1;
  for(let y=0;y<ROWS;y++)m[y][9]=m[y][9]===2?2:1;
  for(let y=0;y<=3;y++)for(let x=16;x<COLS;x++)m[y][x]=3;
  [[2,2],[3,5],[1,13],[10,3],[11,14],[2,8],[12,2],[10,11],[11,7],[0,11]].forEach(([y,x])=>{if(m[y]&&m[y][x]===0)m[y][x]=4;});
  return m;
}
const HERO_TX=9, HERO_TY=6;

let markers=[];
let sparkles=[];
function rebuildMarkers(){
  const spots=[[1,3],[2,15],[8,2],[9,15],[11,5],[3,11],[12,12],[7,16],[10,1],[1,7],[4,17],[11,9]];
  let i=0; markers=[];
  state.tasks.filter(t=>!t.done).forEach(t=>{
    const s = spots[i%spots.length]; i++;
    t.markerX = s[1]*TS+TS/2; t.markerY=s[0]*TS+TS/2;
    markers.push({id:t.id, tx:s[1], ty:s[0], overdue:isOverdue(t)});
  });
}
function sparkleAt(x,y){
  if(x==null) return;
  for(let i=0;i<8;i++) sparkles.push({x,y,a:Math.PI/4*i,t:0});
}

function drawMap(time){
  mx.clearRect(0,0,400,260);
  const shimmer = Math.sin(time/300);
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const t=MAP[y][x], px0=x*TS, py0=y*TS;
      if(t===0){ mx.fillStyle='#2e6b2e'; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='#358035'; if((x+y)%2===0)mx.fillRect(px0+2,py0+2,4,4); mx.fillRect(px0+12,py0+10,3,3);
      } else if(t===1){ mx.fillStyle='#7a5a32'; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='#6a4c28'; mx.fillRect(px0+3,py0+8,5,3); mx.fillRect(px0+12,py0+3,4,3);
      } else if(t===2){ mx.fillStyle='#9a9aa6'; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='#7a7a88'; mx.fillRect(px0,py0,TS,1); mx.fillRect(px0,py0,1,TS);
        mx.fillStyle='#b0b0bc'; mx.fillRect(px0+2,py0+2,16,16);
      } else if(t===3){ const b=Math.floor(150+shimmer*30+((x*7+y*3)%2)*15);
        mx.fillStyle='rgb(40,80,'+b+')'; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='rgba(180,220,255,'+(0.3+shimmer*0.2)+')'; mx.fillRect(px0+3,py0+(shimmer>0?5:12),8,2);
      } else if(t===4){ mx.fillStyle='#2e6b2e'; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='#3a2410'; mx.fillRect(px0+8,py0+12,4,7);
        mx.fillStyle='#1e5a1e'; mx.beginPath();mx.arc(px0+10,py0+9,8,0,7);mx.fill();
        mx.fillStyle='#2a7a2a'; mx.beginPath();mx.arc(px0+7,py0+7,4,0,7);mx.fill();
      }
    }
  }
  const fx=12*TS+10, fy=4*TS;
  mx.strokeStyle='#cccccc';mx.lineWidth=2;mx.beginPath();mx.moveTo(fx,fy-2);mx.lineTo(fx,fy+16);mx.stroke();
  const wave=Math.sin(time/200)*3;
  mx.fillStyle='#ee2222';mx.beginPath();mx.moveTo(fx,fy-2);mx.lineTo(fx+14,fy+2+wave);mx.lineTo(fx,fy+8);mx.closePath();mx.fill();

  mx.textAlign='center';mx.textBaseline='middle';
  mx.font='bold 14px "Press Start 2P", monospace';
  markers.forEach(m=>{
    const cx=m.tx*TS+TS/2, cy=m.ty*TS+TS/2;
    const pulse = 0.5+0.5*Math.sin(time/250);
    const col = m.overdue ? 'rgba(238,34,34,' : 'rgba(255,235,120,';
    mx.fillStyle=col+(0.25+pulse*0.4)+')';
    mx.beginPath();mx.arc(cx,cy,9+pulse*3,0,7);mx.fill();
    mx.fillStyle=m.overdue?'#ff4444':'#fff4a0';
    mx.fillText('!', cx, cy-1);
  });

  sparkles.forEach(s=>{ s.t+=0.06;
    const r=s.t*18; const a=1-s.t;
    if(a>0){ mx.fillStyle='rgba(255,255,180,'+a+')';
      mx.fillRect(s.x+Math.cos(s.a)*r-2, s.y+Math.sin(s.a)*r-2,4,4);
    }
  });
  sparkles = sparkles.filter(s=>s.t<1);

  const hx=HERO_TX*TS+TS/2, hy=HERO_TY*TS+TS/2;
  const lvl=hpLevel();
  const armor=['#4466ee','#cc9922','#cc5522','#cc2222'][lvl];
  mx.fillStyle='rgba(0,0,0,.3)';mx.beginPath();mx.ellipse(hx,hy+5,8,4,0,0,7);mx.fill();
  mx.fillStyle=armor;
  mx.beginPath();mx.moveTo(hx,hy-7);mx.lineTo(hx+7,hy);mx.lineTo(hx,hy+7);mx.lineTo(hx-7,hy);mx.closePath();mx.fill();
  mx.strokeStyle='#fff';mx.lineWidth=1;mx.stroke();
  mx.fillStyle='#ffe0b0';mx.beginPath();mx.arc(hx,hy-1,3,0,7);mx.fill();

  if(lvl===3){
    const v=mx.createRadialGradient(200,130,60,200,130,230);
    v.addColorStop(0,'rgba(238,34,34,0)');v.addColorStop(1,'rgba(180,0,0,0.5)');
    mx.fillStyle=v;mx.fillRect(0,0,400,260);
  }
}

//============ ANIM LOOP ============
function loop(time){
  const bob = Math.sin(time/1500*Math.PI)*2.2;
  drawPortrait(bob);
  drawMap(time);
  requestAnimationFrame(loop);
}

//============ INIT ============
document.getElementById('addBtn').onclick=()=>{
  const name=document.getElementById('taskName').value.trim();
  const due=document.getElementById('taskDate').value;
  if(!name) return;
  addTask(name, due||null);
  document.getElementById('taskName').value='';
  document.getElementById('taskDate').value='';
};
document.getElementById('taskName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addBtn').click();});
document.getElementById('reviveBtn').onclick=()=>{
  state.hp=HP_MAX;
  save(); refresh();
};

load();
recalcHP();
save();
rebuildMarkers();
refresh();
requestAnimationFrame(loop);

setInterval(()=>{ recalcHP(); rebuildMarkers(); save(); refresh(); }, 3600*1000);
</script>
