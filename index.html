<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Task Adventurer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffd700;--text:#e8e0ff;--hp-green:#44cc44;--hp-red:#ee2222;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#080810;color:var(--text);font-family:'Press Start 2P',monospace;overflow:hidden;}
  #mapWrap{position:fixed;inset:0;background:#080810;}
  #mapCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%);z-index:2;}
  .hud{position:fixed;z-index:5;}
  .glass{background:rgba(10,8,28,0.88);border:2px solid var(--gold);
    box-shadow:0 0 16px rgba(0,0,0,.7),inset 0 0 14px rgba(0,0,0,.5);backdrop-filter:blur(2px);}
  #portraitPanel{top:10px;left:10px;width:150px;padding:6px;display:flex;flex-direction:column;align-items:center;}
  #portraitImg{width:136px;height:175px;object-fit:cover;object-position:center top;display:block;}
  .nameplate{margin-top:5px;font-size:7px;color:var(--gold);letter-spacing:1px;}
  #statsPanel{top:10px;right:10px;width:200px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .stat-label{font-size:6px;color:#9a8ad0;}
  .stat-name{font-size:10px;color:var(--gold);}
  .statline{display:flex;align-items:center;gap:6px;}
  .icn{image-rendering:pixelated;flex:0 0 auto;}
  .hp-row{font-size:6px;display:flex;justify-content:space-between;align-items:center;}
  .barwrap{margin-top:4px;height:14px;border:2px solid #2a2050;background:#070710;padding:2px;}
  .bar{height:100%;width:100%;transition:width .5s,background-color .5s;}
  .tasks-stat{font-size:6px;color:var(--text);}
  .status-badge{font-size:7px;padding:5px;text-align:center;border:2px solid;letter-spacing:1px;}
  .status-badge.blink{animation:badgeblink .7s steps(1) infinite;}
  @keyframes badgeblink{0%{opacity:1;}50%{opacity:.25;}100%{opacity:1;}}
  #formPanel{left:50%;transform:translateX(-50%);bottom:calc(40vh + 16px);width:96%;max-width:520px;
    padding:8px;display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;}
  #formPanel.collapsed{bottom:54px;}
  #formPanel input,#formPanel select{font-family:inherit;font-size:7px;background:#070710;color:var(--text);border:2px solid #4a3a8a;padding:8px;outline:none;}
  #formPanel select option{background:#0d0b22;}
  #taskName{flex:1 1 180px;min-width:0;}
  #taskDate{flex:0 0 auto;}
  #taskLoc{flex:0 1 140px;}
  #formPanel input::-webkit-calendar-picker-indicator{filter:invert(.8);}
  #addBtn{font-family:inherit;font-size:8px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:9px;cursor:pointer;letter-spacing:1px;white-space:nowrap;}
  #addBtn:active{transform:translateY(2px);border-bottom-width:1px;}
  #listPanel{left:0;right:0;bottom:0;width:100%;max-height:40vh;
    background:rgba(8,6,20,0.92);border-top:3px solid var(--gold);display:flex;flex-direction:column;}
  #listHead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #2a2050;}
  #listHead .lbl{font-size:7px;color:var(--gold);letter-spacing:1px;}
  #collapseBtn{font-family:inherit;font-size:9px;background:none;border:1px solid #4a3a8a;color:var(--gold);width:24px;height:20px;cursor:pointer;line-height:1;}
  #listBody{overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px;}
  #listPanel.collapsed #listBody{display:none;}
  #listPanel.collapsed{max-height:none;}
  .empty{font-size:7px;color:#6a5aa0;text-align:center;padding:14px;line-height:1.8;}
  .task{display:flex;align-items:center;gap:6px;min-height:32px;background:rgba(12,10,32,0.85);border:1px solid #2a2050;padding:4px 6px;font-size:7px;transition:opacity .4s;}
  .task.overdue{border-color:var(--hp-red);box-shadow:0 0 6px rgba(238,34,34,.4);}
  .task.done{opacity:.4;}
  .task.done .tname{text-decoration:line-through;}
  .cb{width:16px;height:16px;flex:0 0 16px;border:2px solid #4a3a8a;background:#070710;cursor:pointer;position:relative;}
  .cb.checked{background:var(--hp-green);border-color:var(--hp-green);}
  .cb.checked::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;border:solid #062;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .25s;}
  @keyframes pop{0%{transform:rotate(45deg) scale(0);}100%{transform:rotate(45deg) scale(1);}}
  .tname{flex:1;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tloc{font-size:5px;color:#9a80d0;white-space:nowrap;flex:0 0 auto;}
  .badge{font-size:6px;padding:3px 4px;border:1px solid;white-space:nowrap;flex:0 0 auto;}
  .badge.due{color:#9ad0ff;border-color:#3a5a8a;}
  .badge.over{color:#fff;background:var(--hp-red);border-color:#ff6a6a;}
  .del{flex:0 0 auto;font-family:inherit;font-size:8px;background:#2a0a14;color:#ff8888;border:1px solid #6a2030;padding:4px 6px;cursor:pointer;}
  #gameover{position:fixed;inset:0;background:rgba(20,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:20px;}
  #gameover.show{display:flex;}
  #gameover h1{font-size:18px;color:var(--hp-red);}
  #gameover p{font-size:8px;line-height:1.8;color:#ffcccc;}
  #reviveBtn{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;cursor:pointer;}
  @media(max-width:480px){
    #portraitPanel{width:118px;}#portraitImg{width:106px;height:140px;}
    #statsPanel{width:155px;padding:8px;gap:8px;}
    #formPanel{width:98%;gap:4px;padding:6px;}#taskName{flex:1 1 100%;}#taskLoc{flex:1 1 100%;}#taskDate{flex:1 1 auto;}#addBtn{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div id="mapWrap"><canvas id="mapCanvas" width="400" height="260"></canvas></div>
<div id="vignette"></div>

<div id="portraitPanel" class="hud glass">
  <img id="portraitImg" alt="Hero">
  <div class="nameplate">HERO</div>
</div>

<div id="statsPanel" class="hud glass">
  <div><div class="stat-label">NAME</div><div class="stat-name">HERO</div></div>
  <div>
    <div class="hp-row">
      <span class="statline"><canvas class="icn" id="heartIcn" width="9" height="9"></canvas><span class="stat-label">HP</span></span>
      <span id="hpText">100/100</span>
    </div>
    <div class="barwrap"><div class="bar" id="hpBar"></div></div>
  </div>
  <div class="statline"><canvas class="icn" id="scrollIcn" width="9" height="9"></canvas><span class="tasks-stat">TASKS <span id="taskStat">0/0</span></span></div>
  <div class="status-badge" id="statusBadge">READY</div>
</div>

<div id="formPanel" class="hud glass">
  <input type="text" id="taskName" placeholder="QUEST NAME..." maxlength="60">
  <select id="taskLoc"></select>
  <input type="date" id="taskDate">
  <button id="addBtn">+ ADD</button>
</div>

<div id="listPanel" class="hud">
  <div id="listHead"><span class="lbl">QUEST LOG</span><button id="collapseBtn">v</button></div>
  <div id="listBody"></div>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p>ALL QUESTS OVERDUE.<br>THE HERO HAS FALLEN.</p>
  <button id="reviveBtn">REVIVE (RESTORE HP)</button>
</div>

<script>
const PORTRAIT_SRCS = ['wizard_confident.png','wizard_tired.png','wizard_hurt.png','wizard_critical.png'];
const spriteImg = new Image(); spriteImg.src = 'wizard_sprite_16bit.png';
function updatePortrait(){ document.getElementById('portraitImg').src = PORTRAIT_SRCS[hpLevel()]; }

const TOWNS = [
  {name:'HEARTHSTONE',tx:2, ty:1, color:'#d4884c',roof:'#8b3a10'},
  {name:'IRON KEEP',  tx:17,ty:1, color:'#8a8aaa',roof:'#4a4a6a'},
  {name:'DARKWOOD',   tx:2, ty:11,color:'#3a6a3a',roof:'#1a3a1a'},
  {name:'SALTPORT',   tx:16,ty:10,color:'#2a6a9a',roof:'#1a3a5a'},
  {name:'CROSSROADS', tx:9, ty:3, color:'#c8a840',roof:'#7a6010'}
];

const HP_MAX = 100;
let state = {hp:HP_MAX, tasks:[]};
function load(){ try{ const t=JSON.parse(localStorage.getItem('ta_tasks')||'[]'); if(Array.isArray(t)) state.tasks=t; const h=parseInt(localStorage.getItem('ta_hp')); if(!isNaN(h)) state.hp=h; }catch(e){} }
function save(){ localStorage.setItem('ta_tasks',JSON.stringify(state.tasks)); localStorage.setItem('ta_hp',String(state.hp)); }
function isOverdue(t){ if(t.done||!t.due) return false; return new Date()>new Date(t.due+'T23:59:59'); }
function recalcHP(){ const inc=state.tasks.filter(t=>!t.done); const ov=state.tasks.filter(t=>isOverdue(t)); let hp=HP_MAX-ov.length*10; if(hp<1) hp=(inc.length>0&&ov.length===inc.length)?0:1; state.hp=Math.max(0,Math.min(HP_MAX,hp)); }
function hpLevel(){ if(state.hp>=75) return 0; if(state.hp>=50) return 1; if(state.hp>=25) return 2; return 3; }
const STATUS=['READY','FATIGUED','WOUNDED','CRITICAL'];
const STATUS_COLOR=['#44cc44','#ffcc00','#ff8800','#ee2222'];
function hpColor(){ if(state.hp>=60) return '#44cc44'; if(state.hp>=35) return '#ffcc00'; if(state.hp>=18) return '#ff8800'; return '#ee2222'; }

function drawHeart(){ const c=document.getElementById('heartIcn'),g=c.getContext('2d'); g.clearRect(0,0,9,9); g.fillStyle='#ee4466'; [[1,2],[2,1],[3,1],[4,2],[5,1],[6,1],[7,2],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[2,4],[3,4],[4,4],[5,4],[6,4],[3,5],[4,5],[5,5],[4,6]].forEach(([x,y])=>g.fillRect(x,y,1,1)); }
function drawScroll(){ const c=document.getElementById('scrollIcn'),g=c.getContext('2d'); g.clearRect(0,0,9,9); g.fillStyle='#e8d8a0'; g.fillRect(1,1,6,7); g.fillStyle='#a89860'; g.fillRect(1,1,6,1); g.fillRect(1,7,6,1); g.strokeStyle='#2e8b2e'; g.lineWidth=1; g.beginPath(); g.moveTo(2.5,4.5); g.lineTo(3.5,6); g.lineTo(6,2.5); g.stroke(); }

function renderStats(){
  const lvl=hpLevel();
  document.getElementById('hpText').textContent=state.hp+'/'+HP_MAX;
  const bar=document.getElementById('hpBar'); bar.style.width=(state.hp/HP_MAX*100)+'%';
  const c=hpColor(); bar.style.backgroundColor=c; bar.style.backgroundImage='repeating-linear-gradient(90deg,'+c+' 0 5px,rgba(0,0,0,.28) 5px 6px)';
  const done=state.tasks.filter(t=>t.done).length; document.getElementById('taskStat').textContent=done+'/'+state.tasks.length;
  const sb=document.getElementById('statusBadge'); sb.textContent=STATUS[lvl]; sb.style.color=STATUS_COLOR[lvl]; sb.style.borderColor=STATUS_COLOR[lvl]; sb.classList.toggle('blink',lvl>=2);
  updatePortrait();
}

function fmtDue(due){ if(!due) return ''; const d=new Date(due+'T00:00:00'); return 'Due '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate(); }
function sortTasks(){ return [...state.tasks].sort((a,b)=>{ const ao=isOverdue(a),bo=isOverdue(b); if(ao!==bo) return ao?-1:1; if(a.done!==b.done) return a.done?1:-1; return (a.due||'9999').localeCompare(b.due||'9999'); }); }
function renderList(){
  const el=document.getElementById('listBody'); el.innerHTML='';
  if(!state.tasks.length){ el.innerHTML='<div class="empty">NO QUESTS YET.<br>ADD ONE TO BEGIN!</div>'; return; }
  sortTasks().forEach(task=>{
    const over=isOverdue(task);
    const div=document.createElement('div'); div.className='task'+(over?' overdue':'')+(task.done?' done':'');
    const cb=document.createElement('div'); cb.className='cb'+(task.done?' checked':''); cb.onclick=()=>toggleTask(task.id);
    const name=document.createElement('div'); name.className='tname'; name.textContent=task.name;
    div.appendChild(cb); div.appendChild(name);
    const town=TOWNS[task.loc||0];
    if(town){ const tl=document.createElement('div'); tl.className='tloc'; tl.textContent=town.name; div.appendChild(tl); }
    if(task.due){ const badge=document.createElement('div'); badge.className=over?'badge over':'badge due'; badge.textContent=over?'OVERDUE':fmtDue(task.due); div.appendChild(badge); }
    const del=document.createElement('button'); del.className='del'; del.textContent='X'; del.onclick=()=>deleteTask(task.id); div.appendChild(del);
    el.appendChild(div);
  });
}

function addTask(name,loc,due){ state.tasks.push({id:Date.now()+Math.random(),name,loc:parseInt(loc)||0,due,done:false}); recalcHP();save();rebuildMarkers();refresh(); }
function toggleTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t) return; if(!t.done){ t.done=true; state.hp=Math.min(HP_MAX,state.hp+15); const town=TOWNS[t.loc||0]; if(town) sparkleAt(town.tx*TS+TS/2,town.ty*TS+TS/2); }else{ t.done=false; recalcHP(); } save();rebuildMarkers();refresh(); }
function deleteTask(id){ state.tasks=state.tasks.filter(x=>x.id!==id); recalcHP();save();rebuildMarkers();refresh(); }
function refresh(){ renderStats();renderList();checkGameOver(); }
function checkGameOver(){ const inc=state.tasks.filter(t=>!t.done); const ov=state.tasks.filter(t=>isOverdue(t)); document.getElementById('gameover').classList.toggle('show',state.hp<=0&&inc.length>0&&ov.length===inc.length); }

const mc=document.getElementById('mapCanvas');
const mx=mc.getContext('2d');
const TS=20,COLS=20,ROWS=13,HERO_TX=9,HERO_TY=6;
let MAP=buildMap();

function buildMap(){
  const m=[]; for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push(0);m.push(r);}
  for(let x=0;x<COLS;x++) if(m[6][x]===0) m[6][x]=1;
  for(let y=0;y<ROWS;y++) if(m[y][9]===0) m[y][9]=1;
  for(let y=0;y<=3;y++) for(let x=15;x<COLS;x++) m[y][x]=3;
  [[2,5],[1,12],[10,4],[11,15],[2,7],[12,3],[10,12],[0,11],[3,1],[11,8],[7,18],[5,0],[12,7]].forEach(([y,x])=>{ if(m[y]&&m[y][x]===0) m[y][x]=4; });
  TOWNS.forEach(t=>{ if(m[t.ty]&&m[t.ty][t.tx]!==3) m[t.ty][t.tx]=5; });
  return m;
}

let markers=[],sparkles=[];
function rebuildMarkers(){
  markers=[];
  const byTown={};
  state.tasks.filter(t=>!t.done).forEach(t=>{ const loc=t.loc||0; if(!byTown[loc]) byTown[loc]=[]; byTown[loc].push(t); });
  Object.entries(byTown).forEach(([loc,tasks])=>{ const town=TOWNS[parseInt(loc)]; if(!town) return; markers.push({tx:town.tx,ty:town.ty,overdue:tasks.some(t=>isOverdue(t)),count:tasks.length}); });
}
function sparkleAt(x,y){ for(let i=0;i<8;i++) sparkles.push({x,y,a:Math.PI/4*i,t:0}); }

function fitMap(){ mc.width=window.innerWidth; mc.height=Math.max(340,window.innerHeight); }
window.addEventListener('resize',fitMap);

function drawTown(t){
  const cx=t.tx*TS+TS/2,cy=t.ty*TS+TS/2;
  mx.fillStyle=t.color; mx.fillRect(cx-8,cy-4,16,10);
  mx.fillStyle=t.roof; mx.beginPath(); mx.moveTo(cx-10,cy-4); mx.lineTo(cx,cy-14); mx.lineTo(cx+10,cy-4); mx.closePath(); mx.fill();
  mx.fillStyle='#1a0a00'; mx.fillRect(cx-2,cy+1,4,5);
  mx.fillStyle='#ffe080'; mx.fillRect(cx-7,cy-2,3,3); mx.fillRect(cx+4,cy-2,3,3);
  mx.font='5px "Press Start 2P",monospace'; mx.textAlign='center'; mx.textBaseline='top';
  mx.fillStyle='rgba(0,0,0,.7)'; mx.fillText(t.name,cx+1,cy+8);
  mx.fillStyle='#ffe8a0'; mx.fillText(t.name,cx,cy+7);
}

function drawMap(time){
  const W=mc.width,H=mc.height;
  mx.clearRect(0,0,W,H);
  const sx=W/(COLS*TS),sy=H/(ROWS*TS);
  mx.save(); mx.scale(sx,sy);

  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=MAP[y][x],px0=x*TS,py0=y*TS,v=(x*13+y*7)%3;
    if(t===0||t===4||t===5){
      mx.fillStyle=['#1e4d1e','#236123','#1a431a'][v]; mx.fillRect(px0,py0,TS,TS);
      mx.fillStyle='#3aa03a'; if((x+y)%2===0) mx.fillRect(px0+3,py0+3,3,3);
      mx.fillRect(px0+13,py0+11,2,2); mx.fillRect(px0+8,py0+15,2,2);
    } else if(t===1){
      mx.fillStyle='#6b4423'; mx.fillRect(px0,py0,TS,TS);
      mx.fillStyle='#4a3018'; mx.fillRect(px0,py0,TS,2); mx.fillRect(px0,py0,2,TS);
      mx.fillStyle='#8a6038'; mx.fillRect(px0+4,py0+9,3,3); mx.fillRect(px0+13,py0+4,2,2);
    } else if(t===3){
      mx.fillStyle='#1a3a6b'; mx.fillRect(px0,py0,TS,TS);
      mx.strokeStyle='#4488cc'; mx.lineWidth=1.5;
      for(let wy=4;wy<TS;wy+=7){ mx.beginPath(); for(let wx=0;wx<=TS;wx+=2){ const yy=py0+wy+Math.sin((px0+wx)/5+time/350+wy)*1.6; if(wx===0) mx.moveTo(px0+wx,yy); else mx.lineTo(px0+wx,yy); } mx.stroke(); }
    }
    if(t!==3){ mx.fillStyle='rgba(0,0,0,.22)'; mx.fillRect(px0,py0+TS-2,TS,2); mx.fillRect(px0+TS-2,py0,2,TS); }
  }

  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(MAP[y][x]!==4) continue;
    const cxp=x*TS+TS/2,cyp=y*TS+TS/2;
    mx.fillStyle='rgba(0,0,0,.35)'; mx.beginPath(); mx.ellipse(cxp+2,cyp+6,11,5,0,0,7); mx.fill();
    mx.fillStyle='#3a2410'; mx.beginPath(); mx.arc(cxp,cyp+4,2.5,0,7); mx.fill();
    mx.fillStyle='#143d14'; mx.beginPath(); mx.arc(cxp,cyp,9,0,7); mx.fill();
    mx.beginPath(); mx.arc(cxp-5,cyp-3,5,0,7); mx.fill(); mx.beginPath(); mx.arc(cxp+5,cyp+2,5,0,7); mx.fill();
    mx.fillStyle='#2a7a2a'; mx.beginPath(); mx.arc(cxp-2,cyp-1,6,0,7); mx.fill();
    mx.fillStyle='#4cb04c'; mx.beginPath(); mx.arc(cxp-3,cyp-3,3.5,0,7); mx.fill();
  }

  TOWNS.forEach(t=>drawTown(t));

  const hx=HERO_TX*TS+TS/2,hy=HERO_TY*TS+TS/2,lvl=hpLevel();
  mx.strokeStyle='rgba(255,255,255,0.1)'; mx.lineWidth=1;
  markers.forEach(m=>{ mx.beginPath(); mx.moveTo(hx,hy); mx.lineTo(m.tx*TS+TS/2,m.ty*TS+TS/2); mx.stroke(); });

  const pulse=0.5+0.5*Math.sin(time/250);
  markers.forEach(m=>{
    const cxp=m.tx*TS+TS/2,cyp=m.ty*TS+TS/2-16;
    const col=m.overdue?'rgba(238,34,34,':'rgba(255,235,120,';
    mx.fillStyle=col+(0.15+pulse*0.3)+')'; mx.beginPath(); mx.arc(cxp,cyp,14+pulse*3,0,7); mx.fill();
    mx.fillStyle=col+'0.9)'; mx.beginPath(); mx.arc(cxp,cyp,9,0,7); mx.fill();
    if(m.overdue){
      mx.fillStyle='#fff'; mx.beginPath(); mx.arc(cxp,cyp-1,5,0,7); mx.fill(); mx.fillRect(cxp-3,cyp+3,6,3);
      mx.fillStyle='#220000'; mx.beginPath(); mx.arc(cxp-2,cyp-1,1.4,0,7); mx.fill(); mx.beginPath(); mx.arc(cxp+2,cyp-1,1.4,0,7); mx.fill(); mx.fillRect(cxp-0.7,cyp+1,1.4,2);
    } else {
      mx.fillStyle='#3a2800'; mx.font='bold 11px "Press Start 2P",monospace'; mx.textAlign='center'; mx.textBaseline='middle';
      mx.fillText(m.count>1?m.count+'!':'!',cxp,cyp);
    }
  });

  sparkles.forEach(s=>{ s.t+=0.06; const r=s.t*18,a=1-s.t; if(a>0){mx.fillStyle='rgba(255,255,180,'+a+')';mx.fillRect(s.x+Math.cos(s.a)*r-2,s.y+Math.sin(s.a)*r-2,4,4);} });
  sparkles=sparkles.filter(s=>s.t<1);

  const tokCol=['#3a7aff','#ffcc22','#ff8822','#ff2a2a'][lvl];
  const ringCol=['rgba(80,140,255,','rgba(255,210,60,','rgba(255,140,40,','rgba(255,50,50,'][lvl];
  const ty=hy+(lvl===3?3:lvl===0?-2:0);
  const ringR=12+pulse*4;
  mx.strokeStyle=ringCol+(0.5+pulse*0.4)+')'; mx.lineWidth=2;
  mx.beginPath(); mx.arc(hx,ty+5,ringR,0,7); mx.stroke();
  mx.fillStyle='rgba(0,0,0,.35)'; mx.beginPath(); mx.ellipse(hx,ty+7,9,4,0,0,7); mx.fill();
  mx.save(); mx.shadowColor=tokCol; mx.shadowBlur=14;
  if(spriteImg.complete&&spriteImg.naturalWidth>0){
    mx.drawImage(spriteImg,hx-14,ty-18,28,32);
  } else {
    mx.fillStyle=tokCol; mx.beginPath(); mx.moveTo(hx,ty-14); mx.lineTo(hx+14,ty); mx.lineTo(hx,ty+14); mx.lineTo(hx-14,ty); mx.closePath(); mx.fill();
  }
  mx.restore();

  if(lvl===3){ const v=mx.createRadialGradient(COLS*TS/2,ROWS*TS/2,40,COLS*TS/2,ROWS*TS/2,COLS*TS/1.4); v.addColorStop(0,'rgba(238,34,34,0)'); v.addColorStop(1,'rgba(180,0,0,0.5)'); mx.fillStyle=v; mx.fillRect(0,0,COLS*TS,ROWS*TS); }
  mx.restore();
}

function loop(time){ drawMap(time); requestAnimationFrame(loop); }

function populateTownSelect(){ const sel=document.getElementById('taskLoc'); TOWNS.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=t.name; sel.appendChild(o); }); }

document.getElementById('addBtn').onclick=()=>{
  const name=document.getElementById('taskName').value.trim();
  const loc=document.getElementById('taskLoc').value;
  const due=document.getElementById('taskDate').value;
  if(!name) return;
  addTask(name,loc,due||null);
  document.getElementById('taskName').value=''; document.getElementById('taskDate').value='';
};
document.getElementById('taskName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addBtn').click();});
document.getElementById('reviveBtn').onclick=()=>{state.hp=HP_MAX;save();refresh();};
document.getElementById('collapseBtn').onclick=()=>{
  const lp=document.getElementById('listPanel'),fp=document.getElementById('formPanel');
  const c=lp.classList.toggle('collapsed'); fp.classList.toggle('collapsed',c);
  document.getElementById('collapseBtn').textContent=c?'^':'v';
};

populateTownSelect(); drawHeart(); drawScroll();
fitMap(); load(); recalcHP(); save(); rebuildMarkers(); refresh();
requestAnimationFrame(loop);
setInterval(()=>{recalcHP();rebuildMarkers();save();refresh();},3600*1000);
</script>
