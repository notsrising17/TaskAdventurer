<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Task Adventurer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffd700;--text:#e8e0ff;--hp-green:#44cc44;--hp-red:#ee2222;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#080810;color:var(--text);font-family:'Press Start 2P',monospace;overflow:hidden;}
  #mapWrap{position:fixed;inset:0;background:#080810;}
  #mapCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%);z-index:2;}
  .hud{position:fixed;z-index:5;}
  /* Toast notifications */
  #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:30;
    font-size:8px;color:var(--gold);background:rgba(10,8,28,.94);border:2px solid var(--gold);
    padding:8px 14px;letter-spacing:1px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    box-shadow:0 0 16px rgba(0,0,0,.6);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .glass{background:rgba(10,8,28,0.88);border:2px solid var(--gold);
    box-shadow:0 0 16px rgba(0,0,0,.7),inset 0 0 14px rgba(0,0,0,.5);backdrop-filter:blur(2px);}

  /* Portrait column */
  #portraitCol{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;z-index:5;}
  .portCard{width:88px;display:flex;flex-direction:column;align-items:center;padding:4px;cursor:pointer;
    border:1px solid #2a2050;background:rgba(10,8,28,.85);transition:border-color .2s;}
  .portCard:hover,.portCard.active{border-color:var(--gold);}
  .portImg{width:80px;height:80px;object-fit:cover;display:block;image-rendering:pixelated;}
  .portCanvas{width:80px;height:80px;display:block;image-rendering:pixelated;}
  .portName{font-size:6px;color:var(--gold);letter-spacing:.5px;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;width:100%;text-overflow:ellipsis;}
  .portCard.flash{animation:cardflash .6s steps(2);}
  @keyframes cardflash{0%,50%{border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,0,.8);}25%,75%{border-color:#2a2050;box-shadow:none;}}
  .portHPWrap{width:100%;height:3px;background:#070710;margin-top:2px;}
  .portHPFill{height:100%;transition:width .3s,background-color .3s;}

  /* Stats — slim bar, tap to expand */
  #statsPanel{top:10px;right:10px;max-width:calc(100% - 20px);padding:0;display:flex;flex-direction:column;}
  #statsBar{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;flex-wrap:wrap;}
  #statsChev{font-size:8px;color:var(--gold);margin-left:auto;}
  #statsBody{display:none;flex-direction:column;gap:8px;padding:0 10px 10px;}
  #statsPanel.open #statsBody{display:flex;}
  .stat-label{font-size:6px;color:#9a8ad0;}
  .stat-name{font-size:9px;color:var(--gold);cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .2s;}
  .stat-name:hover{border-bottom-color:var(--gold);}
  #heroNameInput{font-family:inherit;font-size:9px;background:#070710;color:var(--gold);border:none;border-bottom:1px solid var(--gold);outline:none;width:90px;display:none;padding:2px 0;}
  .statline{display:flex;align-items:center;gap:6px;}
  .icn{image-rendering:pixelated;flex:0 0 auto;}
  .hp-inline{font-size:7px;display:flex;align-items:center;gap:4px;}
  .barwrap{height:12px;border:2px solid #2a2050;background:#070710;padding:2px;}
  .bar{height:100%;width:100%;transition:width .5s,background-color .5s;}
  .tasks-stat{font-size:7px;color:var(--text);display:flex;align-items:center;gap:4px;}
  .status-badge{font-size:6px;padding:3px 6px;letter-spacing:1px;background:rgba(255,255,255,.06);border-radius:2px;}
  .status-badge.blink{animation:badgeblink .7s steps(1) infinite;}
  @keyframes badgeblink{0%{opacity:1;}50%{opacity:.25;}100%{opacity:1;}}
  /* Domain bars */
  #domainBars{display:flex;flex-direction:column;gap:3px;}
  .drow{display:flex;align-items:center;gap:5px;}
  .dlabel{font-size:5px;flex:0 0 34px;text-align:right;letter-spacing:.5px;}
  .dbarwrap{flex:1;height:6px;background:#070710;border:1px solid #2a2050;}
  .dbar{height:100%;transition:width .4s,background-color .4s;}

  /* Form — slides up from bottom of list panel */
  #formToggle{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;
    border-left:3px solid #a88a00;padding:6px 14px;cursor:pointer;letter-spacing:2px;
    box-shadow:0 0 10px rgba(255,215,0,.25);white-space:nowrap;}
  #formPanel{left:0;right:0;bottom:0;width:100%;
    padding:8px;display:none;gap:5px;align-items:stretch;flex-wrap:wrap;
    background:rgba(8,6,20,0.97);border-top:2px solid #4a3a8a;}
  #formPanel.open{display:flex;}
  #formPanel input,#formPanel select{font-family:inherit;font-size:7px;background:#070710;color:var(--text);border:2px solid #4a3a8a;padding:6px;outline:none;width:100%;}
  #formPanel select option{background:#0d0b22;}
  .fgroup{display:flex;flex-direction:column;gap:3px;}
  .flabel{font-size:5px;color:#9a8ad0;letter-spacing:1px;}
  #fgName{flex:1 1 160px;min-width:0;}
  #fgDomain{flex:0 1 110px;}
  #fgType{flex:0 1 90px;}
  #fgGoal{flex:0 0 70px;}
  #fgDate{flex:0 0 auto;}
  #formPanel input::-webkit-calendar-picker-indicator{filter:invert(.8);}
  #addBtn{font-family:inherit;font-size:8px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:8px;cursor:pointer;letter-spacing:1px;white-space:nowrap;}
  #addBtn:active{transform:translateY(2px);border-bottom-width:1px;}

  /* Task list */
  #listPanel{left:0;right:0;bottom:0;width:100%;max-height:40vh;
    background:rgba(8,6,20,0.92);border-top:3px solid var(--gold);display:flex;flex-direction:column;}
  #listHead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 10px;border-bottom:1px solid #2a2050;gap:6px;}
  #listHead .lbl{font-size:7px;color:var(--gold);letter-spacing:1px;}
  #collapseBtn{font-family:inherit;font-size:9px;background:none;border:1px solid #4a3a8a;color:var(--gold);width:24px;height:20px;cursor:pointer;line-height:1;}
  #listBody{overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px;}
  #listPanel.collapsed #listBody{display:none;}
  #listPanel.collapsed{max-height:none;}
  .empty{font-size:7px;color:#6a5aa0;text-align:center;padding:14px;line-height:1.8;}
  .task{display:flex;align-items:center;gap:5px;min-height:36px;background:rgba(12,10,32,0.85);border:1px solid #2a2050;border-left-width:3px;padding:4px 6px;font-size:7px;transition:opacity .4s;}
  .task.overdue{border-color:var(--hp-red)!important;box-shadow:0 0 6px rgba(238,34,34,.4);}
  .task.done{opacity:.4;}.task.done .tname{text-decoration:line-through;}
  .domain-0{border-left-color:#d4884c;}.domain-1{border-left-color:#c8a840;}
  .domain-2{border-left-color:#44aa55;}.domain-3{border-left-color:#cc44aa;}.domain-4{border-left-color:#2288aa;}

  /* Focus panel */
  #focusBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none;}
  #focusBg.open{display:block;}
  #focusPanel{position:fixed;left:0;right:0;bottom:0;max-height:75vh;z-index:20;padding:12px;
    display:flex;flex-direction:column;gap:8px;
    transform:translateY(100%);transition:transform .25s cubic-bezier(.2,0,0,1);}
  #focusPanel.open{transform:translateY(0);}
  #focusHead{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid #2a2050;}
  #focusCls{font-size:5px;color:#9a8ad0;letter-spacing:2px;}
  #focusName{font-size:12px;color:var(--gold);margin:3px 0 2px;}
  #focusDest{font-size:5px;color:#888;letter-spacing:1px;}
  .fclose{font-family:inherit;font-size:11px;background:none;border:1px solid #4a3a8a;color:var(--gold);width:28px;height:28px;cursor:pointer;flex:0 0 auto;}
  #focusHPRow{display:flex;align-items:center;gap:8px;font-size:6px;color:#9a8ad0;}
  #focusHPBar{flex:1;height:8px;background:#070710;border:1px solid #2a2050;}
  #focusHPFill{height:100%;transition:width .4s,background-color .4s;}
  #focusBody{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;min-height:60px;}
  #focusAddBtn{font-family:inherit;font-size:6px;background:rgba(255,215,0,.1);color:var(--gold);
    border:1px solid #4a3060;padding:8px;cursor:pointer;letter-spacing:1px;text-align:center;flex:0 0 auto;}

  /* Check-in */
  #checkinWrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:none;align-items:center;justify-content:center;padding:16px;}
  #checkinWrap.open{display:flex;}
  #checkinBox{width:100%;max-width:480px;max-height:82vh;display:flex;flex-direction:column;gap:8px;padding:14px;}
  .ck-title{font-size:9px;color:var(--gold);text-align:center;letter-spacing:2px;}
  .ck-sub{font-size:5px;color:#9a8ad0;text-align:center;margin-bottom:4px;}
  #checkinList{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;}
  .ck-sect{font-size:5px;letter-spacing:1px;padding:5px 0 3px;border-bottom:1px solid #2a2050;margin-top:4px;}
  #checkinSubmit{font-family:inherit;font-size:8px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:10px;cursor:pointer;letter-spacing:1px;flex:0 0 auto;}
  #checkinBtn{font-family:inherit;font-size:5px;background:rgba(255,215,0,.08);color:var(--gold);border:1px solid #4a3060;padding:5px 8px;cursor:pointer;letter-spacing:1px;text-align:center;}
  #checkinBtn.done{color:#44cc44;border-color:#226622;background:rgba(68,204,68,.08);}
  .cb{width:20px;height:20px;flex:0 0 20px;border:2px solid #4a3a8a;background:#070710;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:9px;}
  .cb.checked{background:var(--hp-green);border-color:var(--hp-green);}
  .cb.checked::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #062;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .25s;}
  @keyframes pop{0%{transform:rotate(45deg) scale(0);}100%{transform:rotate(45deg) scale(1);}}
  .tname{flex:1;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tmeta{display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex:0 0 auto;}
  .tloc{font-size:5px;white-space:nowrap;}
  .ttype{font-size:5px;color:#88ccff;white-space:nowrap;}
  .badge{font-size:6px;padding:3px 4px;border:1px solid;white-space:nowrap;}
  .badge.due{color:#9ad0ff;border-color:#3a5a8a;}
  .badge.over{color:#fff;background:var(--hp-red);border-color:#ff6a6a;}
  .del{flex:0 0 auto;font-family:inherit;font-size:8px;background:#2a0a14;color:#ff8888;border:1px solid #6a2030;padding:4px 6px;cursor:pointer;}

  /* Game over */
  #gameover{position:fixed;inset:0;background:rgba(20,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:20px;}
  #gameover.show{display:flex;}
  #gameover h1{font-size:18px;color:var(--hp-red);}
  #gameover p{font-size:8px;line-height:1.8;color:#ffcccc;}
  #reviveBtn{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;cursor:pointer;}

  /* Desktop: style side bars as intentional panels */
  @media(min-width:601px){
    #portraitCol{top:0;left:0;bottom:0;padding:16px 8px;gap:6px;overflow-y:auto;
      background:rgba(6,4,18,.92);border-right:1px solid #1a1430;justify-content:center;}
    .portCard{width:68px;}
    #statsPanel{top:0;right:0;bottom:0;width:210px;border-radius:0;border-top:none;border-right:none;border-bottom:none;
      overflow-y:auto;padding:12px 0;}
    #statsPanel #statsBody{display:flex;}
    #statsBar{flex-wrap:wrap;cursor:default;}
    #statsChev{display:none;}
    #listPanel{left:96px;right:210px;}
  }

  @media(max-width:600px){
    #portraitCol{top:6px;left:6px;gap:3px;}
    .portCard{width:50px;padding:3px;}
    .portImg,.portCanvas{width:44px;height:44px;}
    .portName{font-size:5px;}
    #statsPanel{width:calc(100% - 64px);right:0;top:0;border-top:none;border-right:none;}
    .stat-name{font-size:8px;}
    #formPanel input,#formPanel select{height:44px;font-size:9px;padding:0 8px;}
    .fgroup{flex:1 1 100%;}
    #fgGoal,#fgDate{flex:1 1 auto;}
    #addBtn{flex:1 1 100%;height:48px;font-size:10px;padding:0;}
    .task{min-height:48px;padding:6px 8px;}.cb{width:26px;height:26px;flex:0 0 26px;}
    .del{padding:10px 12px;font-size:10px;}
  }
</style>
</head>
<body>
<div id="mapWrap"><canvas id="mapCanvas"></canvas></div>
<div id="vignette"></div>

<div id="portraitCol"></div>

<div id="statsPanel" class="hud glass">
  <div id="statsBar" onclick="toggleStats(event)">
    <span class="stat-name" id="heroNameDisplay">HERO</span>
    <input type="text" id="heroNameInput" maxlength="12" placeholder="NAME">
    <span class="hp-inline"><canvas class="icn" id="heartIcn" width="9" height="9"></canvas><span id="hpText">100/100</span></span>
    <span class="tasks-stat"><canvas class="icn" id="scrollIcn" width="9" height="9"></canvas><span id="taskStat">0/0</span></span>
    <span class="status-badge" id="statusBadge">READY</span>
    <span id="statsChev">▾</span>
  </div>
  <div id="statsBody">
    <div class="barwrap"><div class="bar" id="hpBar"></div></div>
    <div id="domainBars"></div>
    <button id="checkinBtn" onclick="showCheckin()">📋 DAILY REPORT</button>
  </div>
</div>
<div id="toast"></div>

<div id="listPanel" class="hud">
  <div id="listHead">
    <span class="lbl">QUEST LOG</span>
    <button id="formToggle" onclick="toggleForm()">＋ ADD TASK</button>
    <button id="collapseBtn">v</button>
  </div>
  <div id="formPanel">
    <div class="fgroup" id="fgName"><label class="flabel" for="taskName">TASK</label>
      <input type="text" id="taskName" placeholder="TASK NAME..." maxlength="60"></div>
    <div class="fgroup" id="fgDomain"><label class="flabel" for="taskDomain">DOMAIN</label>
      <select id="taskDomain"></select></div>
    <div class="fgroup" id="fgType"><label class="flabel" for="taskType">TYPE</label>
      <select id="taskType">
        <option value="0">QUEST</option>
        <option value="1">HABIT</option>
        <option value="2">TARGET</option>
      </select></div>
    <div class="fgroup" id="fgGoal" style="display:none"><label class="flabel" for="taskGoal">GOAL / WK</label>
      <input type="number" id="taskGoal" placeholder="GOAL #" min="1" max="99"></div>
    <div class="fgroup" id="fgDate"><label class="flabel" for="taskDate">DUE DATE (OPTIONAL)</label>
      <input type="date" id="taskDate"></div>
    <button id="addBtn">+ ADD</button>
  </div>
  <div id="listBody"></div>
</div>

<div id="focusBg" onclick="closeFocus()"></div>
<div id="focusPanel" class="glass">
  <div id="focusHead">
    <div>
      <div id="focusCls"></div>
      <div id="focusName"></div>
      <div id="focusDest"></div>
    </div>
    <button class="fclose" onclick="closeFocus()">✕</button>
  </div>
  <div id="focusHPRow">HP <div id="focusHPBar"><div id="focusHPFill"></div></div><span id="focusHPVal"></span></div>
  <div id="focusBody"></div>
  <button id="focusAddBtn" onclick="focusAddTask()">+ ADD TASK TO THIS DOMAIN</button>
</div>

<div id="checkinWrap">
  <div id="checkinBox" class="glass">
    <div class="ck-title">DAILY REPORT</div>
    <div class="ck-sub" id="checkinDate"></div>
    <div id="checkinList"></div>
    <button id="checkinSubmit" onclick="submitCheckin()">SUBMIT REPORT</button>
  </div>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p>ALL UNITS HAVE FALLEN.</p>
  <button id="reviveBtn">RALLY THE PARTY</button>
</div>

<script>
// ============ DOMAINS ============
// Each domain = a life area with a unit that marches toward its objective town
// path: waypoints [[tx,ty],...] from center (6,10) to destination along grid paths
// spriteRgn no longer needed — dedicated sprite files used instead
const DOMAINS = [
  {name:'HOME',  cls:'WIZARD',   dest:'CUSTOM FIELD',   color:'#d4884c', dark:'#8b3a10', targetTx:1,  targetTy:3,
   portraits:['wizard_confident.png','wizard_tired.png','wizard_hurt.png','wizard_critical.png'], sheet:null,
   sprite:'wizard_sprite.png',
   path:[[6,10],[1,10],[1,3]]},
  {name:'WORK',  cls:'MERCHANT', dest:'CORPORATLANDIA', color:'#c8a840', dark:'#7a6010', targetTx:11, targetTy:4,
   portraits:null, sheet:'merchant_sheet.png', sprite:'merchant_sprite.png',
   path:[[6,10],[11,10],[11,4]]},
  {name:'HEALTH',cls:'FIGHTER',  dest:'FITLANTIS',      color:'#44aa55', dark:'#1a5a1a', targetTx:1,  targetTy:17,
   portraits:null, sheet:'fiighter_sheet.png', sprite:'fighter_sprite.png',
   path:[[6,10],[1,10],[1,17]]},
  {name:'CREATIVITY',cls:'BARD', dest:'DISCOTECA',      color:'#cc44aa', dark:'#7a1a6a', targetTx:6,  targetTy:2,
   portraits:null, sheet:'bard_sheet.png', sprite:'bard_sprite.png',
   path:[[6,10],[6,2]]},
  {name:'SOCIAL',cls:'ROGUE',    dest:"ROBBER BARON'S", color:'#2288aa', dark:'#1a4a6a', targetTx:11, targetTy:16,
   portraits:null, sheet:'rogue_sheet.png', sprite:'rogue_sprite.png',
   path:[[6,10],[11,10],[11,16]]},
];

const T_QUEST = 0, T_HABIT = 1, T_TARGET = 2;

// ============ PORTRAITS ============
const spriteImg = new Image(); spriteImg.src = 'wizard_sprite.png';
// Dedicated full-body map sprites per domain
const domainSpriteImgs = DOMAINS.map(d=>{ const i=new Image(); i.src=d.sprite; return i; });
// Preload individual portrait images
const domainPortraitImgs = DOMAINS.map(d => d.portraits ? d.portraits.map(src=>{ const i=new Image(); i.src=src; return i; }) : null);
// Preload portrait sheets (2×2 grid, top-left=ok, top-right=tired, bot-left=hurt, bot-right=crit)
const sheetImgs = DOMAINS.map(d=>{ if(!d.sheet) return null; const i=new Image(); i.src=d.sheet; i.onload=()=>updatePortraits(); return i; });

// Draw one quadrant of a portrait sheet onto a canvas element
// Sheet layout: 2×2 grid (TL=ok, TR=tired, BL=hurt, BR=crit)
// For landscape sheets (sprite on the side), use the square left portion
function drawSheetPortrait(cv,sheetImg,lvl){
  const g=cv.getContext('2d'),cw=cv.width,ch=cv.height;
  g.clearRect(0,0,cw,ch);
  if(!sheetImg.complete||!sheetImg.naturalWidth){ g.fillStyle='#111'; g.fillRect(0,0,cw,ch); return; }
  // Use square grid area — handles both square sheets and landscape (sprite on side)
  const gridPx=Math.min(sheetImg.naturalWidth,sheetImg.naturalHeight);
  const half=gridPx/2;
  const sx=(lvl===1||lvl===3)?half:0;
  const sy=(lvl>=2)?half:0;
  // Draw quadrant, centered-crop to fill portrait card (portrait aspect)
  const srcAR=1; // quadrant is always square (half×half)
  const dstAR=cw/ch;
  let drawW,drawH,drawX,drawY;
  if(srcAR>dstAR){ drawH=ch; drawW=ch; drawX=0; drawY=0; }
  else           { drawW=cw; drawH=cw; drawX=0; drawY=0; }
  // Center-crop the quadrant to fill dst
  const scale=Math.max(cw/half,ch/half);
  const scaledW=half*scale,scaledH=half*scale;
  g.drawImage(sheetImg,sx,sy,half,half,(cw-scaledW)/2,(ch-scaledH)/2,scaledW,scaledH);
}

function buildPortraitCol(){
  const col=document.getElementById('portraitCol');
  DOMAINS.forEach((d,i)=>{
    const card=document.createElement('div'); card.className='portCard'; card.id='pc'+i; card.title=d.cls+' — '+d.dest;
    card.onclick=()=>openFocus(i);
    // Always use canvas so we can render sheets, individual images, or placeholders uniformly
    const cv=document.createElement('canvas'); cv.className='portCanvas'; cv.id='portImg'+i; cv.width=80; cv.height=80;
    renderPortraitCanvas(cv,d,i,0);
    card.appendChild(cv);
    const nm=document.createElement('div'); nm.className='portName'; nm.style.color=d.color; nm.textContent=d.cls; card.appendChild(nm);
    const hw=document.createElement('div'); hw.className='portHPWrap';
    const hf=document.createElement('div'); hf.className='portHPFill'; hf.id='portHP'+i; hw.appendChild(hf); card.appendChild(hw);
    col.appendChild(card);
  });
}

function renderPortraitCanvas(cv,d,idx,lvl){
  if(d.sheet && sheetImgs[idx]){
    drawSheetPortrait(cv,sheetImgs[idx],lvl);
  } else if(d.portraits && domainPortraitImgs[idx]){
    const img=domainPortraitImgs[idx][Math.min(lvl,3)];
    const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
    if(img.complete&&img.naturalWidth) g.drawImage(img,0,0,cv.width,cv.height);
    else { img.onload=()=>{ g.drawImage(img,0,0,cv.width,cv.height); }; drawPortraitPlaceholder(cv,d,lvl); }
  } else {
    drawPortraitPlaceholder(cv,d,lvl);
  }
}

function drawPortraitPlaceholder(cv,d,lvl){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height;
  g.clearRect(0,0,w,h);
  // Background gradient
  const bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,d.dark+'cc'); bg.addColorStop(1,'#0a0818cc');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  // Class icon — large centered letter
  g.fillStyle=d.color+'aa'; g.font='bold 28px monospace'; g.textAlign='center'; g.textBaseline='middle';
  const icons={'WIZARD':'⚗','MERCHANT':'⚖','FIGHTER':'⚔','BARD':'♪','ROGUE':'🗡'};
  g.fillText(icons[d.cls]||d.cls[0],w/2,h/2-6);
  // HP state indicator
  const stateLabels=['OK','LOW','HURT','CRIT'];
  g.font='bold 6px monospace'; g.fillStyle=STATUS_COLOR[lvl]; g.textBaseline='bottom';
  g.fillText(stateLabels[lvl],w/2,h-3);
  // Border glow
  if(lvl>=2){ g.strokeStyle=STATUS_COLOR[lvl]+'66'; g.lineWidth=2; g.strokeRect(1,1,w-2,h-2); }
}

function isOverdue(t){
  if(t.type!==T_QUEST||t.done||!t.due) return false;
  return new Date()>new Date(t.due+'T23:59:59');
}

// ============ HP + PROGRESS PER DOMAIN ============
function domainHP(idx){
  const tasks=state.tasks.filter(t=>(t.domain||0)===idx);
  if(!tasks.length) return HP_MAX;
  let hp=HP_MAX;
  tasks.forEach(t=>{
    if(isOverdue(t)) hp-=15;
    if(t.type===T_HABIT&&!isDoneToday(t)) hp-=5;
    if(t.type===T_TARGET){ const short=Math.max(0,(t.goal||1)-(t.count||0)); hp-=short*8; }
  });
  return Math.max(0,Math.min(HP_MAX,hp));
}

// One step = one "completion event": quest done, habit streak day, or target goal-hit
function countDomainSteps(idx){
  const tasks=state.tasks.filter(t=>(t.domain||0)===idx);
  let s=0;
  tasks.forEach(t=>{
    if(t.type===T_QUEST) s+=t.done?1:0;
    else if(t.type===T_HABIT) s+=(t.streak||0);
    else if(t.type===T_TARGET) s+=Math.floor((t.count||0)/(t.goal||1));
  });
  return s;
}
// Campaigns: each capture costs one full path worth of steps
function domainProgress(idx){
  const caps=(state.captures&&state.captures[idx])||0;
  const totalTiles=DOMAIN_TILES[idx].length;
  const netSteps=countDomainSteps(idx)-caps*totalTiles;
  return Math.max(0,Math.min(1,netSteps/totalTiles));
}
function domainCurrentStep(idx){
  const caps=(state.captures&&state.captures[idx])||0;
  const totalTiles=DOMAIN_TILES[idx].length;
  return Math.max(0,Math.min(totalTiles,countDomainSteps(idx)-caps*totalTiles));
}
function getDomainPendingTasks(idx){
  return state.tasks.filter(t=>{
    if((t.domain||0)!==idx) return false;
    if(t.type===T_QUEST) return !t.done;
    if(t.type===T_HABIT) return true;
    if(t.type===T_TARGET) return (t.count||0)<(t.goal||1);
    return false;
  });
}
function isCaptured(idx){ return ((state.captures&&state.captures[idx])||0)>0; }

// Capture ceremony — fires once per campaign completion
let flashT=0; // screen flash timer (frames)
function checkCaptures(){
  DOMAINS.forEach((d,i)=>{
    if(domainProgress(i)>=1){
      state.captures[i]=(state.captures[i]||0)+1;
      save();
      // Ceremony: banner, screen flash, burst of sparkles at the building
      showToast('🏆 '+d.dest+' CAPTURED BY '+d.cls+'!',d.color);
      flashT=18;
      const bx=d.targetTx*TS+TS/2,by=d.targetTy*TS+TS/2;
      for(let k=0;k<3;k++) setTimeout(()=>sparkleAt(bx,by),k*350);
      const pc=document.getElementById('pc'+i);
      if(pc){ pc.classList.remove('flash'); void pc.offsetWidth; pc.classList.add('flash'); }
      if(!localStorage.getItem('ta_hint2')){
        localStorage.setItem('ta_hint2','1');
        setTimeout(()=>showToast('A NEW CAMPAIGN BEGINS — MARCH AGAIN!'),2800);
      }
    }
  });
}

function hpLevel(){ return hpLevelOf(state.hp); }
function hpLevelOf(hp){ if(hp>=75) return 0; if(hp>=50) return 1; if(hp>=25) return 2; return 3; }

function recalcHP(){

function fmtDue(due){ if(!due) return ''; const d=new Date(due+'T00:00:00'); return 'Due '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate(); }

function renderList(){
  const el=document.getElementById('listBody'); el.innerHTML='';
  if(!state.tasks.length){ el.innerHTML='<div class="empty">NO TASKS YET.<br>ADD ONE TO BEGIN!</div>'; return; }
  const sorted=[...state.tasks].sort((a,b)=>{
    const ao=isOverdue(a),bo=isOverdue(b); if(ao!==bo) return ao?-1:1;
    const ad=a.domain||0,bd=b.domain||0; if(ad!==bd) return ad-bd;
    return (a.due||'9999').localeCompare(b.due||'9999');
  });
  sorted.forEach(task=>{

    const meta=document.createElement('div'); meta.className='tmeta';

      tl.textContent=doneToday?'✓ TODAY':(task.streak>1?'↻ '+task.streak+'🔥':'↻ HABIT'); meta.appendChild(tl);
    } else if(task.type===T_TARGET){
      const tl=document.createElement('div'); tl.className='ttype'; tl.textContent=(task.count||0)+'/'+(task.goal||1)+' WK'; meta.appendChild(tl);
    }

    if(task.type===T_QUEST&&task.due){ const badge=document.createElement('div'); badge.className=over?'badge over':'badge due'; badge.textContent=over?'OVERDUE':fmtDue(task.due); div.appendChild(badge); }
    if(task.type===T_TARGET){ const badge=document.createElement('div'); const pct=Math.min(100,Math.round(((task.count||0)/(task.goal||1))*100)); badge.className='badge due'; badge.style.color=hpColor(pct); badge.style.borderColor=hpColor(pct); badge.textContent=pct+'%'; div.appendChild(badge); }
    const del=document.createElement('button'); del.className='del'; del.textContent='X'; del.onclick=()=>deleteTask(task.id); div.appendChild(del);
    el.appendChild(div);
  });
}

function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const d=DOMAINS[t.domain||0];
  if(t.type===T_HABIT){

    } else { t.lastDone=null; t.streak=Math.max(0,(t.streak||1)-1); }
  } else if(t.type===T_TARGET){

}

// ============ MAP ============
const mc=document.getElementById('mapCanvas');
const mx=mc.getContext('2d');
const TS=20,COLS=13,ROWS=20;
let MAP=buildMap();
// Units start at distinct tiles near center crossroads (one per path branch)
const UNIT_STARTS=[[4,10],[8,10],[4,11],[6,8],[8,11]];
let unitPos=UNIT_STARTS.map(([tx,ty])=>({x:tx*TS+TS/2,y:ty*TS+TS/2}));
const UNIT_SPEED=0.35;
let sparkles=[];
let mapScale=1,mapOX=0,mapOY=0;

function buildMap(){
  const m=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  const set=(y,x,t)=>{ if(y>=0&&y<ROWS&&x>=0&&x<COLS) m[y][x]=t; };
  const water=(y,x)=>set(y,x,3);
  const tree=(y,x)=>{ if(m[y]&&m[y][x]===0) set(y,x,4); };
  const rock=(y,x)=>{ if(m[y]&&m[y][x]===0) set(y,x,2); };

  // Sea — top-right corner + coastal strip
  for(let y=0;y<8;y++) for(let x=12;x<COLS;x++) water(y,x);
  for(let y=0;y<5;y++) water(y,11);
  for(let y=0;y<3;y++) water(y,10);

  // River — cuts horizontally through mid-map
  for(let x=2;x<9;x++) water(7,x);
  water(7,9); water(8,9); water(8,10);
  // River fords (gaps left at col 1 and col 6 for crossing)

  // Lake — bottom right
  for(let y=13;y<17;y++) for(let x=9;x<12;x++) water(y,x);
  water(12,10); water(12,11); water(17,10);

  // Rocky ridges
  [[1,5],[2,5],[2,6],[1,6],[3,7],[4,7]].forEach(([y,x])=>rock(y,x));
  [[13,3],[14,3],[14,4],[15,4]].forEach(([y,x])=>rock(y,x));
  [[5,11],[5,10],[6,11]].forEach(([y,x])=>rock(y,x));

  // Forest clusters — scattered across open areas
  [
    [0,2],[0,3],[1,2],[1,3],       // top-left
    [3,3],[4,3],[3,4],[4,4],       // mid-left upper
    [0,7],[0,8],[1,8],[1,9],       // top-mid
    [3,9],[4,9],[3,10],            // right-of-center upper
    [9,1],[10,1],[9,2],[10,2],     // left flank mid
    [10,5],[11,5],[11,6],[10,6],   // center-lower
    [15,5],[16,5],[15,6],          // lower-center
    [17,2],[18,2],[18,3],[17,3],   // bottom-left woods
    [16,8],[17,8],[16,9],          // bottom-center-right
    [18,12],[19,12],[19,11],       // bottom-right corner
  ].forEach(([y,x])=>tree(y,x));

  // Set objective tiles (don't overwrite water or rock)
  DOMAINS.forEach(d=>{
    const t=m[d.targetTy]&&m[d.targetTy][d.targetTx];
    if(t!==3&&t!==2) set(d.targetTy,d.targetTx,5);
  });
  return m;
}

function sparkleAt(x,y){ for(let i=0;i<12;i++) sparkles.push({x,y,a:Math.PI/6*i,t:0}); }
function fitMap(){ mc.width=window.innerWidth; mc.height=Math.max(340,window.innerHeight); }
window.addEventListener('resize',fitMap);

const UNIT_W=32,UNIT_H=32; // map sprite size in tile-pixels (matches 32×32 source)
function drawUnit(x,y,idx,hp){
  const d=DOMAINS[idx],lvl=hpLevelOf(hp);
  // Drop shadow
  mx.fillStyle='rgba(0,0,0,.4)'; mx.beginPath(); mx.ellipse(x+1,y+UNIT_H/2+2,8,3,0,0,7); mx.fill();
  // Draw dedicated sprite image
  const sImg=domainSpriteImgs[idx];
  if(sImg && sImg.complete && sImg.naturalWidth>0){
    mx.drawImage(sImg,0,0,sImg.naturalWidth,sImg.naturalHeight,x-UNIT_W/2,y-UNIT_H,UNIT_W,UNIT_H);
  } else {
    mx.fillStyle=d.color; mx.beginPath(); mx.moveTo(x,y-UNIT_H); mx.lineTo(x+UNIT_W/2,y-UNIT_H/2); mx.lineTo(x,y); mx.lineTo(x-UNIT_W/2,y-UNIT_H/2); mx.closePath(); mx.fill();
    mx.fillStyle='#fff'; mx.font='bold 7px monospace'; mx.textAlign='center'; mx.textBaseline='middle'; mx.fillText(d.cls[0],x,y-UNIT_H/2);
  }
  if(lvl>0){ mx.fillStyle=STATUS_COLOR[lvl]; mx.beginPath(); mx.arc(x,y-UNIT_H-3,2.5,0,7); mx.fill(); }
}
function xEyes(x,ey){ mx.strokeStyle='#ee2222'; mx.lineWidth=1; mx.beginPath(); mx.moveTo(x-3,ey-1); mx.lineTo(x-1,ey+1); mx.moveTo(x-1,ey-1); mx.lineTo(x-3,ey+1); mx.stroke(); mx.beginPath(); mx.moveTo(x+1,ey-1); mx.lineTo(x+3,ey+1); mx.moveTo(x+3,ey-1); mx.lineTo(x+1,ey+1); mx.stroke(); }
function drawWizard(x,y,col,dark,lvl){

function drawObjective(d,captured,idx){
  const cx=d.targetTx*TS+TS/2,cy=d.targetTy*TS+TS/2;
  if(idx===0) drawHomeHQ(cx,cy,captured,d);
  else if(idx===1) drawFort(cx,cy,captured,d);
  else if(idx===2) drawArena(cx,cy,captured,d);
  else if(idx===3) drawTavern(cx,cy,captured,d);
  else if(idx===4) drawMansion(cx,cy,captured,d);
  // name plate
  mx.font='3.5px "Press Start 2P",monospace'; mx.textAlign='center'; mx.textBaseline='top';
  const tw=mx.measureText(d.dest).width;
  mx.fillStyle='rgba(5,5,16,.82)'; mx.fillRect(cx-tw/2-2,cy+14,tw+4,6.5);
  mx.fillStyle=captured?'#ffe840':'#ffd0d0'; mx.fillText(d.dest,cx,cy+15);
  // campaign stars — one per capture
  const caps=(state.captures&&state.captures[idx])||0;
  if(caps>0){
    mx.font='4px serif'; mx.fillStyle='#ffe840';
    const stars='★'.repeat(Math.min(caps,5));
    mx.fillText(stars,cx,cy+21.5);
  }
}

function drawHomeHQ(cx,cy,captured,d){
  const homeTasks=state.tasks.filter(t=>(t.domain||0)===0);
  const habitTasks=homeTasks.filter(t=>t.type===T_HABIT);
  const questTasks=homeTasks.filter(t=>t.type===T_QUEST);
  const habitDoneCount=habitTasks.filter(t=>isDoneToday(t)).length;
  const habitTotal=habitTasks.length;
  const messRatio=habitTotal>0?(habitTotal-habitDoneCount)/habitTotal:0; // 0=clean, 1=messy
  const questDone=questTasks.filter(t=>t.done).length;
  // expansion level: 0=shack, 1=small house, 2=house+wing, 3=manor
  const expLevel=Math.min(3,questDone);

  const baseColor=captured?'#d4884c':'#7a5528';
  const roofColor=captured?'#8b3a10':'#4a2810';

  if(captured){ mx.fillStyle='rgba(255,220,80,0.15)'; mx.beginPath(); mx.arc(cx,cy-4,26+expLevel*4,0,7); mx.fill(); }

  // Main structure — grows with expLevel
  const w=14+expLevel*4, h=12+expLevel*2;
  mx.fillStyle=baseColor; mx.fillRect(cx-w/2,cy-2,w,h);
  mx.fillStyle='rgba(0,0,0,.25)'; mx.fillRect(cx+w/2-6,cy-2,6,h);

  // Roof
  const rw=w+4;
  mx.fillStyle=roofColor;
  mx.beginPath(); mx.moveTo(cx-rw/2,cy-2); mx.lineTo(cx,cy-14-expLevel*2); mx.lineTo(cx+rw/2,cy-2); mx.closePath(); mx.fill();
  mx.fillStyle='rgba(255,255,255,.12)';
  mx.beginPath(); mx.moveTo(cx-rw/2,cy-2); mx.lineTo(cx,cy-14-expLevel*2); mx.lineTo(cx-4,cy-2); mx.closePath(); mx.fill();

  // Wing extension when expLevel >= 2
  if(expLevel>=2){
    mx.fillStyle=baseColor; mx.fillRect(cx+w/2,cy,10,8);
    mx.fillStyle=roofColor;
    mx.beginPath(); mx.moveTo(cx+w/2,cy); mx.lineTo(cx+w/2+5,cy-6); mx.lineTo(cx+w/2+10,cy); mx.closePath(); mx.fill();
  }

  // Tower/manor spire when expLevel >= 3
  if(expLevel>=3){
    mx.fillStyle=baseColor; mx.fillRect(cx-4,cy-24,8,14);
    mx.fillStyle=roofColor;
    mx.beginPath(); mx.moveTo(cx-4,cy-24); mx.lineTo(cx,cy-32); mx.lineTo(cx+4,cy-24); mx.closePath(); mx.fill();
  }

  // Door
  mx.fillStyle=captured?'#ffe080':'#330000'; mx.fillRect(cx-3,cy+3,6,h-5);

  // Windows
  mx.fillStyle=captured?'#ffe08088':'#22000066'; mx.fillRect(cx-w/2+4,cy,5,5);
  if(expLevel>=1) mx.fillRect(cx+w/2-9,cy,5,5);

  // Mess overlays — clutter/debris when habits not done
  if(messRatio>0){
    mx.globalAlpha=messRatio*0.75;
    // dirt pile left
    mx.fillStyle='#5a3a10';
    mx.beginPath(); mx.ellipse(cx-w/2+2,cy+h-1,5,2,0,0,7); mx.fill();
    // debris right
    mx.fillStyle='#4a4a30';
    mx.fillRect(cx+w/2-8,cy+h,4,2); mx.fillRect(cx+w/2-5,cy+h+1,2,3);
    // crack on wall when very messy
    if(messRatio>0.5){
      mx.strokeStyle='#2a1a08'; mx.lineWidth=0.7;
      mx.beginPath(); mx.moveTo(cx-3,cy+2); mx.lineTo(cx-5,cy+7); mx.lineTo(cx-2,cy+10); mx.stroke();
      // weeds
      mx.strokeStyle='#2a5a10'; mx.lineWidth=0.8;
      mx.beginPath(); mx.moveTo(cx-w/2,cy+h); mx.lineTo(cx-w/2+1,cy+h-4); mx.stroke();
      mx.beginPath(); mx.moveTo(cx+w/2,cy+h); mx.lineTo(cx+w/2+2,cy+h-5); mx.stroke();
    }
    mx.globalAlpha=1;
  }

  // Flag
  const flagY=expLevel>=3?cy-32:cy-14-expLevel*2;
  mx.strokeStyle=captured?'#ccc':'#555'; mx.lineWidth=1.2;
  mx.beginPath(); mx.moveTo(cx,flagY); mx.lineTo(cx,flagY-9); mx.stroke();
  mx.fillStyle=captured?d.color:'#882222';
  mx.beginPath(); mx.moveTo(cx,flagY-9); mx.lineTo(cx+8,flagY-5); mx.lineTo(cx,flagY); mx.closePath(); mx.fill();
  if(captured){ mx.fillStyle='#ffe840'; mx.font='6px serif'; mx.textAlign='center'; mx.textBaseline='middle'; mx.fillText('★',cx+4,flagY-5); }
}

// WORK — walled fort/citadel (Merchant's trade hub)
function drawFort(cx,cy,captured,d){
  const col=captured?d.color:'#6a5a28', wall=captured?d.dark:'#3a3018';
  if(captured){ mx.fillStyle='rgba(255,220,80,.18)'; mx.beginPath(); mx.arc(cx,cy,24,0,7); mx.fill(); }
  // Outer wall
  mx.fillStyle=wall; mx.fillRect(cx-14,cy-4,28,16);
  // Wall battlements
  for(let bx=-12;bx<=12;bx+=4){ mx.fillStyle=wall; mx.fillRect(cx+bx-1,cy-8,3,5); }
  // Inner keep
  mx.fillStyle=col; mx.fillRect(cx-8,cy-8,16,20);
  mx.fillStyle='rgba(0,0,0,.2)'; mx.fillRect(cx+4,cy-8,4,20);
  // Tower left
  mx.fillStyle=wall; mx.fillRect(cx-16,cy-10,7,22);
  mx.fillStyle=col; mx.fillRect(cx-15,cy-14,5,5);
  // Tower right
  mx.fillStyle=wall; mx.fillRect(cx+9,cy-10,7,22);
  mx.fillStyle=col; mx.fillRect(cx+10,cy-14,5,5);
  // Gate arch
  mx.fillStyle=captured?'#ffe080':'#111'; mx.fillRect(cx-4,cy+3,8,9);
  mx.fillStyle=wall; mx.beginPath(); mx.arc(cx,cy+3,4,Math.PI,0); mx.fill();
  // Flag
  mx.strokeStyle=captured?'#ddd':'#666'; mx.lineWidth=1; mx.beginPath(); mx.moveTo(cx,cy-8); mx.lineTo(cx,cy-20); mx.stroke();
  mx.fillStyle=captured?d.color:'#882222';
  mx.beginPath(); mx.moveTo(cx,cy-20); mx.lineTo(cx+10,cy-15); mx.lineTo(cx,cy-10); mx.closePath(); mx.fill();
  if(captured){ mx.fillStyle='#ffe840'; mx.font='7px serif'; mx.textAlign='center'; mx.textBaseline='middle'; mx.fillText('★',cx+5,cy-15); }
}

// HEALTH — arena/coliseum (Fighter's training ground)
function drawArena(cx,cy,captured,d){
  const col=captured?d.color:'#2a5a2a', edge=captured?d.dark:'#1a3a10';
  if(captured){ mx.fillStyle='rgba(68,170,85,.2)'; mx.beginPath(); mx.arc(cx,cy,22,0,7); mx.fill(); }
  // Outer ring
  mx.strokeStyle=edge; mx.lineWidth=4;
  mx.beginPath(); mx.arc(cx,cy-2,14,0,7); mx.stroke();
  mx.fillStyle=col;
  mx.beginPath(); mx.arc(cx,cy-2,12,0,7); mx.fill();
  // Inner sand
  mx.fillStyle='#8a6830';
  mx.beginPath(); mx.arc(cx,cy-2,8,0,7); mx.fill();
  mx.fillStyle='#a07840';
  mx.beginPath(); mx.arc(cx-2,cy-4,5,0,7); mx.fill();
  // Archways around ring
  for(let a=0;a<6;a++){
    const ang=a/6*Math.PI*2;
    const rx=cx+Math.cos(ang)*11, ry=cy-2+Math.sin(ang)*11;
    mx.fillStyle=edge; mx.beginPath(); mx.arc(rx,ry,2.5,0,7); mx.fill();
  }
  // Crossed swords icon in center
  mx.strokeStyle=captured?'#ffe840':'#888'; mx.lineWidth=1.2;
  mx.beginPath(); mx.moveTo(cx-4,cy-6); mx.lineTo(cx+4,cy+2); mx.stroke();
  mx.beginPath(); mx.moveTo(cx+4,cy-6); mx.lineTo(cx-4,cy+2); mx.stroke();
}

// CREATIVITY — tavern/theater (Bard's stage)
function drawTavern(cx,cy,captured,d){
  const col=captured?d.color:'#6a2a6a', roof=captured?d.dark:'#3a1840';
  if(captured){ mx.fillStyle='rgba(204,68,170,.18)'; mx.beginPath(); mx.arc(cx,cy,22,0,7); mx.fill(); }
  // Main building
  mx.fillStyle=col; mx.fillRect(cx-11,cy-2,22,14);
  mx.fillStyle='rgba(0,0,0,.2)'; mx.fillRect(cx+5,cy-2,6,14);
  // Thatched roof — jagged
  mx.fillStyle=roof;
  mx.beginPath(); mx.moveTo(cx-13,cy-2); mx.lineTo(cx,cy-18); mx.lineTo(cx+13,cy-2); mx.closePath(); mx.fill();
  mx.fillStyle='rgba(255,200,255,.1)';
  mx.beginPath(); mx.moveTo(cx-13,cy-2); mx.lineTo(cx,cy-18); mx.lineTo(cx-4,cy-2); mx.closePath(); mx.fill();
  // Thatch lines
  mx.strokeStyle=captured?'rgba(204,68,170,.5)':'rgba(80,20,80,.4)'; mx.lineWidth=1;

  // Door + windows
  mx.fillStyle=captured?'#ffe0a0':'#220011'; mx.fillRect(cx-3,cy+5,6,7);
  mx.fillStyle=captured?'rgba(255,200,100,.6)':'rgba(30,0,30,.5)'; mx.fillRect(cx-10,cy,5,5); mx.fillRect(cx+5,cy,5,5);
  // Lanterns
  if(captured){
    mx.fillStyle='rgba(255,220,80,.7)'; mx.beginPath(); mx.arc(cx-13,cy-2,3,0,7); mx.fill();
    mx.beginPath(); mx.arc(cx+13,cy-2,3,0,7); mx.fill();
  }
}

// SOCIAL — manor/estate (Rogue's hideout)
function drawMansion(cx,cy,captured,d){
  const col=captured?d.color:'#1a3a4a', dark=captured?d.dark:'#0a1a28';
  if(captured){ mx.fillStyle='rgba(34,136,170,.2)'; mx.beginPath(); mx.arc(cx,cy,24,0,7); mx.fill(); }
  // Foundation
  mx.fillStyle='#2a2a2a'; mx.fillRect(cx-15,cy+10,30,4);
  // Main wing
  mx.fillStyle=col; mx.fillRect(cx-13,cy-4,26,14);
  mx.fillStyle='rgba(0,0,0,.2)'; mx.fillRect(cx+7,cy-4,6,14);
  // Left tower
  mx.fillStyle=dark; mx.fillRect(cx-15,cy-8,8,22);
  mx.fillStyle=col; mx.fillRect(cx-14,cy-12,6,5);
  // Right tower
  mx.fillStyle=dark; mx.fillRect(cx+7,cy-8,8,22);
  mx.fillStyle=col; mx.fillRect(cx+8,cy-12,6,5);
  // Pitched roof
  mx.fillStyle=dark;
  mx.beginPath(); mx.moveTo(cx-13,cy-4); mx.lineTo(cx,cy-16); mx.lineTo(cx+13,cy-4); mx.closePath(); mx.fill();
  mx.fillStyle='rgba(255,255,255,.08)';
  mx.beginPath(); mx.moveTo(cx-13,cy-4); mx.lineTo(cx,cy-16); mx.lineTo(cx-4,cy-4); mx.closePath(); mx.fill();
  // Many windows (mansion vibe)
  const winCol=captured?'rgba(100,220,255,.6)':'rgba(20,40,80,.5)';
  mx.fillStyle=winCol;
  [-8,-3,2,7].forEach(ox=>mx.fillRect(cx+ox,cy-2,3,4));
  mx.fillRect(cx-13,cy-4,3,4); mx.fillRect(cx+10,cy-4,3,4);
  // Grand entrance
  mx.fillStyle=captured?'#ffe080':'#0a0a18'; mx.fillRect(cx-4,cy+3,8,11);
  mx.strokeStyle=captured?d.color:'#333'; mx.lineWidth=1.5; mx.beginPath(); mx.arc(cx,cy+3,4,Math.PI,0); mx.stroke();
  // Flag × 2
  [cx-11,cx+11].forEach(fx=>{
    mx.strokeStyle=captured?'#ccc':'#444'; mx.lineWidth=.8; mx.beginPath(); mx.moveTo(fx,cy-12); mx.lineTo(fx,cy-22); mx.stroke();
    mx.fillStyle=captured?d.color:'#662222';
    mx.beginPath(); mx.moveTo(fx,cy-22); mx.lineTo(fx+7,cy-18); mx.lineTo(fx,cy-13); mx.closePath(); mx.fill();
  });
}


function grassColor(tx,ty,v){
  if(ty<7&&tx<4)  return ['#24511e','#285a21','#1e461a'][v];  // HOME: warm green
  if(ty<6&&tx>7)  return ['#2a4d18','#305821','#254515'][v];  // WORK: golden green
  if(ty>13&&tx<4) return ['#1a4f20','#1d5823','#165018'][v];  // HEALTH: lush
  if(ty>12&&tx>7) return ['#0f2a14','#122e17','#0a2410'][v];  // SOCIAL: dark
  if(ty<6&&tx>3&&tx<8) return ['#2e1a4a','#341e54','#28163e'][v]; // CREATIVITY: twilight
  return ['#1e4d1e','#236123','#1a431a'][v];
}

function pathTiles(waypts){
  const tiles=[];
  if(!waypts||!waypts.length) return tiles;
  for(let i=0;i<waypts.length-1;i++){
    const [ax,ay]=waypts[i],[bx,by]=waypts[i+1];
    if(ax!==bx){ const dx=bx>ax?1:-1; for(let x=ax+dx;x!==bx+dx;x+=dx) tiles.push([x,ay]); }
    if(ay!==by){ const dy=by>ay?1:-1; for(let y=ay+dy;y!==by+dy;y+=dy) tiles.push([bx,y]); }
  }
  return tiles;
}
const DOMAIN_TILES=DOMAINS.map(d=>pathTiles(d.path));

function posOnPath(waypts,prog){
  if(!waypts||!waypts.length) return {x:6*TS+TS/2,y:10*TS+TS/2};
  if(prog<=0) return {x:waypts[0][0]*TS+TS/2,y:waypts[0][1]*TS+TS/2};
  if(prog>=1){const w=waypts[waypts.length-1];return {x:w[0]*TS+TS/2,y:w[1]*TS+TS/2};}
  // Build orthogonal sub-segments: each waypoint pair becomes H then V (or V then H)
  // This guarantees units only ever move horizontally or vertically
  const segs=[];
  for(let i=1;i<waypts.length;i++){
    const [ax,ay]=waypts[i-1],[bx,by]=waypts[i];
    if(ax!==bx) segs.push({x1:ax,y1:ay,x2:bx,y2:ay}); // horizontal
    if(ay!==by) segs.push({x1:bx,y1:ay,x2:bx,y2:by}); // vertical
  }
  const lens=segs.map(s=>Math.abs(s.x2-s.x1)+Math.abs(s.y2-s.y1));
  const total=lens.reduce((a,b)=>a+b,0);
  const dist=prog*total; let walked=0;
  for(let i=0;i<segs.length;i++){
    if(walked+lens[i]>=dist){
      const t=(dist-walked)/lens[i];
      return {x:(segs[i].x1+(segs[i].x2-segs[i].x1)*t)*TS+TS/2,
              y:(segs[i].y1+(segs[i].y2-segs[i].y1)*t)*TS+TS/2};
    }
    walked+=lens[i];
  }
  const w=waypts[waypts.length-1];return {x:w[0]*TS+TS/2,y:w[1]*TS+TS/2};
}

function drawMap(time){
  const W=mc.width,H=mc.height;
  mx.clearRect(0,0,W,H);

  // Uniform scaling: fill width on portrait, fill height on landscape
  const mapAR=COLS/ROWS, screenAR=W/H;
  mapScale = screenAR<mapAR ? W/(COLS*TS) : H/(ROWS*TS);
  mapOX = (W-COLS*TS*mapScale)/2;
  mapOY = (H-ROWS*TS*mapScale)/2;

  // Fill letterbox bars — subtle checker so dead space looks intentional
  if(mapOX>0.5||mapOY>0.5){
    mx.fillStyle='#070612'; mx.fillRect(0,0,W,H);
    mx.fillStyle='rgba(255,255,255,.018)';
    const cs=28;
    for(let cy2=0;cy2<H;cy2+=cs) for(let cx2=0;cx2<W;cx2+=cs){
      if(((cx2+cy2)/cs)%2===0) mx.fillRect(cx2,cy2,cs,cs);
    }
  }

  mx.save();
  mx.translate(mapOX,mapOY);
  mx.scale(mapScale,mapScale);

  // Tiles
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=MAP[y][x],px0=x*TS,py0=y*TS,v=(x*13+y*7)%3;
    if(t===0||t===4||t===5){
      mx.fillStyle=grassColor(x,y,v); mx.fillRect(px0,py0,TS,TS);
      // Grass detail
      mx.fillStyle='rgba(80,180,80,.25)'; if((x+y)%2===0) mx.fillRect(px0+3,py0+3,3,3);
      mx.fillRect(px0+13,py0+11,2,2); mx.fillRect(px0+8,py0+15,2,2);
    } else if(t===3){
      // Water
      mx.fillStyle='#152d5e'; mx.fillRect(px0,py0,TS,TS);
      mx.fillStyle='rgba(40,110,200,.35)';
      mx.fillRect(px0,py0,TS,TS);
      mx.strokeStyle='rgba(80,160,255,.5)'; mx.lineWidth=1;
      for(let wy=3;wy<TS;wy+=6){
        mx.beginPath();
        for(let wx=0;wx<=TS;wx+=2){
          const yy=py0+wy+Math.sin((px0+wx)/4+time/300+wy)*1.4;
          wx===0?mx.moveTo(px0+wx,yy):mx.lineTo(px0+wx,yy);
        }
        mx.stroke();
      }
    } else if(t===2){
      // Rocky/mountain tile
      mx.fillStyle='#5a5060'; mx.fillRect(px0,py0,TS,TS);
      mx.fillStyle='#7a7088'; mx.fillRect(px0+2,py0+2,TS-4,TS-6);
      mx.fillStyle='rgba(255,255,255,.08)'; mx.fillRect(px0+3,py0+3,TS-6,2);
      mx.fillStyle='rgba(0,0,0,.35)'; mx.fillRect(px0,py0+TS-3,TS,3);
    }
    // Grid shadow lines (skip water)
    if(t!==3){ mx.fillStyle='rgba(0,0,0,.18)'; mx.fillRect(px0,py0+TS-1,TS,1); mx.fillRect(px0+TS-1,py0,1,TS); }
  }

  // Trees — layered for depth
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(MAP[y][x]!==4) continue;
    const cxp=x*TS+TS/2,cyp=y*TS+TS/2;
    // Shadow
    mx.fillStyle='rgba(0,0,0,.3)'; mx.beginPath(); mx.ellipse(cxp+1,cyp+8,8,3,0,0,7); mx.fill();
    // Trunk — clearly visible so it reads as a tree, not an orb
    mx.fillStyle='#5a3a1a'; mx.fillRect(cxp-2,cyp+2,4,7);
    mx.fillStyle='#3a2410'; mx.fillRect(cxp,cyp+2,2,7);
    // Pine canopy — three stacked triangle layers
    const tri=(yTop,half,yBase,col)=>{ mx.fillStyle=col; mx.beginPath(); mx.moveTo(cxp,yTop); mx.lineTo(cxp+half,yBase); mx.lineTo(cxp-half,yBase); mx.closePath(); mx.fill(); };
    tri(cyp-7,9,cyp+4,'#0f3010');
    tri(cyp-11,7,cyp-1,'#1a5018');
    tri(cyp-15,5,cyp-6,'#2a7424');
    // Left-edge highlight
    mx.fillStyle='#4aa83a'; mx.fillRect(cxp-3,cyp-9,2,2); mx.fillRect(cxp-2,cyp-13,2,2);
  }

  // Objectives
  DOMAINS.forEach((d,i)=>drawObjective(d,isCaptured(i),i));

  // Sparkles
  sparkles.forEach(s=>{ s.t+=0.05; const r=s.t*24,a=1-s.t; if(a>0){mx.fillStyle='rgba(255,255,180,'+a+')';mx.fillRect(s.x+Math.cos(s.a)*r-2,s.y+Math.sin(s.a)*r-2,4,4);} });
  sparkles=sparkles.filter(s=>s.t<1);

  // Commander at crossroads (6,10) — drawn first so units appear on top
  const pulse=0.5+0.5*Math.sin(time/250);
  const hx=6*TS+TS/2,hy=10*TS+TS/2,lvl=hpLevel();
  const tokCol=['#3a7aff','#ffcc22','#ff8822','#ff2a2a'][lvl];
  if(lvl>0){
    mx.strokeStyle=tokCol+'aa'; mx.lineWidth=2;
    mx.beginPath(); mx.arc(hx,hy+5,12+pulse*4,0,7); mx.stroke();
  }
  mx.fillStyle='rgba(0,0,0,.35)'; mx.beginPath(); mx.ellipse(hx,hy+7,9,4,0,0,7); mx.fill();
  mx.save(); mx.shadowColor=tokCol; mx.shadowBlur=14;
  if(spriteImg.complete&&spriteImg.naturalWidth>0){ mx.drawImage(spriteImg,hx-14,hy-18,28,32); }
  else{ mx.fillStyle=tokCol; mx.beginPath(); mx.moveTo(hx,hy-14); mx.lineTo(hx+14,hy); mx.lineTo(hx,hy+14); mx.lineTo(hx-14,hy); mx.closePath(); mx.fill(); }
  mx.restore();
  if(lvl===3){ const v=mx.createRadialGradient(COLS*TS/2,ROWS*TS/2,40,COLS*TS/2,ROWS*TS/2,COLS*TS); v.addColorStop(0,'rgba(238,34,34,0)'); v.addColorStop(1,'rgba(180,0,0,0.5)'); mx.fillStyle=v; mx.fillRect(0,0,COLS*TS,ROWS*TS); }

  // Domain units — skip idx 0 (HOME/WIZARD) since commander sprite already represents it
  DOMAINS.forEach((d,i)=>{
    if(i===0) return;
    const prog=domainProgress(i),hp=domainHP(i);
    // Only move units when there is actual progress — never pull back toward center
    if(prog>0){
      const tgt=posOnPath(d.path,prog);
      const dx=tgt.x-unitPos[i].x,dy=tgt.y-unitPos[i].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>0.5){ unitPos[i].x+=dx/dist*UNIT_SPEED; unitPos[i].y+=dy/dist*UNIT_SPEED; }
    }
    // Faint dotted trail for orientation
    if(prog>0&&prog<1){
      mx.fillStyle=d.color+'33';
      for(let f=prog+0.04;f<1;f+=0.05){
        const pt=posOnPath(d.path,f);
        mx.fillRect(pt.x-1,pt.y-1,2,2);
      }
    }
    // Task markers: pending tasks appear as small flags on upcoming path tiles
    {
      const pending=getDomainPendingTasks(i);
      const tiles=DOMAIN_TILES[i];
      const step=domainCurrentStep(i);
      pending.forEach((task,k)=>{
        const tileIdx=step+k;
        if(tileIdx>=tiles.length) return;
        const [tx,ty]=tiles[tileIdx];
        const px=tx*TS+TS/2, py=ty*TS+TS/2;
        // Tile highlight
        mx.fillStyle=d.color+'44';
        mx.fillRect(tx*TS+1,ty*TS+1,TS-2,TS-2);
        // Mini flag
        const fc=task.type===T_QUEST?'#ffe040':task.type===T_HABIT?'#44eeff':'#ff9944';
        mx.fillStyle=d.color+'cc';
        mx.fillRect(px-1,py-8,1.5,7);
        mx.fillStyle=fc;
        mx.beginPath(); mx.moveTo(px-0.5,py-8); mx.lineTo(px+5,py-5); mx.lineTo(px-0.5,py-2); mx.closePath(); mx.fill();
      });
    }
    // Status ring only when degraded — a healthy unit needs no alert
    const ulvl=hpLevelOf(hp);
    if(ulvl>0){
      mx.strokeStyle=STATUS_COLOR[ulvl]+'aa'; mx.lineWidth=1.5;
      mx.beginPath(); mx.arc(unitPos[i].x,unitPos[i].y+8,11+pulse*3,0,7); mx.stroke();
    }
    drawUnit(unitPos[i].x,unitPos[i].y,i,hp);
    // Tile progress plate under marching units
    if(prog>0&&prog<1){
      const step=domainCurrentStep(i);
      const txt=step+'/'+DOMAIN_TILES[i].length;
      mx.font='3px "Press Start 2P",monospace'; mx.textAlign='center'; mx.textBaseline='top';
      const tw2=mx.measureText(txt).width;
      mx.fillStyle='rgba(5,5,16,.8)'; mx.fillRect(unitPos[i].x-tw2/2-1.5,unitPos[i].y+11,tw2+3,5);
      mx.fillStyle=d.color; mx.fillText(txt,unitPos[i].x,unitPos[i].y+12);
    }
  });

  // Capture flash — quick white pulse over the whole map
  if(flashT>0){
    mx.fillStyle='rgba(255,250,220,'+(flashT/18*0.45)+')';
    mx.fillRect(0,0,COLS*TS,ROWS*TS);
    flashT--;
  }

  mx.restore();

  // Decorative frame around the map when letterboxed (desktop) — JRPG bezel
  if(mapOX>10||mapOY>10){
    const fx=mapOX,fy=mapOY,fw=COLS*TS*mapScale,fh=ROWS*TS*mapScale;
    mx.strokeStyle='#1a1430'; mx.lineWidth=8; mx.strokeRect(fx-9,fy-9,fw+18,fh+18);
    mx.strokeStyle='#6a5a20'; mx.lineWidth=2; mx.strokeRect(fx-4,fy-4,fw+8,fh+8);
    mx.fillStyle='#c8a840';
    [[fx-8,fy-8],[fx+fw,fy-8],[fx-8,fy+fh],[fx+fw,fy+fh]].forEach(([qx,qy])=>mx.fillRect(qx,qy,8,8));
  }
}

function loop(time){ drawMap(time); requestAnimationFrame(loop); }

// ============ FORM ============
function updateFormFields(){
  const type=parseInt(document.getElementById('taskType').value);
  document.getElementById('fgGoal').style.display=type===T_TARGET?'':'none';
  document.getElementById('fgDate').style.display=type===T_QUEST?'':'none';
}
document.getElementById('taskType').addEventListener('change',updateFormFields);

function populateSelects(){
  const sel=document.getElementById('taskDomain');
  DOMAINS.forEach((d,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=d.name; sel.appendChild(o); });
}

document.getElementById('addBtn').onclick=()=>{
  const name=document.getElementById('taskName').value.trim();
  const domain=document.getElementById('taskDomain').value;
  const type=document.getElementById('taskType').value;
  const goal=document.getElementById('taskGoal').value||1;
  const due=document.getElementById('taskDate').value;
  if(!name) return;
  addTask(name,domain,type,goal,due||null);
  document.getElementById('taskName').value=''; document.getElementById('taskDate').value=''; document.getElementById('taskGoal').value='';
  toggleForm();
};
document.getElementById('taskName').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('addBtn').click(); });
document.getElementById('reviveBtn').onclick=()=>{ state.hp=HP_MAX; save(); refresh(); };
document.getElementById('collapseBtn').onclick=()=>{
  const lp=document.getElementById('listPanel');
  const c=lp.classList.toggle('collapsed');
  document.getElementById('collapseBtn').textContent=c?'^':'v';
};
function toggleForm(){
  const fp=document.getElementById('formPanel'),btn=document.getElementById('formToggle');
  const open=fp.classList.toggle('open');
  btn.textContent=open?'✕ CANCEL':'＋ ADD TASK';
  btn.classList.toggle('up',open);
  if(open) document.getElementById('taskName').focus();
}

// ============ DOMAIN FOCUS ============
let focusIdx=null;
function openFocus(idx){ focusIdx=idx; renderFocusPanel(); document.getElementById('focusPanel').classList.add('open'); document.getElementById('focusBg').classList.add('open'); }
function closeFocus(){ focusIdx=null; document.getElementById('focusPanel').classList.remove('open'); document.getElementById('focusBg').classList.remove('open'); }
function focusAddTask(){ if(focusIdx===null) return; document.getElementById('taskDomain').value=focusIdx; closeFocus(); document.getElementById('taskName').focus(); }
function renderFocusPanel(){
  if(focusIdx===null) return;
  const d=DOMAINS[focusIdx],hp=domainHP(focusIdx);
  document.getElementById('focusCls').textContent=d.cls+' CLASS';
  document.getElementById('focusName').textContent=d.name; document.getElementById('focusName').style.color=d.color;
  document.getElementById('focusDest').textContent='► '+d.dest;
  document.getElementById('focusHPVal').textContent=hp+'%';
  const fill=document.getElementById('focusHPFill'); fill.style.width=hp+'%'; fill.style.backgroundColor=hpColor(hp);
  const body=document.getElementById('focusBody'); body.innerHTML='';
  const tasks=state.tasks.filter(t=>(t.domain||0)===focusIdx);
  if(!tasks.length){ body.innerHTML='<div class="empty">NO TASKS YET</div>'; return; }
  tasks.forEach(task=>{
    const over=isOverdue(task),doneToday=task.type===T_HABIT&&isDoneToday(task);
    const div=document.createElement('div');
    div.className='task domain-'+focusIdx+(over?' overdue':'')+(task.done?' done':'');
    const cb=document.createElement('div');
    if(task.type===T_TARGET){ cb.className='cb'; cb.textContent='+'; }
    else { cb.className='cb'+(task.done||doneToday?' checked':''); }
    cb.onclick=()=>{ toggleTask(task.id); renderFocusPanel(); };
    const nm=document.createElement('div'); nm.className='tname'; nm.textContent=task.name;
    const meta=document.createElement('div'); meta.className='tmeta';
    if(task.type===T_HABIT){ const tl=document.createElement('div'); tl.className='ttype'; tl.textContent=doneToday?'✓ TODAY':(task.streak>1?'↻ '+task.streak+'🔥':'↻ HABIT'); meta.appendChild(tl); }
    else if(task.type===T_TARGET){ const tl=document.createElement('div'); tl.className='ttype'; tl.textContent=(task.count||0)+'/'+(task.goal||1)+' WK'; meta.appendChild(tl); }
    const del=document.createElement('button'); del.className='del'; del.textContent='X'; del.onclick=()=>{ deleteTask(task.id); renderFocusPanel(); };
    div.appendChild(cb); div.appendChild(nm); div.appendChild(meta); div.appendChild(del);
    body.appendChild(div);
  });
}

// ============ CHECK-IN ============
function checkinDone(){ return localStorage.getItem('ta_checkin')===todayStr(); }
function updateCheckinBtn(){ const btn=document.getElementById('checkinBtn'); if(!btn) return; btn.textContent=checkinDone()?'✓ REPORTED TODAY':'📋 DAILY REPORT'; btn.classList.toggle('done',checkinDone()); }
function showCheckin(){
  const wrap=document.getElementById('checkinWrap');
  document.getElementById('checkinDate').textContent=new Date().toDateString().toUpperCase();
  renderCheckin();
  wrap.classList.add('open');
}
function renderCheckin(){
  const list=document.getElementById('checkinList'); list.innerHTML='';
  DOMAINS.forEach((d,di)=>{
    const tasks=state.tasks.filter(t=>(t.domain||0)===di&&(t.type===T_HABIT||t.type===T_TARGET));
    if(!tasks.length) return;
    const sect=document.createElement('div'); sect.className='ck-sect'; sect.style.color=d.color; sect.textContent=d.cls+' — '+d.name; list.appendChild(sect);
    tasks.forEach(task=>{
      const doneToday=task.type===T_HABIT&&isDoneToday(task);
      const div=document.createElement('div'); div.className='task domain-'+di+(task.done||doneToday?' done':'');
      const cb=document.createElement('div');
      if(task.type===T_TARGET){ cb.className='cb'; cb.textContent='+'; }
      else { cb.className='cb'+(doneToday?' checked':''); }
      cb.onclick=()=>{ toggleTask(task.id); renderCheckin(); };
      const nm=document.createElement('div'); nm.className='tname'; nm.textContent=task.name;
      const meta=document.createElement('div'); meta.className='tmeta';
      if(task.type===T_HABIT){ const tl=document.createElement('div'); tl.className='ttype'; tl.textContent=doneToday?'✓ TODAY':'↻ HABIT'; meta.appendChild(tl); }
      else if(task.type===T_TARGET){ const tl=document.createElement('div'); tl.className='ttype'; tl.textContent=(task.count||0)+'/'+(task.goal||1)+' WK'; meta.appendChild(tl); }
      div.appendChild(cb); div.appendChild(nm); div.appendChild(meta); list.appendChild(div);
    });
  });
  if(!list.children.length) list.innerHTML='<div class="empty">ADD HABITS & TARGETS TO USE THIS FEATURE</div>';
}
function submitCheckin(){
  localStorage.setItem('ta_checkin',todayStr());
  document.getElementById('checkinWrap').classList.remove('open');
  updateCheckinBtn();
}

// Canvas tap → open focus for nearest unit
mc.addEventListener('click',e=>{
  const rect=mc.getBoundingClientRect();
  const lx=((e.clientX-rect.left)*mc.width/rect.width - mapOX)/mapScale;
  const ly=((e.clientY-rect.top)*mc.height/rect.height - mapOY)/mapScale;
  for(let i=0;i<DOMAINS.length;i++){
    if(Math.abs(lx-unitPos[i].x)<16&&Math.abs(ly-unitPos[i].y)<20){ openFocus(i); return; }
  }
});

buildPortraitCol(); buildDomainBars(); populateSelects(); drawHeart(); drawScroll();
fitMap(); load(); recalcHP(); save(); refresh(); updateCheckinBtn();
document.getElementById('heroNameDisplay').textContent=state.name;
updateFormFields();
requestAnimationFrame(loop);
setInterval(()=>{ recalcHP(); save(); refresh(); },3600*1000);
</script>
