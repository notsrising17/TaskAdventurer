<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Adventurer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskAdv">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffd700;--text:#e8e0ff;--ok:#44cc44;--warn:#ffcc00;--bad:#ee2222;--muted:#8a7ab0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#080810;color:var(--text);font-family:'Press Start 2P',monospace;overflow:hidden;}
  #mapWrap{position:fixed;inset:0;background:#080810;}
  #mapCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%);z-index:2;}
  .hud{position:fixed;z-index:5;}
  /* Toast notifications */
  #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:60;
    font-size:9px;color:var(--gold);background:rgba(10,8,28,.94);border:2px solid var(--gold);
    padding:10px 14px;letter-spacing:1px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    box-shadow:0 0 16px rgba(0,0,0,.6);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .glass{background:rgba(10,8,28,0.88);border:2px solid var(--gold);
    box-shadow:0 0 16px rgba(0,0,0,.7),inset 0 0 14px rgba(0,0,0,.5);backdrop-filter:blur(2px);}

  /* Status chips — the per-domain BESIEGED/BEHIND/IDLE/MARCHING signal */
  .status-chip{font-size:9px;padding:4px 6px;border:1px solid;letter-spacing:1px;white-space:nowrap;
    background:rgba(0,0,0,.35);flex:0 0 auto;}

  /* Portrait roster (PARTY view on mobile, left rail on desktop) */
  #portraitCol{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;z-index:5;}
  .portCard{width:88px;display:flex;flex-direction:column;align-items:center;padding:4px;cursor:pointer;
    border:1px solid #2a2050;background:rgba(10,8,28,.85);transition:border-color .2s;}
  .portCard:hover,.portCard.active{border-color:var(--gold);}
  .portCanvas{width:80px;height:80px;display:block;image-rendering:pixelated;}
  .portName{font-size:9px;color:var(--gold);letter-spacing:.5px;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;width:100%;text-overflow:ellipsis;}
  .portCard.flash{animation:cardflash .6s steps(2);}
  @keyframes cardflash{0%,50%{border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,0,.8);}25%,75%{border-color:#2a2050;box-shadow:none;}}
  .portChip{margin-top:3px;}

  /* Stats — slim bar, tap to expand */
  #statsPanel{top:10px;right:10px;max-width:calc(100% - 20px);padding:0;display:flex;flex-direction:column;}
  #statsBar{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer;flex-wrap:wrap;min-height:44px;}
  #statsChev{font-size:9px;color:var(--gold);margin-left:auto;}
  #statsBody{display:none;flex-direction:column;gap:8px;padding:0 10px 10px;}
  #statsPanel.open #statsBody{display:flex;}
  .stat-name{font-size:10px;color:var(--gold);cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .2s;}
  .stat-name:hover{border-bottom-color:var(--gold);}
  #heroNameInput{font-family:inherit;font-size:10px;background:#070710;color:var(--gold);border:none;border-bottom:1px solid var(--gold);outline:none;width:110px;display:none;padding:2px 0;}
  .icn{image-rendering:pixelated;flex:0 0 auto;}
  .tasks-stat{font-size:9px;color:var(--text);display:flex;align-items:center;gap:4px;}

  /* Form — slides up from bottom of list panel */
  #formToggle{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;
    border-left:3px solid #a88a00;padding:10px 14px;cursor:pointer;letter-spacing:2px;min-height:44px;
    box-shadow:0 0 10px rgba(255,215,0,.25);white-space:nowrap;}
  #formPanel{left:0;right:0;bottom:0;width:100%;
    padding:8px;display:none;gap:6px;align-items:stretch;flex-wrap:wrap;
    background:rgba(8,6,20,0.97);border-top:2px solid #4a3a8a;}
  #formPanel.open{display:flex;}
  #formPanel input,#formPanel select{font-family:inherit;font-size:9px;background:#070710;color:var(--text);border:2px solid #4a3a8a;padding:8px;outline:none;width:100%;}
  #formPanel select option{background:#0d0b22;}
  .fgroup{display:flex;flex-direction:column;gap:3px;}
  .flabel{font-size:9px;color:#9a8ad0;letter-spacing:1px;}
  .capRow{display:flex;align-items:center;gap:8px;font-size:9px;color:var(--text);cursor:pointer;min-height:44px;}
  .capRow input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);cursor:pointer;}
  #fgName{flex:1 1 160px;min-width:0;}
  #fgDomain{flex:0 1 120px;}
  #fgType{flex:0 1 100px;}
  #fgGoal{flex:0 0 90px;}
  #fgCap{flex:0 0 auto;}
  #fgDate{flex:0 0 auto;}
  #fgRepeat{flex:0 0 110px;}
  #formPanel input::-webkit-calendar-picker-indicator{filter:invert(.8);}
  #addBtn{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:10px;min-height:44px;cursor:pointer;letter-spacing:1px;white-space:nowrap;}
  #addBtn:active{transform:translateY(2px);border-bottom-width:1px;}

  /* QUESTS home — domain-grouped task list */
  #listPanel{left:0;right:0;bottom:0;width:100%;max-height:46vh;
    background:rgba(8,6,20,0.92);border-top:3px solid var(--gold);display:flex;flex-direction:column;}
  #listHead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 10px;border-bottom:1px solid #2a2050;gap:6px;}
  #listHead .lbl{font-size:9px;color:var(--gold);letter-spacing:1px;}
  #collapseBtn{font-family:inherit;font-size:10px;background:none;border:1px solid #4a3a8a;color:var(--gold);width:44px;height:36px;cursor:pointer;line-height:1;}
  #listBody{overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:6px;}
  #listPanel.collapsed #listBody{display:none;}
  #listPanel.collapsed{max-height:none;}
  .empty{font-size:9px;color:#6a5aa0;text-align:center;padding:14px;line-height:1.8;}
  .dgroup{display:flex;flex-direction:column;gap:4px;border:1px solid #1e1840;background:rgba(10,8,26,.6);padding:6px;}
  .dgHead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;}
  .dgCls{font-size:10px;letter-spacing:1px;}
  .dgSub{font-size:9px;color:#9a8ad0;letter-spacing:1px;}
  .dgStrip{width:100%;display:block;image-rendering:pixelated;background:rgba(7,7,16,.6);border:1px solid #2a2050;cursor:pointer;}
  .dgAdd{font-family:inherit;font-size:9px;background:rgba(255,215,0,.06);color:#9a8ad0;border:1px dashed #3a3060;padding:10px;min-height:44px;cursor:pointer;letter-spacing:1px;text-align:center;}
  .dgAdd:hover{color:var(--gold);border-color:var(--gold);}
  .task{display:flex;align-items:center;gap:5px;min-height:44px;background:rgba(12,10,32,0.85);border:1px solid #2a2050;border-left-width:3px;padding:4px 6px;font-size:9px;transition:opacity .4s;}
  .task.overdue{border-color:var(--bad)!important;box-shadow:0 0 6px rgba(238,34,34,.4);}
  .task.done{opacity:.4;}.task.done .tname{text-decoration:line-through;}
  .domain-0{border-left-color:#d4884c;}.domain-1{border-left-color:#c8a840;}
  .domain-2{border-left-color:#44aa55;}.domain-3{border-left-color:#cc44aa;}.domain-4{border-left-color:#2288aa;}

  /* Focus panel */
  #focusBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none;}
  #focusBg.open{display:block;}
  #focusPanel{position:fixed;left:0;right:0;bottom:0;max-height:75vh;z-index:20;padding:12px;
    display:flex;flex-direction:column;gap:8px;
    transform:translateY(100%);transition:transform .25s cubic-bezier(.2,0,0,1);}
  #focusPanel.open{transform:translateY(0);}
  #focusHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:8px;border-bottom:1px solid #2a2050;}
  #focusAvatar{width:88px;height:88px;flex:0 0 88px;border:2px solid #4a3a8a;image-rendering:pixelated;background:#070710;}
  #focusStep{font-size:9px;color:var(--gold);margin-top:5px;letter-spacing:1px;}
  #focusStatus{margin-top:5px;}
  #focusPath{width:100%;display:block;image-rendering:pixelated;background:rgba(7,7,16,.6);border:1px solid #2a2050;}
  #focusCls{font-size:9px;color:#9a8ad0;letter-spacing:2px;}
  #focusName{font-size:12px;color:var(--gold);margin:3px 0 2px;}
  #focusDest{font-size:9px;color:#888;letter-spacing:1px;}
  .fclose{font-family:inherit;font-size:12px;background:none;border:1px solid #4a3a8a;color:var(--gold);width:44px;height:44px;cursor:pointer;flex:0 0 auto;}
  #focusBody{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;min-height:60px;}
  #focusAddBtn{font-family:inherit;font-size:9px;background:rgba(255,215,0,.1);color:var(--gold);
    border:1px solid #4a3060;padding:12px;min-height:44px;cursor:pointer;letter-spacing:1px;text-align:center;flex:0 0 auto;}

  /* Check-in */
  #checkinWrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:none;align-items:center;justify-content:center;padding:16px;}
  #checkinWrap.open{display:flex;}
  #checkinBox{width:100%;max-width:480px;max-height:82vh;display:flex;flex-direction:column;gap:8px;padding:14px;}
  .ck-title{font-size:11px;color:var(--gold);text-align:center;letter-spacing:2px;}
  .ck-sub{font-size:9px;color:#9a8ad0;text-align:center;margin-bottom:4px;}
  #checkinList{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;}
  .ck-sect{font-size:9px;letter-spacing:1px;padding:6px 0 4px;border-bottom:1px solid #2a2050;margin-top:4px;}
  #checkinSubmit{font-family:inherit;font-size:10px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;min-height:44px;cursor:pointer;letter-spacing:1px;flex:0 0 auto;}
  #checkinBtn{font-family:inherit;font-size:9px;background:rgba(255,215,0,.08);color:var(--gold);border:1px solid #4a3060;padding:10px;min-height:44px;cursor:pointer;letter-spacing:1px;text-align:center;}
  #checkinBtn.done{color:var(--ok);border-color:#226622;background:rgba(68,204,68,.08);}
  .miniBtn{font-family:inherit;font-size:9px;background:rgba(255,215,0,.08);color:var(--gold);border:1px solid #4a3060;padding:10px;min-height:44px;cursor:pointer;letter-spacing:1px;text-align:center;flex:1;}

  /* Chronicle (history view) */
  #chronWrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:none;align-items:center;justify-content:center;padding:16px;}
  #chronWrap.open{display:flex;}
  #chronBox{width:100%;max-width:480px;max-height:86vh;display:flex;flex-direction:column;gap:8px;padding:14px;overflow-y:auto;}
  .ch-lbl{font-size:9px;color:#9a8ad0;letter-spacing:1px;margin-top:4px;}
  #chronGrid,#chronBars{width:100%;image-rendering:pixelated;background:#070710;border:1px solid #2a2050;}
  .ch-row{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;padding:6px 0;border-bottom:1px solid #1a1438;}
  #chronClose{font-family:inherit;font-size:10px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;min-height:44px;cursor:pointer;letter-spacing:1px;flex:0 0 auto;}
  .cb{width:26px;height:26px;flex:0 0 26px;border:2px solid #4a3a8a;background:#070710;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .cb.checked{background:var(--ok);border-color:var(--ok);}
  .cb.checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #062;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .25s;}
  @keyframes pop{0%{transform:rotate(45deg) scale(0);}100%{transform:rotate(45deg) scale(1);}}
  .tname{flex:1;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tmeta{display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex:0 0 auto;}
  .tloc{font-size:9px;white-space:nowrap;}
  .ttype{font-size:9px;color:#88ccff;white-space:nowrap;}
  .badge{font-size:9px;padding:4px;border:1px solid;white-space:nowrap;}
  .badge.due{color:#9ad0ff;border-color:#3a5a8a;}
  .badge.over{color:#fff;background:var(--bad);border-color:#ff6a6a;}
  .del{flex:0 0 auto;font-family:inherit;font-size:9px;background:#2a0a14;color:#ff8888;border:1px solid #6a2030;padding:6px 8px;cursor:pointer;}
  /* Habit rows */
  .habit-row{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
  .habit-top{display:flex;align-items:center;gap:5px;}
  .habit-week{display:flex;align-items:center;gap:3px;padding:0 6px 4px;}
  .habit-dots{display:flex;gap:4px;flex:1;}
  .hdot{width:14px;height:14px;border-radius:2px;border:1px solid #3a3060;background:#0d0b22;cursor:pointer;transition:background .15s;}
  .hdot.done{background:var(--hdot-col,#44cc44);border-color:var(--hdot-col,#44cc44);}
  .hdot.today{box-shadow:0 0 0 2px rgba(255,255,255,.4);}
  .habit-progress{height:4px;background:#070710;border:1px solid #2a2050;flex:1;margin-left:4px;}
  .habit-progress-fill{height:100%;transition:width .3s;}
  .hlbl{font-size:9px;white-space:nowrap;margin-left:4px;}

  /* Edit task modal */
  #editWrap{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:45;display:none;align-items:center;justify-content:center;padding:16px;}
  #editWrap.open{display:flex;}
  #editBox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;padding:14px;}
  #editBox input{font-family:inherit;font-size:10px;background:#070710;color:var(--text);border:2px solid #4a3a8a;padding:12px 8px;outline:none;width:100%;}
  #editBox input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);}
  #editBox input:focus{border-color:var(--gold);}
  #editSave{font-family:inherit;font-size:10px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;min-height:44px;cursor:pointer;letter-spacing:1px;flex:1;}
  #editCancel{font-family:inherit;font-size:10px;background:none;color:#9a8ad0;border:1px solid #4a3a8a;padding:12px;min-height:44px;cursor:pointer;letter-spacing:1px;flex:0 0 auto;}
  .edit-btn{flex:0 0 auto;font-family:inherit;font-size:9px;background:#141228;color:#9a8ad0;border:1px solid #3a3060;padding:6px 8px;cursor:pointer;}
  .edit-btn:hover{color:var(--gold);border-color:var(--gold);}

  /* Bottom tab bar — mobile only (JRPG menu) */
  #tabBar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;
    background:rgba(8,6,20,.97);border-top:3px solid var(--gold);}
  .tabBtn{flex:1;font-family:inherit;font-size:9px;letter-spacing:1px;color:#9a8ad0;background:none;
    border:none;border-right:1px solid #2a2050;padding:14px 4px;min-height:52px;cursor:pointer;}
  .tabBtn:last-child{border-right:none;}
  .tabBtn.active{color:var(--gold);background:rgba(255,215,0,.08);box-shadow:inset 0 3px 0 var(--gold);}

  /* Desktop: side rails, map centerpiece, no tabs */
  @media(min-width:601px){
    #portraitCol{top:0;left:0;bottom:0;padding:16px 8px;gap:6px;overflow-y:auto;
      background:rgba(6,4,18,.92);border-right:1px solid #1a1430;justify-content:center;}
    .portCard{width:84px;}
    #statsPanel{top:0;right:0;bottom:auto;width:230px;border-radius:0;border-top:none;border-right:none;}
    #statsPanel #statsBody{display:flex;}
    #statsBar{flex-wrap:wrap;cursor:default;}
    #statsChev{display:none;}
    #listPanel{left:104px;right:230px;}
  }

  /* Mobile: three tabbed views */
  @media(max-width:600px){
    #tabBar{display:flex;}
    /* QUESTS (default): solid dark home screen, no map behind */
    body[data-tab=QUESTS] #mapWrap,body[data-tab=QUESTS] #vignette{display:none;}
    body[data-tab=QUESTS] #portraitCol{display:none;}
    body[data-tab=QUESTS] #listPanel{top:54px;bottom:52px;max-height:none;background:#0a0818;}
    /* WORLD: map only */
    body[data-tab=WORLD] #listPanel{display:none;}
    body[data-tab=WORLD] #portraitCol{display:none;}
    body[data-tab=WORLD] #mapWrap,body[data-tab=WORLD] #vignette{bottom:52px;}
    /* PARTY: full-width roster */
    body[data-tab=PARTY] #mapWrap,body[data-tab=PARTY] #vignette{display:none;}
    body[data-tab=PARTY] #listPanel{display:none;}
    body[data-tab=PARTY] #portraitCol{position:fixed;top:54px;left:0;right:0;bottom:52px;
      overflow-y:auto;padding:10px;gap:8px;background:#0a0818;}
    body[data-tab=PARTY] .portCard{width:100%;flex-direction:row;gap:10px;padding:8px;min-height:64px;align-items:center;}
    body[data-tab=PARTY] .portCanvas{width:56px;height:56px;flex:0 0 56px;}
    body[data-tab=PARTY] .portName{text-align:left;margin-top:0;flex:1;}
    #statsPanel{width:100%;right:0;left:0;top:0;border-left:none;border-right:none;border-top:none;}
    .stat-name{font-size:9px;}
    #formPanel{bottom:52px;}
    #formPanel input,#formPanel select{height:44px;font-size:9px;padding:0 8px;}
    .fgroup{flex:1 1 100%;}
    #fgGoal,#fgDate,#fgRepeat{flex:1 1 auto;}
    #addBtn{flex:1 1 100%;height:48px;font-size:10px;padding:0;}
    .task{min-height:48px;padding:6px 8px;}
    .del{padding:12px;min-width:44px;min-height:44px;font-size:10px;}
    .edit-btn{padding:12px;min-width:44px;min-height:44px;font-size:10px;}
    .hdot{width:18px;height:18px;}
    .cb{width:32px;height:32px;flex:0 0 32px;}
    .cb.checked::after{left:8px;top:3px;width:7px;height:13px;}
  }

  /* Respect OS-level reduced-motion preference */
  @media(prefers-reduced-motion:reduce){
    .portCard.flash{animation:none;}
    .cb.checked::after{animation:none;}
    #focusPanel{transition:none;}
    #toast{transition:opacity .1s;}
    .habit-progress-fill{transition:none;}
  }
</style>
</head>
<body>
<div id="mapWrap"><canvas id="mapCanvas"></canvas></div>
<div id="vignette"></div>

<div id="portraitCol"></div>

<div id="statsPanel" class="hud glass">
  <div id="statsBar" onclick="toggleStats(event)">
    <span class="stat-name" id="heroNameDisplay">HERO</span>
    <input type="text" id="heroNameInput" maxlength="12" placeholder="NAME">
    <span class="tasks-stat"><canvas class="icn" id="scrollIcn" width="9" height="9"></canvas><span id="taskStat">0/0</span></span>
    <span id="statsChev">▾</span>
  </div>
  <div id="statsBody">
    <button id="checkinBtn" onclick="showCheckin()">📋 DAILY REPORT</button>
    <button class="miniBtn" onclick="showChronicle()" style="flex:none;width:100%;">📜 CHRONICLE</button>
    <div style="display:flex;gap:4px;align-items:center;">
      <button class="miniBtn" id="notifBtn" onclick="toggleNotifSettings()">🔔 ALERTS</button>
      <span id="notifStatus" style="font-size:5px;color:#888;letter-spacing:1px;"></span>
    </div>
    <div id="notifRow" style="display:none;gap:4px;align-items:center;flex-wrap:wrap;padding:4px 0;">
      <span style="font-size:5px;color:#888;letter-spacing:1px;">DAILY REPORT REMINDER</span>
      <input type="time" id="notifTime" value="20:00" style="font-family:inherit;font-size:6px;background:#1a1428;color:var(--gold);border:1px solid #4a3060;padding:3px 5px;letter-spacing:1px;" onchange="saveNotifPref()">
    </div>
    <div style="display:flex;gap:4px;">
      <button class="miniBtn" id="exportBtn">💾 EXPORT SAVE</button>
      <button class="miniBtn" id="importBtn">📂 IMPORT</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </div>
</div>
<div id="toast"></div>

<div id="listPanel" class="hud">
  <div id="listHead">
    <span class="lbl">QUEST LOG</span>
    <button id="formToggle" onclick="toggleForm()">＋ ADD TASK</button>
    <button id="collapseBtn">v</button>
  </div>
  <div id="formPanel">
    <div class="fgroup" id="fgName"><label class="flabel" for="taskName">TASK</label>
      <input type="text" id="taskName" placeholder="TASK NAME..." maxlength="60"></div>

<script>
// ============ DOMAINS ============
// Each domain = a life area with a unit that marches toward its objective town
// path: waypoints [[tx,ty],...] from center (6,10) to destination along grid paths
// spriteRgn no longer needed — dedicated sprite files used instead
const DOMAINS = [
  {name:'HOME',  cls:'WIZARD',   dest:'CUSTOM FIELD',   color:'#d4884c', dark:'#8b3a10', targetTx:1,  targetTy:3,
   portraits:['wizard_confident.png','wizard_tired.png','wizard_hurt.png','wizard_critical.png'], sheet:null,
   sprite:'wizard_sprite.png',
   path:[[6,10],[1,10],[1,3]]},
  {name:'WORK',  cls:'MERCHANT', dest:'CORPORATLANDIA', color:'#c8a840', dark:'#7a6010', targetTx:11, targetTy:4,
   portraits:null, sheet:'merchant_sheet.png', sprite:'merchant_sprite.png',
   path:[[6,10],[11,10],[11,4]]},
  {name:'HEALTH',cls:'FIGHTER',  dest:'FITLANTIS',      color:'#44aa55', dark:'#1a5a1a', targetTx:1,  targetTy:17,
   portraits:null, sheet:'fighter_sheet.png', sprite:'fighter_sprite.png',
   path:[[6,10],[1,10],[1,17]]},
  {name:'CREATIVITY',cls:'BARD', dest:'DISCOTECA',      color:'#cc44aa', dark:'#7a1a6a', targetTx:6,  targetTy:2,
   portraits:null, sheet:'bard_sheet.png', sprite:'bard_sprite.png',
   path:[[6,10],[6,2]]},
  {name:'SOCIAL',cls:'ROGUE',    dest:"ROBBER BARON'S", color:'#2288aa', dark:'#1a4a6a', targetTx:11, targetTy:16,
   portraits:null, sheet:'rogue_sheet.png', sprite:'rogue_sprite.png',
   path:[[6,10],[11,10],[11,16]]},
];

// Task types. Legacy type 2 (TARGET) was merged into HABIT with dailyCap:false
// in schema v3 — the literal 2 appears only inside migrate().
const T_QUEST = 0, T_HABIT = 1;

// Path tile math (WORLD view) — defined early because MILESTONE_COST derives from it
function pathTiles(waypts){
  const tiles=[];
  if(!waypts||!waypts.length) return tiles;
  for(let i=0;i<waypts.length-1;i++){
    const [ax,ay]=waypts[i],[bx,by]=waypts[i+1];
    if(ax!==bx){ const dx=bx>ax?1:-1; for(let x=ax+dx;x!==bx+dx;x+=dx) tiles.push([x,ay]); }
    if(ay!==by){ const dy=by>ay?1:-1; for(let y=ay+dy;y!==by+dy;y+=dy) tiles.push([bx,y]); }
  }
  return tiles;
}
const DOMAIN_TILES=DOMAINS.map(d=>pathTiles(d.path));

// ============ PORTRAITS ============
// Dedicated full-body map sprites per domain
const domainSpriteImgs = DOMAINS.map(d=>{ const i=new Image(); i.src=d.sprite; return i; });
// Preload individual portrait images
const domainPortraitImgs = DOMAINS.map(d => d.portraits ? d.portraits.map(src=>{ const i=new Image(); i.src=src; return i; }) : null);
// Preload portrait sheets (2×2 grid, top-left=ok, top-right=tired, bot-left=hurt, bot-right=crit)
const sheetImgs = DOMAINS.map(d=>{ if(!d.sheet) return null; const i=new Image(); i.src=d.sheet; i.onload=()=>updatePortraits(); return i; });

// Draw one quadrant of a portrait sheet onto a canvas element
// Sheet layout: 2×2 grid (TL=ok, TR=tired, BL=hurt, BR=crit)
// For landscape sheets (sprite on the side), use the square left portion
function drawSheetPortrait(cv,sheetImg,lvl){
  const g=cv.getContext('2d'),cw=cv.width,ch=cv.height;
  g.clearRect(0,0,cw,ch);
  if(!sheetImg.complete||!sheetImg.naturalWidth){ g.fillStyle='#111'; g.fillRect(0,0,cw,ch); return; }
  // Use square grid area — handles both square sheets and landscape (sprite on side)
  const gridPx=Math.min(sheetImg.naturalWidth,sheetImg.naturalHeight);
  const half=gridPx/2;
  const sx=(lvl===1||lvl===3)?half:0;
  const sy=(lvl>=2)?half:0;
  // Center-crop the quadrant to fill dst
  const scale=Math.max(cw/half,ch/half);
  const scaledW=half*scale,scaledH=half*scale;
  g.drawImage(sheetImg,sx,sy,half,half,(cw-scaledW)/2,(ch-scaledH)/2,scaledW,scaledH);
}

function buildPortraitCol(){
  const col=document.getElementById('portraitCol');
  DOMAINS.forEach((d,i)=>{
    const card=document.createElement('div'); card.className='portCard'; card.id='pc'+i; card.title=d.cls+' — '+d.dest;
    card.onclick=()=>openFocus(i);
    // Always use canvas so we can render sheets, individual images, or placeholders uniformly
    const cv=document.createElement('canvas'); cv.className='portCanvas'; cv.id='portImg'+i; cv.width=80; cv.height=80;
    renderPortraitCanvas(cv,d,i,0);
    card.appendChild(cv);
    const nm=document.createElement('div'); nm.className='portName'; nm.style.color=d.color; nm.textContent=d.cls; card.appendChild(nm);
    const chipWrap=document.createElement('div'); chipWrap.className='portChip'; chipWrap.id='portChip'+i;
    card.appendChild(chipWrap);
    col.appendChild(card);
  });
}

function renderPortraitCanvas(cv,d,idx,lvl){
  if(d.sheet && sheetImgs[idx]){
    drawSheetPortrait(cv,sheetImgs[idx],lvl);
  } else if(d.portraits && domainPortraitImgs[idx]){
    const img=domainPortraitImgs[idx][Math.min(lvl,3)];
    const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
    if(img.complete&&img.naturalWidth) g.drawImage(img,0,0,cv.width,cv.height);
    else { img.onload=()=>{ g.drawImage(img,0,0,cv.width,cv.height); }; drawPortraitPlaceholder(cv,d,lvl); }
  } else {
    drawPortraitPlaceholder(cv,d,lvl);
  }
}

function drawPortraitPlaceholder(cv,d,lvl){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height;
  g.clearRect(0,0,w,h);
  // Background gradient
  const bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,d.dark+'cc'); bg.addColorStop(1,'#0a0818cc');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  // Class icon — large centered letter
  g.fillStyle=d.color+'aa'; g.font='bold 28px monospace'; g.textAlign='center'; g.textBaseline='middle';
  const icons={'WIZARD':'⚗','MERCHANT':'⚖','FIGHTER':'⚔','BARD':'♪','ROGUE':'🗡'};
  g.fillText(icons[d.cls]||d.cls[0],w/2,h/2-6);
  // Art-level state indicator (levels map to domain status)
  const stateLabels=['OK','LOW','HURT','CRIT'];
  g.font='bold 6px monospace'; g.fillStyle=ART_COLOR[lvl]; g.textBaseline='bottom';
  g.fillText(stateLabels[lvl],w/2,h-3);
  // Border glow
  if(lvl>=2){ g.strokeStyle=ART_COLOR[lvl]+'66'; g.lineWidth=2; g.strokeRect(1,1,w-2,h-2); }
}

function updatePortraits(){
  DOMAINS.forEach((d,i)=>{
    const lvl=domainArtLevel(i);
    const cv=document.getElementById('portImg'+i); if(cv) renderPortraitCanvas(cv,d,i,lvl);
    const cw=document.getElementById('portChip'+i);
    if(cw){ cw.innerHTML=''; cw.appendChild(statusChip(i)); }
    // Active state if focus open
    const card=document.getElementById('pc'+i); if(card) card.classList.toggle('active',focusIdx===i);
  });
}
function updatePortrait(){ updatePortraits(); }

// ============ DATE HELPERS ============
// All dates are LOCAL — toISOString() is UTC and flips to "tomorrow" at 7/8pm ET
function localDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return localDateStr(new Date()); }
function mondayStr(){ const d=new Date(),day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return localDateStr(d); }
// Monday of the week N weeks away from this one (negative = past)
function mondayStrOffset(weeks){ const d=new Date(mondayStr()+'T12:00:00'); d.setDate(d.getDate()+weeks*7); return localDateStr(d); }
// Whole local days from today to a date string (negative = past)
function dayDiff(dateStr){ return Math.round((new Date(dateStr+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000); }
function isDoneToday(t){ return t.lastDone===todayStr(); }

// ============ STATE ============
// Colors for the 4 portrait/sprite art tiers (level 3 unused for now —
// kept for Phase 2 along with the critical art assets)
const ART_COLOR=['#44cc44','#ffcc00','#ee2222','#ee2222'];
let state={tasks:[], name:'HERO', milestones:[0,0,0,0,0]};

// Adherence-mechanic state (Phase 1.5), persisted under its own key.
// tokens: campfire tokens (streak repair, cap 2). pins: today-only TODAY-strip
// pins. lastSeen + camped: re-entry ritual bookkeeping. critMiss/critBonus:
// crit fairness counter + per-domain bonus milestone progress. msBase:
// milestones held when v4 migrated (those domains keep full-price milestones).
// offers: pending campfire-token streak-repair offers. celebrated: last date
// the TODAY-strip clear celebration fired.
const META_KEY='ta_meta';
function metaDefaults(){
  return {tokens:0,pins:{date:'',ids:[]},lastSeen:null,camped:false,
    critMiss:0,critBonus:[0,0,0,0,0],msBase:[0,0,0,0,0],msInit:false,
    offers:[],celebrated:''};
}
let META=metaDefaults();
function loadMeta(){
  try{
    const m=JSON.parse(localStorage.getItem(META_KEY)||'null');
    if(m&&typeof m==='object') META=Object.assign(metaDefaults(),m);
  }catch(e){ META=metaDefaults(); }
}
function saveMeta(){ try{ localStorage.setItem(META_KEY,JSON.stringify(META)); }catch(e){} }

// Bump when the task shape changes; add a migration case in migrate()
const SCHEMA_VERSION=4;
function migrate(fromVersion){
  // Versions run sequentially: 1→2, 2→3, etc. Each case must be idempotent.
  switch(fromVersion){
    case 1: // v2 adds the ta_events log; nothing in ta_tasks changes
      if(!localStorage.getItem(EVENTS_KEY)) localStorage.setItem(EVENTS_KEY,'[]');
      break;
    case 2: // v3 merges TARGET (legacy type 2) into HABIT with dailyCap:false
      state.tasks.forEach(t=>{
        if(t.type===2){
          t.type=T_HABIT;
          t.dailyCap=false;
          t.weekCount=t.weekCount!=null?t.weekCount:(t.count||0);
          delete t.count;
          t.weeklyHits=t.weeklyHits||0;
          t.wkStreak=t.wkStreak||0;
        } else if(t.type===T_HABIT&&t.dailyCap==null){
          t.dailyCap=true;
        }
      });
      break;
    case 3: // v4 adds adherence fields: weekLog, snoozeCount, milestone base
      state.tasks.forEach(t=>{
        if(t.snoozeCount==null) t.snoozeCount=0;
        if(t.type===T_HABIT&&t.weekLog==null){
          // Synthesize history from the old consecutive streak: seed the
          // last wkStreak weeks as hits so the rolling window starts honest
          t.weekLog=[];
          const n=Math.min(t.wkStreak||0,26);
          for(let k=n;k>=1;k--) t.weekLog.push({w:mondayStrOffset(-k),hit:1});
        }
      });
      // Domains already holding milestones keep paying full price —
      // the cheap early-milestone ramp is for fresh domains only
      if(!META.msInit){
        META.msBase=DOMAINS.map((_,i)=>(state.milestones&&state.milestones[i])||0);
        META.msInit=true;
        saveMeta();
      }
      break;
  }
}
function load(){
  loadMeta();
  try{
    const t=JSON.parse(localStorage.getItem('ta_tasks')||'[]'); if(Array.isArray(t)) state.tasks=t;
    state.name=(localStorage.getItem('ta_name')||'HERO').toUpperCase();
    // v3 renamed the persisted key ta_caps → ta_milestones; read old key as fallback
    const rawCaps=localStorage.getItem('ta_milestones')||localStorage.getItem('ta_caps');
    const c=JSON.parse(rawCaps||'[]'); if(Array.isArray(c)) state.milestones=DOMAINS.map((_,i)=>c[i]||0);
    let v=parseInt(localStorage.getItem('ta_version'))||1;
    while(v<SCHEMA_VERSION){ migrate(v); v++; }
  }catch(e){}
  loadEvents();
}
function save(){
  try{
    localStorage.setItem('ta_version',String(SCHEMA_VERSION));
    localStorage.setItem('ta_tasks',JSON.stringify(state.tasks));
    localStorage.setItem('ta_name',state.name);
    localStorage.setItem('ta_milestones',JSON.stringify(state.milestones));
    saveMeta();
  }catch(e){ showToast('⚠ SAVE FAILED — EXPORT YOUR DATA','#ee2222'); }
}

// ============ EVENT LOG ============
// Append-only history of game actions, persisted separately from tasks
// (own key keeps task reads/writes cheap). Events are small flat objects:
//   {t: epoch-ms, ev: type, id: taskId, d: domainIdx, k: taskType}
// Task names are NOT stored — resolve via id at display time so renames
// don't fork history. "un" events exist so misclick fixes don't inflate counts.
// Types: done/undone (quest), habit/unhabit, target/untarget,
//        week (weekly habit goal met), capture, report
const EVENTS_KEY='ta_events';
const EVENTS_SUM_KEY='ta_events_sum'; // monthly rollups of pruned events
state.events=[];
state.eventSums=[]; // [{m:'YYYY-MM', ev, d, n}] — counts per domain per type
function loadEvents(){
  try{
    const e=JSON.parse(localStorage.getItem(EVENTS_KEY)||'[]');
    if(Array.isArray(e)) state.events=e;
  }catch(err){ state.events=[]; }
  try{
    const s=JSON.parse(localStorage.getItem(EVENTS_SUM_KEY)||'[]');
    if(Array.isArray(s)) state.eventSums=s;
  }catch(err){ state.eventSums=[]; }
  pruneEvents();
}
function saveEvents(){
  try{
    localStorage.setItem(EVENTS_KEY,JSON.stringify(state.events));
    localStorage.setItem(EVENTS_SUM_KEY,JSON.stringify(state.eventSums));
  }catch(e){}
}
// Retention: raw events kept for trailing 12 months; older ones roll up
// into monthly summary rows so long-term stats survive without unbounded
// JSON.parse cost on every boot
function pruneEvents(){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-12);
  const cutMs=cutoff.getTime();
  if(!state.events.length||state.events[0].t>=cutMs) return;
  const keep=[],old=[];
  state.events.forEach(e=>(e.t<cutMs?old:keep).push(e));
  if(!old.length) return;
  old.forEach(e=>{
    const dt=new Date(e.t);
    const m=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    const d=e.d!=null?e.d:-1;
    let row=state.eventSums.find(s=>s.m===m&&s.ev===e.ev&&s.d===d);
    if(!row){ row={m,ev:e.ev,d,n:0}; state.eventSums.push(row); }
    row.n++;
  });
  state.events=keep;
  saveEvents();
}
function logEvent(ev,task,domainIdx){
  const e={t:Date.now(),ev};
  if(task){ e.id=task.id; e.d=task.domain||0; e.k=task.type||0; }
  else if(domainIdx!=null){ e.d=domainIdx; }
  state.events.push(e);
  saveEvents();
}
// Resolve an event's task name at display time; deleted tasks get a fallback
function eventTaskName(e){
  if(e.id==null) return null;
  const t=state.tasks.find(x=>x.id===e.id);
  return t?t.name:'(DELETED TASK)';
}

// ============ EVENT AGGREGATION (pure — events in, plain data out) ============
// All day-bucketing goes through localDateStr so the UTC-flip bug can't
// sneak back in via analytics. No DOM access in any of these.
const POSITIVE_EV={done:1,habit:1,target:1};      // each cancels with its un-twin
const UN_TWIN={undone:'done',unhabit:'habit',untarget:'target'};

// Net completions per day for the last N days (un-events subtract, floor 0).
// Returns [{date:'YYYY-MM-DD', n}] oldest→newest, zero-filled.
function aggDailyCompletions(events,nDays){
  const byDay={};
  events.forEach(e=>{
    const day=localDateStr(new Date(e.t));
    if(POSITIVE_EV[e.ev]) byDay[day]=(byDay[day]||0)+1;
    else if(UN_TWIN[e.ev]) byDay[day]=(byDay[day]||0)-1;
  });
  const out=[]; const d=new Date(); d.setDate(d.getDate()-(nDays-1));
  for(let i=0;i<nDays;i++){
    const s=localDateStr(d);
    out.push({date:s,n:Math.max(0,byDay[s]||0)});
    d.setDate(d.getDate()+1);
  }
  return out;
}

// Like aggDailyCompletions but split per domain for stacked charts.
// Returns [{date, n:[per-domain counts]}] oldest→newest, zero-filled.
function aggDailyByDomain(events,nDays){
  const byDay={};
  events.forEach(e=>{
    if(e.d==null||e.d<0||e.d>=DOMAINS.length) return;
    const day=localDateStr(new Date(e.t));
    if(!byDay[day]) byDay[day]=DOMAINS.map(()=>0);
    if(POSITIVE_EV[e.ev]) byDay[day][e.d]++;
    else if(UN_TWIN[e.ev]) byDay[day][e.d]--;
  });
  const out=[]; const d=new Date(); d.setDate(d.getDate()-(nDays-1));
  for(let i=0;i<nDays;i++){
    const s=localDateStr(d);
    out.push({date:s,n:(byDay[s]||DOMAINS.map(()=>0)).map(x=>Math.max(0,x))});
    d.setDate(d.getDate()+1);
  }
  return out;
}

// Net completions per domain within [fromStr, toStr] inclusive (date strings).
// Returns array indexed by domain.
function aggDomainTotals(events,fromStr,toStr){
  const totals=DOMAINS.map(()=>0);
  events.forEach(e=>{
    if(e.d==null||e.d<0||e.d>=totals.length) return;
    const day=localDateStr(new Date(e.t));
    if(day<fromStr||day>toStr) return;
    if(POSITIVE_EV[e.ev]) totals[e.d]++;
    else if(UN_TWIN[e.ev]) totals[e.d]--;
  });
  return totals.map(n=>Math.max(0,n));
}

// Current + best consecutive-day report streaks from the checkin dates array
function reportStreaks(dates){
  if(!dates||!dates.length) return {current:0,best:0};
  const set=new Set(dates);
  // best: walk each date that has no previous day (streak starts) forward
  let best=0;
  set.forEach(s=>{
    const d=new Date(s+'T12:00:00');
    const prev=new Date(d); prev.setDate(prev.getDate()-1);
    if(set.has(localDateStr(prev))) return; // not a streak start
    let len=0; const cur=new Date(d);
    while(set.has(localDateStr(cur))){ len++; cur.setDate(cur.getDate()+1); }
    if(len>best) best=len;
  });
  // current: count back from today (or yesterday if today not yet reported)
  let current=0; const d=new Date();
  if(!set.has(localDateStr(d))) d.setDate(d.getDate()-1);
  while(set.has(localDateStr(d))){ current++; d.setDate(d.getDate()-1); }
  return {current,best};
}

// Capture events in chronological order: [{date, d}]
function aggCaptures(events){
  return events.filter(e=>e.ev==='capture')
    .map(e=>({date:localDateStr(new Date(e.t)),d:e.d}))
    .sort((a,b)=>a.date<b.date?-1:1);
}

// Net completions per weekday. Returns [{day:0..6 (Sun..Sat), n}].
function aggBusiestWeekday(events){
  const counts=[0,0,0,0,0,0,0];
  events.forEach(e=>{
    const wd=new Date(e.t).getDay();
    if(POSITIVE_EV[e.ev]) counts[wd]++;
    else if(UN_TWIN[e.ev]) counts[wd]--;
  });
  return counts.map((n,day)=>({day,n:Math.max(0,n)}));
}

// Earliest recorded history — instrumentation start, not account start.
// Views should show "CHRONICLE BEGINS <this>" rather than implying the
// player did nothing before the log existed. Returns 'YYYY-MM-DD' or null.
function chronicleStart(events,sums){
  let earliest=null;
  if(sums&&sums.length){
    const m=sums.reduce((a,s)=>a===null||s.m<a?s.m:a,null);
    if(m) earliest=m+'-01';
  }
  if(events&&events.length){
    const s=localDateStr(new Date(events[0].t));
    if(earliest===null||s<earliest) earliest=s;
  }
  return earliest;
}

function isOverdue(t){
  if(t.type!==T_QUEST||t.done||!t.due) return false;
  return new Date()>new Date(t.due+'T23:59:59');
}

// ============ STATUS + PROGRESS PER DOMAIN ============
// How many times done this week (habit only)
function habitWeekCount(t){ return t.type===T_HABIT?(t.weekCount||0):0; }
function habitGoalMet(t){ return t.type===T_HABIT&&habitWeekCount(t)>=(t.goal||1); }
// Progress contributed by a habit: banked weekly hits plus goal multiples
// already earned this week. For a migrated target (weeklyHits 0, weekCount=
// old count) this equals the old floor(count/goal) exactly; capped habits
// keep banked hits and now also credit the current week once the goal is met.
function habitGoalHits(t){
  if(t.type!==T_HABIT) return 0;
  return (t.weeklyHits||0)+Math.floor((t.weekCount||0)/(t.goal||1));
}

// Progress: quest done=1, recurring quest completions=1 each, habit goal-hits=1 each
function countDomainProgress(idx){
  const tasks=state.tasks.filter(t=>(t.domain||0)===idx);
  let s=0;
  tasks.forEach(t=>{
    if(t.type===T_QUEST) s+=t.repeat>0?(t.doneCount||0):(t.done?1:0);
    else if(t.type===T_HABIT) s+=habitGoalHits(t);
  });
  return s;
}
// Each milestone costs a fixed amount of progress per domain. Currently
// derived from the map path length, but milestone logic must only touch
// tile data through this constant so Phase 2 can re-derive it pathlessly.
const MILESTONE_COST=DOMAIN_TILES.map(t=>t.length);
// Campaigns: each milestone costs one full MILESTONE_COST of progress
function domainProgress(idx){
  const tier=(state.milestones&&state.milestones[idx])||0;
  const cost=MILESTONE_COST[idx];
  const net=countDomainProgress(idx)-tier*cost;
  return Math.max(0,Math.min(1,net/cost));
}
function domainCurrentProgress(idx){
  const tier=(state.milestones&&state.milestones[idx])||0;
  const cost=MILESTONE_COST[idx];
  return Math.max(0,Math.min(cost,countDomainProgress(idx)-tier*cost));
}
function getDomainPendingTasks(idx){
  return state.tasks.filter(t=>{
    if((t.domain||0)!==idx) return false;
    if(t.type===T_QUEST) return !t.done;
    if(t.type===T_HABIT) return !habitGoalMet(t); // pending until weekly goal met
    return false;
  });
}
function hasMilestone(idx){ return ((state.milestones&&state.milestones[idx])||0)>0; }

// Capture ceremony — fires once per campaign completion
let flashT=0; // screen flash timer (frames)
function checkMilestones(){
  DOMAINS.forEach((d,i)=>{
    let guard=0;
    while(domainProgress(i)>=1&&guard++<10){
      state.milestones[i]=(state.milestones[i]||0)+1;
      logEvent('capture',null,i);
      save();
      // Ceremony: banner, screen flash, burst of sparkles at the building
      showToast('🏆 '+d.dest+' CAPTURED BY '+d.cls+'!',d.color);
      if(!REDUCED_MOTION) flashT=18;
      const bx=d.targetTx*TS+TS/2,by=d.targetTy*TS+TS/2;
      for(let k=0;k<3;k++) setTimeout(()=>sparkleAt(bx,by),k*350);
      const pc=document.getElementById('pc'+i);
      if(pc){ pc.classList.remove('flash'); void pc.offsetWidth; pc.classList.add('flash'); }
      if(!localStorage.getItem('ta_hint2')){
        localStorage.setItem('ta_hint2','1');
        setTimeout(()=>showToast('A NEW CAMPAIGN BEGINS — MARCH AGAIN!'),2800);
      }
    }
  });
}

// ============ PER-DOMAIN STATUS (replaces the HP system) ============
// BESIEGED: any overdue quest. BEHIND: a weekly-goal habit is genuinely at
// risk. IDLE: nothing pending. MARCHING: pending work, on pace.
const STATUS_INFO={
  MARCHING:{color:'#44cc44',level:0},
  IDLE:    {color:'#8a7ab0',level:0},
  BEHIND:  {color:'#ffcc00',level:1},
  BESIEGED:{color:'#ee2222',level:2},
};
// Days left in the Mon-start week, including today (Mon=7 ... Sun=1)
function daysLeftInWeek(){ const dow=new Date().getDay(); return dow===0?1:8-dow; }
// A habit is at risk only when the remaining checks no longer comfortably
// fit in the remaining days — never punish mere time passing early in the week
function habitAtRisk(t){
  if(t.type!==T_HABIT||habitGoalMet(t)) return false;
  const remaining=(t.goal||1)-(t.weekCount||0);
  const daysLeft=daysLeftInWeek();
  if(t.dailyCap!==false){
    if(remaining>daysLeft) return true;
    if(remaining===daysLeft&&daysLeft<7&&!isDoneToday(t)) return true;
    return false;
  }
  // Uncapped: at risk past Wednesday with under 50% of goal
  return daysLeft<=4&&(t.weekCount||0)<(t.goal||1)*0.5;
}
function domainStatus(idx){
  const tasks=state.tasks.filter(t=>(t.domain||0)===idx);
  if(tasks.some(isOverdue)) return 'BESIEGED';
  if(tasks.some(habitAtRisk)) return 'BEHIND';
  if(!getDomainPendingTasks(idx).length) return 'IDLE';
  return 'MARCHING';
}
// Map status to the 4-tier portrait/sprite art levels.
// Level 3 (critical art) is intentionally unused for now; assets and the
// level-handling code stay in place for Phase 2.
function domainArtLevel(idx){ return STATUS_INFO[domainStatus(idx)].level; }
function statusChip(idx){
  const st=domainStatus(idx);
  const chip=document.createElement('span'); chip.className='status-chip';
  chip.textContent=st; chip.style.color=STATUS_INFO[st].color; chip.style.borderColor=STATUS_INFO[st].color;
  return chip;
}

// Roll derived weekly state forward (called where recalcHP used to be)
function recalcDerived(){ checkWeeklyReset(); }
function checkWeeklyReset(){
  const mon=mondayStr();
  state.tasks.forEach(t=>{
    if(t.type===T_HABIT&&(!t.weekStart||t.weekStart<mon)){
      // Bank hits earned in the expiring week (goal multiples for uncapped)
      const hits=Math.floor((t.weekCount||0)/(t.goal||1));
      if(hits>0){
        t.weeklyHits=(t.weeklyHits||0)+hits;
        t.wkStreak=(t.wkStreak||0)+1;
        logEvent('week',t); // weekly hit awarded here, not at goal-met toast
      } else {
        t.wkStreak=0;
      }
      t.weekCount=0; t.lastDone=null; t.weekStart=mon;
    }
  });
}
function advanceDue(due,days){ const d=due?new Date(due+'T00:00:00'):new Date(); d.setDate(d.getDate()+days); return localDateStr(d); }

    // Draw after insert so clientWidth is real
    drawJourneyStrip(di,strip);
  });
}

    minus.textContent='−'; minus.title='Undo one completion';

    top.appendChild(minus);
  }
  const del=document.createElement('button'); del.className='del'; del.textContent='X'; del.onclick=()=>deleteTask(task.id);
  top.appendChild(editBtn(task.id)); top.appendChild(del);

  // Week strip: dots up to goal (capped: tappable today-logger)
  const strip=document.createElement('div'); strip.className='habit-week';

  for(let k=0;k<goal;k++){

  return div;
}

// ============ ACTIONS ============
function addTask(name,domain,type,goal,due,repeat,dailyCap){
  const di=parseInt(domain)||0, ti=parseInt(type)||0;
  const g=parseInt(goal)||1;
  const rep=ti===T_QUEST?Math.max(0,parseInt(repeat)||0):0;
  const base={id:Date.now()+Math.random(),name,domain:di,type:ti,goal:g,weekStart:mondayStr(),due:due||null,done:false,repeat:rep,doneCount:0};
  const extra=ti===T_HABIT?{dailyCap:dailyCap!==false,weekCount:0,weeklyHits:0,wkStreak:0,lastDone:null}:{};
  state.tasks.push(Object.assign(base,extra));
  recalcDerived();save();refresh();
  // Feedback: toast + sparkle at the unit + portrait flash
  const d=DOMAINS[di];
  const kind=ti===T_HABIT?'NEW HABIT':'NEW QUEST';
  showToast(kind+' — '+d.cls+'!',d.color);
  sparkleAt(unitPos[di].x,unitPos[di].y);
  const pc=document.getElementById('pc'+di);
  if(pc){ pc.classList.remove('flash'); void pc.offsetWidth; pc.classList.add('flash'); }
  // One-time hint teaching the core loop
  if(!localStorage.getItem('ta_hint')){
    localStorage.setItem('ta_hint','1');
    setTimeout(()=>showToast('COMPLETE QUESTS TO MARCH YOUR PARTY ONWARD!'),2600);
  }
}
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const d=DOMAINS[t.domain||0];
  if(t.type===T_HABIT){
    const wasGoalMet=habitGoalMet(t);
    const capped=t.dailyCap!==false;
    if(capped&&isDoneToday(t)){
      // Un-check today (capped only — uncapped undo goes through decHabit)
      t.weekCount=Math.max(0,(t.weekCount||1)-1);
      t.lastDone=null;
      logEvent('unhabit',t);
    } else {
      t.weekCount=(t.weekCount||0)+1;
      t.lastDone=todayStr();
      logEvent('habit',t);
      sparkleAt(unitPos[t.domain||0].x,unitPos[t.domain||0].y);
      // Goal hit this week — big reward
      if(!wasGoalMet&&habitGoalMet(t)){
        const di=t.domain||0;
        showToast('🔥 HABIT GOAL MET — '+d.cls+' ADVANCES!',d.color);
        for(let k=0;k<3;k++) setTimeout(()=>sparkleAt(unitPos[di].x,unitPos[di].y),k*200);
        const pc=document.getElementById('pc'+di);
        if(pc){ pc.classList.remove('flash'); void pc.offsetWidth; pc.classList.add('flash'); }
      }
    }
  } else {
    if(t.repeat>0){
      // Recurring quest: bank the completion and re-arm the due date.
      // Re-arm from the due date when it's still in the future (keeps the
      // cadence), from today when overdue (no instant double-overdue)
      t.doneCount=(t.doneCount||0)+1;
      logEvent('done',t);
      const base=(t.due&&t.due>=todayStr())?t.due:null;
      t.due=advanceDue(base,t.repeat);
      sparkleAt(d.targetTx*TS+TS/2,d.targetTy*TS+TS/2);
      showToast('↻ QUEST COMPLETE — RETURNS '+fmtDue(t.due).toUpperCase().replace('DUE ','')+'!',d.color);
    }
    else if(!t.done){ t.done=true; logEvent('done',t); sparkleAt(d.targetTx*TS+TS/2,d.targetTy*TS+TS/2); showToast('QUEST COMPLETE — '+d.cls+' MARCHES ON!',d.color); }
    else { t.done=false; logEvent('undone',t); }
  }
  recalcDerived();save();refresh();
}

function saveEdit(){
  const t=state.tasks.find(x=>x.id===editId); if(!t){ closeEdit(); return; }
  const name=document.getElementById('editName').value.trim();
  if(name) t.name=name;
  if(t.type!==T_QUEST){
    const g=parseInt(document.getElementById('editGoal').value);
    if(g>=1&&g<=99) t.goal=g;
    t.dailyCap=document.getElementById('editCap').checked;
  } else {
    t.due=document.getElementById('editDate').value||null;
    const r=parseInt(document.getElementById('editRepeat').value);
    if(!isNaN(r)&&r>=0&&r<=365){
      if(r>0&&!(t.repeat>0)) t.doneCount=t.doneCount||0; // turning recurrence on
      t.repeat=r;
    }
  }
  closeEdit();
  recalcDerived();save();refresh();
  if(focusIdx!==null) renderFocusPanel();
  showToast('✎ TASK UPDATED');
}

function snoozeTask(id){
  const t=state.tasks.find(x=>x.id===id); if(!t||!isOverdue(t)) return;
  t.due=advanceDue(null,1);
  recalcDerived();save();refresh();
  showToast('⏰ SNOOZED TO TOMORROW — '+t.name.toUpperCase().slice(0,24));
}
// Undo a recurring-quest completion: take back the banked step and
// pull the due date back one cycle
function decRecurring(id){
  const t=state.tasks.find(x=>x.id===id); if(!t||!(t.repeat>0)||!(t.doneCount>0)) return;
  t.doneCount--;
  logEvent('undone',t);
  if(t.due) t.due=advanceDue(t.due,-t.repeat);
  recalcDerived();save();refresh();
}
// Undo one logged completion on an uncapped habit (misclick protection)
function decHabit(id){
  const t=state.tasks.find(x=>x.id===id); if(!t||t.type!==T_HABIT||t.dailyCap!==false) return;
  if((t.weekCount||0)>0) logEvent('unhabit',t);
  t.weekCount=Math.max(0,(t.weekCount||0)-1);
  recalcDerived();save();refresh();
}

// ============ SAVE FILE EXPORT / IMPORT ============
// Everything lives in localStorage, which browsers can evict — give the
// player a real save file
function exportData(){
  const payload={version:SCHEMA_VERSION,exported:new Date().toISOString(),name:state.name,tasks:state.tasks,milestones:state.milestones,checkin:loadCheckinDates(),events:state.events,eventSums:state.eventSums,meta:META};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='task-adventurer-'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('💾 SAVE FILE EXPORTED');
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!Array.isArray(p.tasks)) throw new Error('bad file');
      state.tasks=p.tasks;
      state.name=((p.name||'HERO')+'').toUpperCase().slice(0,12);
      const ms=p.milestones||p.captures; // old exports used 'captures'
      state.milestones=DOMAINS.map((_,i)=>(ms&&ms[i])||0);
      // Meta rides with the save; old payloads get defaults, then the
      // migration recomputes msBase from the imported milestones
      META=p.meta&&typeof p.meta==='object'?Object.assign(metaDefaults(),p.meta):metaDefaults();
      let v=parseInt(p.version)||1;
      if(v<4) META.msInit=false;
      while(v<SCHEMA_VERSION){ migrate(v); v++; }
      if(p.checkin){
        const dates=Array.isArray(p.checkin)?p.checkin:[p.checkin];
        saveCheckinDates(dates);
      }
      if(Array.isArray(p.events)) state.events=p.events;
      if(Array.isArray(p.eventSums)) state.eventSums=p.eventSums;
      pruneEvents(); saveEvents();
      recalcDerived(); save(); refresh(); updatePortraits(); updateCheckinBtn();
      document.getElementById('heroNameDisplay').textContent=state.name;
      visSteps=DOMAINS.map((_,i)=>domainCurrentProgress(i));
      showToast('📂 SAVE LOADED — WELCOME BACK, '+state.name+'!');
    }catch(e){ showToast('⚠ INVALID SAVE FILE','#ee2222'); }
  };
  r.readAsText(file);
}

// ---- Pre-rendered static layers ----
// Terrain and trees never change, so paint them once to offscreen canvases
// and blit each frame. Only water (animated), units, flags, sparkles, and
// objectives are drawn live. This cuts ~260 tile fills + tree paths per frame.
const baseLayer=document.createElement('canvas');
const treeLayer=document.createElement('canvas');
const WATER_TILES=[];
function buildStaticLayers(){
  baseLayer.width=treeLayer.width=COLS*TS;
  baseLayer.height=treeLayer.height=ROWS*TS;
  const b=baseLayer.getContext('2d'), tg=treeLayer.getContext('2d');
  WATER_TILES.length=0;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=MAP[y][x],px0=x*TS,py0=y*TS,v=(x*13+y*7)%3;
    if(t===0||t===4||t===5){
      b.fillStyle=grassColor(x,y,v); b.fillRect(px0,py0,TS,TS);
      b.fillStyle='rgba(80,180,80,.25)'; if((x+y)%2===0) b.fillRect(px0+3,py0+3,3,3);
      b.fillRect(px0+13,py0+11,2,2); b.fillRect(px0+8,py0+15,2,2);
    } else if(t===3){
      WATER_TILES.push([x,y]);
    } else if(t===2){
      b.fillStyle='#5a5060'; b.fillRect(px0,py0,TS,TS);
      b.fillStyle='#7a7088'; b.fillRect(px0+2,py0+2,TS-4,TS-6);
      b.fillStyle='rgba(255,255,255,.08)'; b.fillRect(px0+3,py0+3,TS-6,2);
      b.fillStyle='rgba(0,0,0,.35)'; b.fillRect(px0,py0+TS-3,TS,3);
    }
    if(t!==3){ b.fillStyle='rgba(0,0,0,.18)'; b.fillRect(px0,py0+TS-1,TS,1); b.fillRect(px0+TS-1,py0,1,TS); }
    // Trees on a separate layer so per-frame water draws under their canopy
    if(t===4){
      const cxp=px0+TS/2,cyp=py0+TS/2;
      tg.fillStyle='rgba(0,0,0,.3)'; tg.beginPath(); tg.ellipse(cxp+1,cyp+8,8,3,0,0,7); tg.fill();
      tg.fillStyle='#5a3a1a'; tg.fillRect(cxp-2,cyp+2,4,7);
      tg.fillStyle='#3a2410'; tg.fillRect(cxp,cyp+2,2,7);
      const tri=(yTop,half,yBase,col)=>{ tg.fillStyle=col; tg.beginPath(); tg.moveTo(cxp,yTop); tg.lineTo(cxp+half,yBase); tg.lineTo(cxp-half,yBase); tg.closePath(); tg.fill(); };
      tri(cyp-7,9,cyp+4,'#0f3010');
      tri(cyp-11,7,cyp-1,'#1a5018');
      tri(cyp-15,5,cyp-6,'#2a7424');
      tg.fillStyle='#4aa83a'; tg.fillRect(cxp-3,cyp-9,2,2); tg.fillRect(cxp-2,cyp-13,2,2);
    }
  }
}
function buildMap(){
  const m=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  const set=(y,x,t)=>{ if(y>=0&&y<ROWS&&x>=0&&x<COLS) m[y][x]=t; };
  const water=(y,x)=>set(y,x,3);
  const tree=(y,x)=>{ if(m[y]&&m[y][x]===0) set(y,x,4); };
  const rock=(y,x)=>{ if(m[y]&&m[y][x]===0) set(y,x,2); };

  // Sea — top-right corner + coastal strip
  for(let y=0;y<8;y++) for(let x=12;x<COLS;x++) water(y,x);
  for(let y=0;y<5;y++) water(y,11);
  for(let y=0;y<3;y++) water(y,10);

  // River — cuts horizontally through mid-map
  for(let x=2;x<9;x++) water(7,x);
  water(7,9); water(8,9); water(8,10);
  // River fords (gaps left at col 1 and col 6 for crossing)

  // Lake — bottom right
  for(let y=13;y<17;y++) for(let x=9;x<12;x++) water(y,x);
  water(12,10); water(12,11); water(17,10);

  // Rocky ridges
  [[1,5],[2,5],[2,6],[1,6],[3,7],[4,7]].forEach(([y,x])=>rock(y,x));
  [[13,3],[14,3],[14,4],[15,4]].forEach(([y,x])=>rock(y,x));
  [[5,11],[5,10],[6,11]].forEach(([y,x])=>rock(y,x));

  // Forest clusters — scattered across open areas
  [
    [0,2],[0,3],[1,2],[1,3],       // top-left
    [3,3],[4,3],[3,4],[4,4],       // mid-left upper
    [0,7],[0,8],[1,8],[1,9],       // top-mid
    [3,9],[4,9],[3,10],            // right-of-center upper
    [9,1],[10,1],[9,2],[10,2],     // left flank mid
    [10,5],[11,5],[11,6],[10,6],   // center-lower
    [15,5],[16,5],[15,6],          // lower-center
    [17,2],[18,2],[18,3],[17,3],   // bottom-left woods
    [16,8],[17,8],[16,9],          // bottom-center-right
    [18,12],[19,12],[19,11],       // bottom-right corner
  ].forEach(([y,x])=>tree(y,x));

  // Set objective tiles (don't overwrite water or rock)
  DOMAINS.forEach(d=>{
    const t=m[d.targetTy]&&m[d.targetTy][d.targetTx];
    if(t!==3&&t!==2) set(d.targetTy,d.targetTx,5);
  });
  return m;
}

function drawHomeHQ(cx,cy,captured,d){
  const homeTasks=state.tasks.filter(t=>(t.domain||0)===0);
  const habitTasks=homeTasks.filter(t=>t.type===T_HABIT);
  const questTasks=homeTasks.filter(t=>t.type===T_QUEST);
  const habitDoneCount=habitTasks.filter(t=>isDoneToday(t)).length;
  const habitTotal=habitTasks.length;
  const messRatio=habitTotal>0?(habitTotal-habitDoneCount)/habitTotal:0; // 0=clean, 1=messy
  const questDone=questTasks.filter(t=>t.done).length;
  // expansion level: 0=shack, 1=small house, 2=house+wing, 3=manor
  const expLevel=Math.min(3,questDone);

  const baseColor=captured?'#d4884c':'#7a5528';
  const roofColor=captured?'#8b3a10':'#4a2810';

  if(captured){ mx.fillStyle='rgba(255,220,80,0.15)'; mx.beginPath(); mx.arc(cx,cy-4,26+expLevel*4,0,7); mx.fill(); }

  // Main structure — grows with expLevel
  const w=14+expLevel*4, h=12+expLevel*2;
  mx.fillStyle=baseColor; mx.fillRect(cx-w/2,cy-2,w,h);
  mx.fillStyle='rgba(0,0,0,.25)'; mx.fillRect(cx+w/2-6,cy-2,6,h);

  // Roof
  const rw=w+4;
  mx.fillStyle=roofColor;
  mx.beginPath(); mx.moveTo(cx-rw/2,cy-2); mx.lineTo(cx,cy-14-expLevel*2); mx.lineTo(cx+rw/2,cy-2); mx.closePath(); mx.fill();
  mx.fillStyle='rgba(255,255,255,.12)';
  mx.beginPath(); mx.moveTo(cx-rw/2,cy-2); mx.lineTo(cx,cy-14-expLevel*2); mx.lineTo(cx-4,cy-2); mx.closePath(); mx.fill();

  // Wing extension when expLevel >= 2
  if(expLevel>=2){
    mx.fillStyle=baseColor; mx.fillRect(cx+w/2,cy,10,8);
    mx.fillStyle=roofColor;
    mx.beginPath(); mx.moveTo(cx+w/2,cy); mx.lineTo(cx+w/2+5,cy-6); mx.lineTo(cx+w/2+10,cy); mx.closePath(); mx.fill();
  }

  // Tower/manor spire when expLevel >= 3
  if(expLevel>=3){
    mx.fillStyle=baseColor; mx.fillRect(cx-4,cy-24,8,14);
    mx.fillStyle=roofColor;
    mx.beginPath(); mx.moveTo(cx-4,cy-24); mx.lineTo(cx,cy-32); mx.lineTo(cx+4,cy-24); mx.closePath(); mx.fill();
  }

  // Door
  mx.fillStyle=captured?'#ffe080':'#330000'; mx.fillRect(cx-3,cy+3,6,h-5);

  // Windows
  mx.fillStyle=captured?'#ffe08088':'#22000066'; mx.fillRect(cx-w/2+4,cy,5,5);
  if(expLevel>=1) mx.fillRect(cx+w/2-9,cy,5,5);

  // Mess overlays — clutter/debris when habits not done
  if(messRatio>0){
    mx.globalAlpha=messRatio*0.75;
    // dirt pile left
    mx.fillStyle='#5a3a10';
    mx.beginPath(); mx.ellipse(cx-w/2+2,cy+h-1,5,2,0,0,7); mx.fill();
    // debris right
    mx.fillStyle='#4a4a30';
    mx.fillRect(cx+w/2-8,cy+h,4,2); mx.fillRect(cx+w/2-5,cy+h+1,2,3);
    // crack on wall when very messy
    if(messRatio>0.5){
      mx.strokeStyle='#2a1a08'; mx.lineWidth=0.7;
      mx.beginPath(); mx.moveTo(cx-3,cy+2); mx.lineTo(cx-5,cy+7); mx.lineTo(cx-2,cy+10); mx.stroke();
      // weeds
      mx.strokeStyle='#2a5a10'; mx.lineWidth=0.8;
      mx.beginPath(); mx.moveTo(cx-w/2,cy+h); mx.lineTo(cx-w/2+1,cy+h-4); mx.stroke();
      mx.beginPath(); mx.moveTo(cx+w/2,cy+h); mx.lineTo(cx+w/2+2,cy+h-5); mx.stroke();
    }
    mx.globalAlpha=1;
  }

  // Flag
  const flagY=expLevel>=3?cy-32:cy-14-expLevel*2;
  mx.strokeStyle=captured?'#ccc':'#555'; mx.lineWidth=1.2;
  mx.beginPath(); mx.moveTo(cx,flagY); mx.lineTo(cx,flagY-9); mx.stroke();
  mx.fillStyle=captured?d.color:'#882222';
  mx.beginPath(); mx.moveTo(cx,flagY-9); mx.lineTo(cx+8,flagY-5); mx.lineTo(cx,flagY); mx.closePath(); mx.fill();
  if(captured){ mx.fillStyle='#ffe840'; mx.font='6px serif'; mx.textAlign='center'; mx.textBaseline='middle'; mx.fillText('★',cx+4,flagY-5); }
}

function grassColor(tx,ty,v){
  if(ty<7&&tx<4)  return ['#24511e','#285a21','#1e461a'][v];  // HOME: warm green
  if(ty<6&&tx>7)  return ['#2a4d18','#305821','#254515'][v];  // WORK: golden green
  if(ty>13&&tx<4) return ['#1a4f20','#1d5823','#165018'][v];  // HEALTH: lush
  if(ty>12&&tx>7) return ['#0f2a14','#122e17','#0a2410'][v];  // SOCIAL: dark

  return ['#1e4d1e','#236123','#1a431a'][v];
}



function drawMap(time){
  const W=mc.width,H=mc.height;
  mx.clearRect(0,0,W,H);

  // Uniform scaling: fill width on portrait, fill height on landscape
  const mapAR=COLS/ROWS, screenAR=W/H;
  mapScale = screenAR<mapAR ? W/(COLS*TS) : H/(ROWS*TS);
  mapOX = (W-COLS*TS*mapScale)/2;
  mapOY = (H-ROWS*TS*mapScale)/2;

  // Fill letterbox bars — subtle checker so dead space looks intentional
  if(mapOX>0.5||mapOY>0.5){
    mx.fillStyle='#070612'; mx.fillRect(0,0,W,H);
    mx.fillStyle='rgba(255,255,255,.018)';
    const cs=28;
    for(let cy2=0;cy2<H;cy2+=cs) for(let cx2=0;cx2<W;cx2+=cs){
      if(((cx2+cy2)/cs)%2===0) mx.fillRect(cx2,cy2,cs,cs);
    }
  }

  mx.save();
  mx.translate(mapOX,mapOY);
  mx.scale(mapScale,mapScale);
  mx.imageSmoothingEnabled=false; // keep the pixel-art layers crisp when scaled

  // Static terrain (grass, rock, grid) — pre-rendered, one blit
  mx.drawImage(baseLayer,0,0);

  // Water — the only animated terrain, drawn live
  for(const [x,y] of WATER_TILES){
    const px0=x*TS,py0=y*TS;
    mx.fillStyle='#152d5e'; mx.fillRect(px0,py0,TS,TS);
    mx.fillStyle='rgba(40,110,200,.35)';
    mx.fillRect(px0,py0,TS,TS);
    mx.strokeStyle='rgba(80,160,255,.5)'; mx.lineWidth=1;
    for(let wy=3;wy<TS;wy+=6){
      mx.beginPath();
      for(let wx=0;wx<=TS;wx+=2){
        const yy=py0+wy+Math.sin((px0+wx)/4+time/300+wy)*1.4;
        wx===0?mx.moveTo(px0+wx,yy):mx.lineTo(px0+wx,yy);
      }
      mx.stroke();
    }
  }

  // Trees — pre-rendered overlay (canopies hang over adjacent water)
  mx.drawImage(treeLayer,0,0);

  // Objectives
  DOMAINS.forEach((d,i)=>drawObjective(d,hasMilestone(i),i));

  // Sparkles
  sparkles.forEach(s=>{ s.t+=0.05; const r=s.t*24,a=1-s.t; if(a>0){mx.fillStyle='rgba(255,255,180,'+a+')';mx.fillRect(s.x+Math.cos(s.a)*r-2,s.y+Math.sin(s.a)*r-2,4,4);} });
  sparkles=sparkles.filter(s=>s.t<1);

  // HQ banner at the crossroads (6,10) — the party's rally point
  const hx=6*TS+TS/2,hy=10*TS+TS/2;
  mx.fillStyle='rgba(0,0,0,.3)'; mx.beginPath(); mx.ellipse(hx,hy+8,6,2.5,0,0,7); mx.fill();
  mx.strokeStyle='#bbb'; mx.lineWidth=1.2;
  mx.beginPath(); mx.moveTo(hx-2,hy+8); mx.lineTo(hx-2,hy-10); mx.stroke();
  mx.fillStyle='#ffd700';
  mx.beginPath(); mx.moveTo(hx-2,hy-10); mx.lineTo(hx+8,hy-6+Math.sin(time/400)); mx.lineTo(hx-2,hy-2); mx.closePath(); mx.fill();

  // Domain units — tile-by-tile march with a hop between squares.
  // Decluttered: no task flags, step plates, dotted trails, or status rings.
  DOMAINS.forEach((d,i)=>{
    const target=domainCurrentProgress(i);
    if(visSteps[i]>target||REDUCED_MOTION) visSteps[i]=target; // snap: un-check, capture reset, or reduced motion
    else if(visSteps[i]<target) visSteps[i]=Math.min(target,visSteps[i]+STEP_SPEED);
    const s0=Math.floor(visSteps[i]), frac=visSteps[i]-s0;
    const [ax2,ay2]=unitTileXY(i,s0);
    const [bx2,by2]=frac>0?unitTileXY(i,s0+1):[ax2,ay2];
    unitPos[i].x=(ax2+(bx2-ax2)*frac)*TS+TS/2;
    unitPos[i].y=(ay2+(by2-ay2)*frac)*TS+TS/2-Math.sin(frac*Math.PI)*4;
    drawUnit(unitPos[i].x,unitPos[i].y,i,domainArtLevel(i));
  });

  // Capture flash — quick white pulse over the whole map
  if(flashT>0){
    mx.fillStyle='rgba(255,250,220,'+(flashT/18*0.45)+')';
    mx.fillRect(0,0,COLS*TS,ROWS*TS);
    flashT--;
  }

  mx.restore();

  // Decorative frame around the map when letterboxed (desktop) — JRPG bezel
  if(mapOX>10||mapOY>10){
    const fx=mapOX,fy=mapOY,fw=COLS*TS*mapScale,fh=ROWS*TS*mapScale;
    mx.strokeStyle='#1a1430'; mx.lineWidth=8; mx.strokeRect(fx-9,fy-9,fw+18,fh+18);
    mx.strokeStyle='#6a5a20'; mx.lineWidth=2; mx.strokeRect(fx-4,fy-4,fw+8,fh+8);
    mx.fillStyle='#c8a840';
    [[fx-8,fy-8],[fx+fw,fy-8],[fx-8,fy+fh],[fx+fw,fy+fh]].forEach(([qx,qy])=>mx.fillRect(qx,qy,8,8));
  }
}

// ============ DOMAIN FOCUS ============
let focusIdx=null;
// Journey strip: every tile of the path laid out left-to-right with
// start banner, walked tiles, the unit, pending-task flags, destination.
// Generalized: draws onto any canvas (focus panel + QUESTS group strips).
function drawJourneyStrip(idx,cv){
  const d=DOMAINS[idx],tiles=DOMAIN_TILES[idx],N=tiles.length;
  const W=cv.width=Math.max(320,cv.clientWidth||320), H=cv.height;
  const g=cv.getContext('2d');
  g.clearRect(0,0,W,H);
  const step=domainCurrentProgress(idx);
  const pending=getDomainPendingTasks(idx);
  const pad=14, destW=44;
  const tw=Math.min(24,(W-pad*2-destW)/(N+1)); // tile cell width
  const ty=H/2-tw/2+6;
  // Start banner
  const sx=pad;
  g.strokeStyle='#bbb'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(sx+4,ty+tw); g.lineTo(sx+4,ty-6); g.stroke();
  g.fillStyle='#ffd700';
  g.beginPath(); g.moveTo(sx+4,ty-6); g.lineTo(sx+14,ty-2); g.lineTo(sx+4,ty+2); g.closePath(); g.fill();
  // Tiles
  for(let k=0;k<N;k++){
    const x=pad+tw*0.8+ (k)*tw;
    const walked=k<step;
    g.fillStyle=walked?d.color+'88':'#141228';
    g.fillRect(x+1,ty+1,tw-2,tw-2);
    g.strokeStyle=walked?d.color:'#2a2050'; g.lineWidth=1;
    g.strokeRect(x+1,ty+1,tw-2,tw-2);
    // Pending-task flag on upcoming tiles
    const pi=k-step;
    if(pi>=0&&pi<pending.length){
      const t=pending[pi];
      const fc=t.type===T_QUEST?'#ffe040':'#44eeff';
      const fx=x+tw/2;
      g.fillStyle=d.color; g.fillRect(fx-1,ty-8,2,9);
      g.fillStyle=fc;
      g.beginPath(); g.moveTo(fx,ty-8); g.lineTo(fx+8,ty-4.5); g.lineTo(fx,ty-1); g.closePath(); g.fill();
    }
  }
  // Unit sprite at current tile (or start)
  const ux=step<=0?sx+4:pad+tw*0.8+(step-1)*tw+tw/2;
  const sImg=domainSpriteImgs[idx];
  const sw=Math.max(tw+8,24);
  if(sImg&&sImg.complete&&sImg.naturalWidth>0) g.drawImage(sImg,ux-sw/2,ty+tw-sw-2,sw,sw);
  else { g.fillStyle=d.color; g.beginPath(); g.arc(ux,ty+tw/2,tw/2,0,7); g.fill(); }
  // Destination
  const dx2=pad+tw*0.8+N*tw+6;
  g.fillStyle=hasMilestone(idx)?d.color:'#3a3050';
  g.fillRect(dx2,ty-4,18,tw+4);
  g.fillStyle=hasMilestone(idx)?d.dark:'#1a1430';
  g.beginPath(); g.moveTo(dx2-2,ty-4); g.lineTo(dx2+9,ty-14); g.lineTo(dx2+20,ty-4); g.closePath(); g.fill();
  g.fillStyle=hasMilestone(idx)?'#ffe840':'#888'; g.font='8px serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('★',dx2+9,ty+tw/2-2);
  g.fillStyle=d.color; g.font='5px "Press Start 2P",monospace'; g.textBaseline='top';
  const dn=d.dest.length>10?d.dest.slice(0,9)+'…':d.dest;
  g.fillText(dn,Math.min(W-dn.length*3,dx2+9),ty+tw+4);
}
function openFocus(idx){ focusIdx=idx; renderFocusPanel(); document.getElementById('focusPanel').classList.add('open'); document.getElementById('focusBg').classList.add('open'); }
function closeFocus(){ focusIdx=null; document.getElementById('focusPanel').classList.remove('open'); document.getElementById('focusBg').classList.remove('open'); }

function renderFocusPanel(){
  if(focusIdx===null) return;

  document.getElementById('focusCls').textContent=d.cls+' CLASS';
  document.getElementById('focusName').textContent=d.name; document.getElementById('focusName').style.color=d.color;

  renderPortraitCanvas(av,d,focusIdx,domainArtLevel(focusIdx));
  av.style.borderColor=d.color;

  tasks.forEach(task=>{

      body.appendChild(row); return;
    }
    body.appendChild(buildQuestRow(task,renderFocusPanel));
  });
}

// ============ CHECK-IN ============
function loadCheckinDates(){
  try{
    const raw=localStorage.getItem('ta_checkin');
    if(!raw) return [];
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed)) return parsed;
    // migrate: old format was a plain date string
    return [parsed];
  }catch(e){ return []; }
}
function saveCheckinDates(dates){ localStorage.setItem('ta_checkin',JSON.stringify(dates)); }
function checkinDone(){ return loadCheckinDates().includes(todayStr()); }
function checkinStreak(){
  const dates=loadCheckinDates().slice().sort().reverse();
  if(!dates.length) return 0;
  let streak=0;
  let d=new Date(); d.setHours(0,0,0,0);
  // allow streak to count if today not yet reported (check from yesterday)
  const todayInclusive=dates.includes(localDateStr(d));
  if(!todayInclusive){
    // yesterday must be in dates to have an ongoing streak
    d.setDate(d.getDate()-1);
  }
  for(let i=0;i<365;i++){
    const s=localDateStr(d);
    if(dates.includes(s)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function updateCheckinBtn(){
  const btn=document.getElementById('checkinBtn'); if(!btn) return;
  const done=checkinDone();
  const streak=checkinStreak();
  if(done){
    btn.textContent=streak>1?'✓ '+streak+'🔥 DAY STREAK':'✓ REPORTED TODAY';
  } else {
    btn.textContent=streak>0?'📋 REPORT ('+streak+'🔥)':'📋 DAILY REPORT';
  }
  btn.classList.toggle('done',done);
}
function showCheckin(){
  const wrap=document.getElementById('checkinWrap');
  document.getElementById('checkinDate').textContent=new Date().toDateString().toUpperCase();
  const streak=checkinStreak();
  const el=document.getElementById('checkinStreak');
  if(el) el.textContent=streak>0?streak+' DAY STREAK 🔥':'';
  renderCheckin();
  wrap.classList.add('open');
}
function renderCheckin(){
  const list=document.getElementById('checkinList'); list.innerHTML='';
  DOMAINS.forEach((d,di)=>{
    const tasks=state.tasks.filter(t=>(t.domain||0)===di&&t.type===T_HABIT);
    if(!tasks.length) return;
    const sect=document.createElement('div'); sect.className='ck-sect'; sect.style.color=d.color; sect.textContent=d.cls+' — '+d.name; list.appendChild(sect);
    tasks.forEach(task=>{
      const row=buildHabitRow(task,d);
      row.querySelectorAll('.cb,.hdot,.del').forEach(el=>{ const orig=el.onclick; if(orig) el.onclick=()=>{ orig(); renderCheckin(); }; });
      list.appendChild(row);
    });
  });
  if(!list.children.length) list.innerHTML='<div class="empty">ADD HABITS TO USE THIS FEATURE</div>';
}
function submitCheckin(){
  const dates=loadCheckinDates();
  const today=todayStr();
  if(!dates.includes(today)){ dates.push(today); logEvent('report'); }
  saveCheckinDates(dates);
  document.getElementById('checkinWrap').classList.remove('open');
  updateCheckinBtn();
  const streak=checkinStreak();
  if(streak>1) showToast('📋 REPORT FILED — '+streak+' DAY STREAK 🔥','#44cc44');
}

// GitHub-style contribution grid: 12 weeks × 7 days, intensity = count
function drawChronGrid(){
  const cv=document.getElementById('chronGrid');
  const WEEKS=12,CELL=8,GAP=2;
  // pad so the grid ends on today's column; rows are Sun..Sat
  const todayDow=new Date().getDay();
  const days=(WEEKS-1)*7+todayDow+1;
  const data=aggDailyCompletions(state.events,days);
  const max=Math.max(1,...data.map(x=>x.n));
  cv.width=WEEKS*(CELL+GAP)+GAP; cv.height=7*(CELL+GAP)+GAP;
  const g=cv.getContext('2d');
  g.fillStyle='#070710'; g.fillRect(0,0,cv.width,cv.height);
  // day count above makes the first cell a Sunday, so i maps straight to the grid
  data.forEach((day,i)=>{
    const wk=Math.floor(i/7), dow=i%7;
    const x=GAP+wk*(CELL+GAP), y=GAP+dow*(CELL+GAP);
    if(day.n===0){ g.fillStyle='#16122a'; }
    else{
      const a=.25+.75*(day.n/max);
      g.fillStyle='rgba(255,215,0,'+a.toFixed(2)+')';
    }
    g.fillRect(x,y,CELL,CELL);
  });
}

// Stacked bar chart: deeds per day for 14 days, colored by domain
function drawChronBars(){
  const cv=document.getElementById('chronBars');
  const N=14,BAR=26,GAP=6,H=110,PADB=14;
  const data=aggDailyByDomain(state.events,N);
  const max=Math.max(1,...data.map(d=>d.n.reduce((a,b)=>a+b,0)));
  cv.width=N*(BAR+GAP)+GAP; cv.height=H+PADB;
  const g=cv.getContext('2d');
  g.fillStyle='#070710'; g.fillRect(0,0,cv.width,cv.height);
  g.font='7px monospace'; g.textAlign='center';
  data.forEach((day,i)=>{
    const x=GAP+i*(BAR+GAP);
    let y=H;
    day.n.forEach((cnt,di)=>{
      if(!cnt) return;
      const h=Math.max(2,Math.round(cnt/max*(H-12)));
      y-=h;
      g.fillStyle=DOMAINS[di].color;
      g.fillRect(x,y,BAR,h);
    });
    const tot=day.n.reduce((a,b)=>a+b,0);
    if(tot){ g.fillStyle='#cbb8ff'; g.fillText(String(tot),x+BAR/2,y-3); }
    // weekday initial under each bar
    g.fillStyle='#665a90';
    g.fillText('SMTWTFS'[new Date(day.date+'T12:00:00').getDay()],x+BAR/2,H+11);
  });
}

function renderChronStreaks(){

// ============ NOTIFICATIONS ============
const NOTIF_KEY='ta_notif'; // 'granted'|'denied'|''
const NOTIF_TIME_KEY='ta_notif_time'; // "HH:MM"
let _lastDailyNotifDate=''; // prevent double-fire same day
let _lastOverdueNotifDate=''; // prevent spam

function notifEnabled(){ return Notification&&Notification.permission==='granted'&&localStorage.getItem(NOTIF_KEY)==='granted'; }

function updateNotifStatus(){
  const el=document.getElementById('notifStatus'); if(!el) return;
  if(!('Notification' in window)){ el.textContent='NOT SUPPORTED'; return; }
  const p=Notification.permission;
  if(p==='granted'&&localStorage.getItem(NOTIF_KEY)==='granted') el.textContent='ON';
  else if(p==='denied') el.textContent='BLOCKED IN BROWSER';
  else el.textContent='OFF';
}

function toggleNotifSettings(){
  const row=document.getElementById('notifRow'); if(!row) return;
  const showing=row.style.display==='flex';
  if(showing){ row.style.display='none'; return; }
  row.style.display='flex';
  // First time: request permission
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().then(p=>{
      if(p==='granted') localStorage.setItem(NOTIF_KEY,'granted');
      updateNotifStatus();
    });
  } else if('Notification' in window && Notification.permission==='granted'){
    localStorage.setItem(NOTIF_KEY,'granted');
    updateNotifStatus();
  }
}

function saveNotifPref(){
  const t=document.getElementById('notifTime'); if(!t) return;
  localStorage.setItem(NOTIF_TIME_KEY,t.value);
}

function sendNotif(title,body,tag){
  if(!notifEnabled()) return;
  try{
    new Notification(title,{body,icon:'./icon-192.png',badge:'./icon-192.png',tag,renotify:true});
  }catch(e){}
}

function countOverdueTasks(){
  const today=todayStr();
  return state.tasks.filter(t=>!t.done&&t.type===T_QUEST&&t.due&&t.due<today).length;
}

function checkScheduledNotifs(){
  if(!notifEnabled()) return;
  const now=new Date();
  const hhmm=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const target=localStorage.getItem(NOTIF_TIME_KEY)||'20:00';
  const today=todayStr();

  // Daily report reminder — fires once in the target minute if not yet reported
  if(hhmm===target&&_lastDailyNotifDate!==today){
    _lastDailyNotifDate=today;
    if(!checkinDone()){
      const streak=checkinStreak();
      const body=streak>0?'Keep your '+streak+'-day streak alive — file today\'s report!':'Log your progress and keep the party moving.';
      sendNotif('📋 Daily Report Due',body,'ta-daily');
    }
  }

  // Overdue alert — fires once per day on wake/hourly check if there are overdue quests
  if(_lastOverdueNotifDate!==today){
    const n=countOverdueTasks();
    if(n>0){
      _lastOverdueNotifDate=today;
      sendNotif('⚠ Overdue Quests',n+' quest'+(n===1?' is':' are')+' overdue — snooze or complete them to lift the siege.','ta-overdue');
    }
  }
}

function initNotifUI(){
  const timeEl=document.getElementById('notifTime');
  if(timeEl) timeEl.value=localStorage.getItem(NOTIF_TIME_KEY)||'20:00';
  updateNotifStatus();
}

// Canvas tap → open focus for the tapped unit or destination building
mc.addEventListener('click',e=>{
  const rect=mc.getBoundingClientRect();
  const lx=((e.clientX-rect.left)*mc.width/rect.width - mapOX)/mapScale;
  const ly=((e.clientY-rect.top)*mc.height/rect.height - mapOY)/mapScale;
  for(let i=0;i<DOMAINS.length;i++){
    if(Math.abs(lx-unitPos[i].x)<18&&Math.abs(ly-unitPos[i].y)<22){ openFocus(i); return; }
  }
  for(let i=0;i<DOMAINS.length;i++){
    const d=DOMAINS[i],bx=d.targetTx*TS+TS/2,by=d.targetTy*TS+TS/2;
    if(Math.abs(lx-bx)<20&&Math.abs(ly-by)<22){ openFocus(i); return; }
  }
});

// ============ TAB SHELL (mobile three-view structure) ============
// Exactly one of QUESTS / WORLD / PARTY visible at a time on mobile.
// Desktop (>600px) ignores tabs entirely — CSS shows all panels.
let currentTab='QUESTS';
const mobileMQ=window.matchMedia('(max-width:600px)');
function worldVisible(){ return !mobileMQ.matches||currentTab==='WORLD'; }
let rafId=null;
function loopIfVisible(time){
  rafId=null;
  if(!worldVisible()) return; // paused — switchTab restarts us
  drawMap(time);
  rafId=requestAnimationFrame(loopIfVisible);
}
function startLoop(){ if(rafId===null&&worldVisible()) rafId=requestAnimationFrame(loopIfVisible); }
function switchTab(tab){
  currentTab=tab;
  document.body.dataset.tab=tab;
  ['QUESTS','WORLD','PARTY'].forEach(t=>{
    const b=document.getElementById('tab'+t[0]+t.slice(1).toLowerCase());
    if(b) b.classList.toggle('active',t===tab);
  });
  if(tab==='WORLD') fitMap();
  startLoop(); // no-op when the map stays hidden
  if(tab==='QUESTS') renderList();
  if(tab==='PARTY') updatePortraits();
}
mobileMQ.addEventListener('change',()=>{ switchTab(currentTab); });

buildPortraitCol(); populateSelects(); drawScroll();
buildStaticLayers();
fitMap(); load(); recalcDerived(); save(); refresh(); updateCheckinBtn();
visSteps=DOMAINS.map((_,i)=>domainCurrentProgress(i));
document.getElementById('heroNameDisplay').textContent=state.name;
updateFormFields();
initNotifUI();
switchTab('QUESTS');
// Check overdue alerts on launch (daily report reminder fires at the scheduled minute)
setTimeout(checkScheduledNotifs,2000);
document.getElementById('exportBtn').onclick=exportData;
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change',e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
// Recalc when the tab wakes up — catches overnight date/week rollovers in long-lived tabs
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ recalcDerived(); save(); refresh(); updateCheckinBtn(); checkScheduledNotifs(); } });
setInterval(()=>{ recalcDerived(); save(); refresh(); checkScheduledNotifs(); },60*1000); // check every minute for notification timing
// PWA: offline support + home-screen install; also requests persistent
// storage so iOS/Android don't evict localStorage after 7 days idle
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
