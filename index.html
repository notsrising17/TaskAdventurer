<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Task Adventurer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffd700; --text:#e8e0ff;
    --hp-green:#44cc44; --hp-yellow:#ffcc00; --hp-orange:#ff8800; --hp-red:#ee2222;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#080810;color:var(--text);font-family:'Press Start 2P',monospace;-webkit-font-smoothing:none;overflow:hidden;}

  /* Full-screen map as world background */
  #mapWrap{position:fixed;inset:0;background:#080810;}
  #mapCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%);
    z-index:2;}

  /* Floating HUD panels */
  .hud{position:fixed;z-index:5;}
  .glass{background:rgba(10,8,28,0.85);border:2px solid var(--gold);
    box-shadow:0 0 16px rgba(0,0,0,.7), inset 0 0 14px rgba(0,0,0,.5);
    backdrop-filter:blur(2px);}

  /* Portrait - top left */
  #portraitPanel{top:10px;left:10px;width:150px;padding:6px;display:flex;flex-direction:column;align-items:center;}
  #portraitCanvas{image-rendering:pixelated;width:130px;height:180px;display:block;}
  .nameplate{margin-top:5px;font-size:7px;color:var(--gold);text-shadow:1px 1px #000;letter-spacing:1px;}

  /* Stats - top right */
  #statsPanel{top:10px;right:10px;width:200px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .stat-label{font-size:6px;color:#9a8ad0;}
  .stat-name{font-size:10px;color:var(--gold);text-shadow:1px 1px #000;}
  .statline{display:flex;align-items:center;gap:6px;}
  .icn{image-rendering:pixelated;flex:0 0 auto;}
  .hp-row{font-size:6px;display:flex;justify-content:space-between;align-items:center;}
  .barwrap{margin-top:4px;height:14px;border:2px solid #2a2050;background:#070710;padding:2px;}
  .bar{height:100%;width:100%;transition:width .5s, background-color .5s;}
  .tasks-stat{font-size:6px;color:var(--text);}
  .status-badge{font-size:7px;padding:5px;text-align:center;border:2px solid;letter-spacing:1px;}
  .status-badge.blink{animation:badgeblink .7s steps(1) infinite;}
  @keyframes badgeblink{0%{opacity:1;}50%{opacity:.25;}100%{opacity:1;}}

  /* Add form - bottom center, sits above the task list */
  #formPanel{left:50%;transform:translateX(-50%);bottom:calc(40vh + 16px);width:92%;max-width:440px;
    padding:8px;display:flex;gap:8px;align-items:stretch;}
  #formPanel.collapsed{bottom:54px;}
  #formPanel input{font-family:inherit;font-size:7px;background:#070710;color:var(--text);border:2px solid #4a3a8a;padding:8px;outline:none;}
  #taskName{flex:1;min-width:0;}
  #taskDate{flex:0 0 auto;}
  #formPanel input::-webkit-calendar-picker-indicator{filter:invert(.8);}
  #addBtn{font-family:inherit;font-size:8px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:9px;cursor:pointer;letter-spacing:1px;white-space:nowrap;}
  #addBtn:active{transform:translateY(2px);border-bottom-width:1px;}

  /* Task list - fixed bottom, full width, scrollable */
  #listPanel{left:0;right:0;bottom:0;width:100%;max-height:40vh;
    background:rgba(8,6,20,0.92);border-top:3px solid var(--gold);
    box-shadow:0 -6px 18px rgba(0,0,0,.7);display:flex;flex-direction:column;}
  #listHead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:6px 10px;border-bottom:1px solid #2a2050;}
  #listHead .lbl{font-size:7px;color:var(--gold);letter-spacing:1px;text-shadow:1px 1px #000;}
  #collapseBtn{font-family:inherit;font-size:9px;background:none;border:1px solid #4a3a8a;color:var(--gold);
    width:24px;height:20px;cursor:pointer;line-height:1;}
  #listBody{overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px;}
  #listPanel.collapsed #listBody{display:none;}
  #listPanel.collapsed{max-height:none;}
  .empty{font-size:7px;color:#6a5aa0;text-align:center;padding:14px;line-height:1.8;}
  .task{display:flex;align-items:center;gap:6px;height:32px;background:rgba(12,10,32,0.85);border:1px solid #2a2050;padding:0 6px;font-size:7px;transition:opacity .4s;}
  .task.overdue{border-color:var(--hp-red);box-shadow:0 0 6px rgba(238,34,34,.4);}
  .task.done{opacity:.4;}
  .task.done .tname{text-decoration:line-through;}
  .cb{width:16px;height:16px;flex:0 0 16px;border:2px solid #4a3a8a;background:#070710;cursor:pointer;position:relative;}
  .cb.checked{background:var(--hp-green);border-color:var(--hp-green);}
  .cb.checked::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;border:solid #062;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .25s;}
  @keyframes pop{0%{transform:rotate(45deg) scale(0);}100%{transform:rotate(45deg) scale(1);}}
  .tname{flex:1;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:6px;padding:3px 4px;border:1px solid;white-space:nowrap;flex:0 0 auto;}
  .badge.due{color:#9ad0ff;border-color:#3a5a8a;}
  .badge.over{color:#fff;background:var(--hp-red);border-color:#ff6a6a;}
  .del{flex:0 0 auto;font-family:inherit;font-size:8px;background:#2a0a14;color:#ff8888;border:1px solid #6a2030;padding:4px 6px;cursor:pointer;}
  .del:active{transform:translateY(1px);}

  /* Game over */
  #gameover{position:fixed;inset:0;background:rgba(20,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:20px;}
  #gameover.show{display:flex;}
  #gameover h1{font-size:18px;color:var(--hp-red);text-shadow:2px 2px #000;}
  #gameover p{font-size:8px;line-height:1.8;color:#ffcccc;}
  #reviveBtn{font-family:inherit;font-size:9px;background:var(--gold);color:#1a1400;border:none;border-bottom:3px solid #a88a00;padding:12px;cursor:pointer;}

  @media (max-width:480px){
    #mapWrap{height:max(340px,100%);}
    #portraitPanel{width:118px;}
    #portraitCanvas{width:104px;height:144px;}
    #statsPanel{width:160px;padding:8px;gap:8px;}
    .stat-name{font-size:8px;}
    #formPanel{width:96%;gap:5px;padding:6px;flex-wrap:wrap;}
    #addBtn{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div id="mapWrap">
  <canvas id="mapCanvas" width="400" height="260"></canvas>
</div>
<div id="vignette"></div>

<div id="portraitPanel" class="hud glass">
  <canvas id="portraitCanvas" width="130" height="180"></canvas>
  <div class="nameplate">HERO</div>
</div>

<div id="statsPanel" class="hud glass">
  <div>
    <div class="stat-label">NAME</div>
    <div class="stat-name">HERO</div>
  </div>
  <div>
    <div class="hp-row"><span class="statline"><canvas class="icn" id="heartIcn" width="9" height="9"></canvas><span class="stat-label">HP</span></span><span id="hpText">100/100</span></div>
    <div class="barwrap"><div class="bar" id="hpBar"></div></div>
  </div>
  <div class="statline"><canvas class="icn" id="scrollIcn" width="9" height="9"></canvas><span class="tasks-stat">TASKS <span id="taskStat">0/0</span></span></div>
  <div class="status-badge" id="statusBadge">READY</div>
</div>

<div id="formPanel" class="hud glass">
  <input type="text" id="taskName" placeholder="QUEST NAME..." maxlength="60">
  <input type="date" id="taskDate">
  <button id="addBtn">+ ADD</button>
</div>

<div id="listPanel" class="hud">
  <div id="listHead">
    <span class="lbl">QUEST LOG</span>
    <button id="collapseBtn">v</button>
  </div>
  <div id="listBody"></div>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p>ALL QUESTS OVERDUE.<br>THE HERO HAS FALLEN.</p>
  <button id="reviveBtn">REVIVE (RESTORE HP)</button>
</div>

<script>
//============ STATE ============
const HP_MAX = 100;
let state = { hp: HP_MAX, tasks: [] };

function load(){
  try{
    const t = JSON.parse(localStorage.getItem('ta_tasks')||'[]');
    if(Array.isArray(t)) state.tasks = t;
    const h = parseInt(localStorage.getItem('ta_hp'));
    if(!isNaN(h)) state.hp = h;
  }catch(e){}
}
function save(){
  localStorage.setItem('ta_tasks', JSON.stringify(state.tasks));
  localStorage.setItem('ta_hp', String(state.hp));
}

function isOverdue(task){
  if(task.done || !task.due) return false;
  const due = new Date(task.due+'T23:59:59');
  return new Date() > due;
}

function recalcHP(){
  const incomplete = state.tasks.filter(t=>!t.done);
  const overdue = state.tasks.filter(t=>isOverdue(t));
  let hp = HP_MAX - overdue.length*10;
  const allOverdue = incomplete.length>0 && overdue.length===incomplete.length;
  if(hp < 1){
    hp = allOverdue ? 0 : 1;
  }
  state.hp = Math.max(0, Math.min(HP_MAX, hp));
}

//============ STATE LEVELS ============
function hpLevel(){
  const hp = state.hp;
  if(hp>=75) return 0;
  if(hp>=50) return 1;
  if(hp>=25) return 2;
  return 3;
}
const STATUS = ['READY','FATIGUED','WOUNDED','CRITICAL'];
const STATUS_COLOR = ['#44cc44','#ffcc00','#ff8800','#ee2222'];
function hpColor(){
  const hp=state.hp;
  if(hp>=60) return '#44cc44';
  if(hp>=35) return '#ffcc00';
  if(hp>=18) return '#ff8800';
  return '#ee2222';
}

//============ STAT ICONS ============
function drawHeart(){
  const c=document.getElementById('heartIcn'), g=c.getContext('2d');
  g.clearRect(0,0,9,9); g.fillStyle='#ee4466';
  const pts=[[1,2],[2,1],[3,1],[4,2],[5,1],[6,1],[7,2],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[2,4],[3,4],[4,4],[5,4],[6,4],[3,5],[4,5],[5,5],[4,6]];
  pts.forEach(([x,y])=>g.fillRect(x,y,1,1));
}
function drawScroll(){
  const c=document.getElementById('scrollIcn'), g=c.getContext('2d');
  g.clearRect(0,0,9,9); g.fillStyle='#e8d8a0'; g.fillRect(1,1,6,7);
  g.fillStyle='#a89860'; g.fillRect(1,1,6,1); g.fillRect(1,7,6,1);
  g.strokeStyle='#2e8b2e'; g.lineWidth=1; g.beginPath();
  g.moveTo(2.5,4.5); g.lineTo(3.5,6); g.lineTo(6,2.5); g.stroke();
}

//============ STATS UI ============
function renderStats(){
  const lvl = hpLevel();
  document.getElementById('hpText').textContent = state.hp+'/'+HP_MAX;
  const bar = document.getElementById('hpBar');
  bar.style.width = (state.hp/HP_MAX*100)+'%';
  const c = hpColor();
  bar.style.backgroundColor=c;
  bar.style.backgroundImage='repeating-linear-gradient(90deg,'+c+' 0 5px, rgba(0,0,0,.28) 5px 6px)';
  const done = state.tasks.filter(t=>t.done).length;
  document.getElementById('taskStat').textContent = done+'/'+state.tasks.length;
  const sb = document.getElementById('statusBadge');
  sb.textContent = STATUS[lvl];
  sb.style.color = STATUS_COLOR[lvl];
  sb.style.borderColor = STATUS_COLOR[lvl];
  sb.classList.toggle('blink', lvl>=2);
}

//============ TASK LIST UI ============
function fmtDue(due){
  if(!due) return '';
  const d = new Date(due+'T00:00:00');
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return 'Due '+m[d.getMonth()]+' '+d.getDate();
}
function sortTasks(){
  return [...state.tasks].sort((a,b)=>{
    const ao=isOverdue(a), bo=isOverdue(b);
    if(ao!==bo) return ao?-1:1;
    if(a.done!==b.done) return a.done?1:-1;
    const ad=a.due||'9999-99-99', bd=b.due||'9999-99-99';
    return ad.localeCompare(bd);
  });
}
function renderList(){
  const el = document.getElementById('listBody');
  el.innerHTML='';
  if(state.tasks.length===0){
    el.innerHTML='<div class="empty">NO QUESTS YET.<br>ADD ONE TO BEGIN!</div>';
    return;
  }
  sortTasks().forEach(task=>{
    const over = isOverdue(task);
    const div = document.createElement('div');
    div.className='task'+(over?' overdue':'')+(task.done?' done':'');
    const cb = document.createElement('div');
    cb.className='cb'+(task.done?' checked':'');
    cb.onclick=()=>toggleTask(task.id);
    const name = document.createElement('div');
    name.className='tname'; name.textContent=task.name;
    div.appendChild(cb); div.appendChild(name);
    if(task.due){
      const badge=document.createElement('div');
      if(over){ badge.className='badge over'; badge.textContent='OVERDUE'; }
      else{ badge.className='badge due'; badge.textContent=fmtDue(task.due); }
      div.appendChild(badge);
    }
    const del=document.createElement('button');
    del.className='del'; del.textContent='X';
    del.onclick=()=>deleteTask(task.id);
    div.appendChild(del);
    el.appendChild(div);
  });
}

//============ ACTIONS ============
function addTask(name,due){
  state.tasks.push({id:Date.now()+Math.random(), name, due, done:false});
  recalcHP(); save(); rebuildMarkers(); refresh();
}
function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.done){
    t.done=true;
    state.hp = Math.min(HP_MAX, state.hp+15);
    sparkleAt(t.markerX, t.markerY);
  }else{
    t.done=false;
    recalcHP();
  }
  save(); rebuildMarkers(); refresh();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  recalcHP(); save(); rebuildMarkers(); refresh();
}

function refresh(){
  renderStats(); renderList(); checkGameOver();
}
function checkGameOver(){
  const incomplete = state.tasks.filter(t=>!t.done);
  const overdue = state.tasks.filter(t=>isOverdue(t));
  const allOver = incomplete.length>0 && overdue.length===incomplete.length;
  const go = document.getElementById('gameover');
  if(state.hp<=0 && allOver) go.classList.add('show');
  else go.classList.remove('show');
}

//============ PORTRAIT CANVAS ============
const pc = document.getElementById('portraitCanvas');
const px = pc.getContext('2d');
const GLOW=['#2a4cff','#ffcc22','#ff7722','#ff2222'];
function drawPortrait(bob){
  const lvl = hpLevel();
  const W=130,H=180, cx=65;
  px.clearRect(0,0,W,H);
  let bg = px.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#161228'); bg.addColorStop(1,'#06060f');
  px.fillStyle=bg; px.fillRect(0,0,W,H);
  let gl = px.createRadialGradient(cx,80,8,cx,80,80);
  gl.addColorStop(0, GLOW[lvl]+'55'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  px.fillStyle=gl; px.fillRect(0,0,W,H);

  px.save();
  px.translate(0, bob);

  px.fillStyle='#e0b888';
  px.fillRect(54,116,22,26);
  px.fillStyle='#caa070'; px.fillRect(54,116,22,5);

  let col = px.createLinearGradient(20,140,110,180);
  const base=['#4466cc','#aa8822','#aa5522','#882222'][lvl];
  const lite=['#88aaff','#ddcc66','#dd9966','#cc6666'][lvl];
  col.addColorStop(0,base); col.addColorStop(.5,lite); col.addColorStop(1,base);
  px.fillStyle=col;
  px.beginPath();
  px.moveTo(16,180); px.lineTo(36,134); px.lineTo(65,152); px.lineTo(94,134); px.lineTo(114,180);
  px.closePath(); px.fill();
  px.strokeStyle='rgba(255,255,255,.35)'; px.lineWidth=1.5;
  px.beginPath(); px.moveTo(36,134); px.lineTo(65,152); px.lineTo(94,134); px.stroke();
  px.fillStyle='#cfe0ff';
  px.beginPath(); px.moveTo(55,150);px.lineTo(65,162);px.lineTo(75,150);px.lineTo(65,144);px.closePath();px.fill();

  px.fillStyle='#f2c98a';
  px.beginPath();
  px.moveTo(cx,40);
  px.bezierCurveTo(28,42,30,95,52,118);
  px.bezierCurveTo(60,128,70,128,78,118);
  px.bezierCurveTo(100,95,102,42,cx,40);
  px.closePath();
  px.fill();
  const facePath=()=>{px.beginPath();px.moveTo(cx,40);px.bezierCurveTo(28,42,30,95,52,118);px.bezierCurveTo(60,128,70,128,78,118);px.bezierCurveTo(100,95,102,42,cx,40);px.closePath();};
  px.save(); facePath(); px.clip();
  px.fillStyle='#d4a56a';
  px.fillRect(86,30,50,120);
  px.restore();
  px.save(); facePath(); px.clip();
  px.fillStyle='rgba(255,248,238,.7)';
  px.beginPath(); px.ellipse(46,62,9,16,-0.3,0,7); px.fill();
  px.restore();
  px.strokeStyle='#3a2818'; px.lineWidth=1.2; facePath(); px.stroke();

  const hairDark=['#3a2860','#2e2818','#2e1808','#2e0808'][lvl];
  const hairMid =['#5a3a8a','#5a4a28','#5a3018','#5a1818'][lvl];
  const hairLite=['#8a6ad0','#a08a48','#a06038','#a04040'][lvl];
  px.fillStyle=hairDark;
  px.beginPath();
  px.moveTo(30,76);
  px.lineTo(22,40); px.lineTo(40,58); px.lineTo(43,20); px.lineTo(58,52);
  px.lineTo(64,14); px.lineTo(76,50); px.lineTo(88,24); px.lineTo(94,56);
  px.lineTo(106,30); px.lineTo(108,78);
  px.bezierCurveTo(100,52,36,52,30,76);
  px.closePath(); px.fill();
  px.beginPath();
  px.moveTo(40,58); px.lineTo(52,80); px.lineTo(60,56); px.lineTo(70,82); px.lineTo(78,55);
  px.lineTo(88,76); px.bezierCurveTo(70,60,55,60,40,58); px.closePath(); px.fill();
  px.fillStyle=hairMid;
  px.beginPath();px.moveTo(43,22);px.lineTo(50,56);px.lineTo(56,40);px.closePath();px.fill();
  px.beginPath();px.moveTo(76,50);px.lineTo(84,30);px.lineTo(90,52);px.closePath();px.fill();
  px.beginPath();px.moveTo(30,74);px.lineTo(36,100);px.lineTo(44,72);px.closePath();px.fill();
  px.beginPath();px.moveTo(108,76);px.lineTo(100,100);px.lineTo(92,72);px.closePath();px.fill();
  px.strokeStyle=hairLite; px.lineWidth=1.5;
  px.beginPath();
  px.moveTo(22,40);px.lineTo(43,20);px.moveTo(64,14);px.lineTo(76,50);
  px.moveTo(88,24);px.lineTo(94,56);px.moveTo(106,30);px.lineTo(108,55);
  px.stroke();

  const eyeY=92;
  function eyeWhite(x){
    px.fillStyle='#f4f8ff'; px.beginPath();px.ellipse(x,eyeY,9,11,0,0,7);px.fill();
  }
  function iris(x,squint){
    const top = squint?eyeY-1:eyeY+1;
    let ig=px.createRadialGradient(x-1,top-1,1,x,top,6);
    ig.addColorStop(0,'#4488ff'); ig.addColorStop(.55,'#2a5acc'); ig.addColorStop(1,'#1a3a8a');
    px.fillStyle=ig;
    px.beginPath();px.ellipse(x,top,5.5,squint?4:7,0,0,7);px.fill();
    px.fillStyle='#0a0a18';px.beginPath();px.ellipse(x,top,2.5,squint?2:3.5,0,0,7);px.fill();
    px.fillStyle='#fff';
    px.beginPath();px.arc(x-2.5,top-2.5,2,0,7);px.fill();
    px.beginPath();px.arc(x+1,top-1,0.9,0,7);px.fill();
    px.strokeStyle='#241810';px.lineWidth=2.4;
    px.beginPath();px.ellipse(x,eyeY-2,9,9,0,Math.PI*1.05,Math.PI*1.95);px.stroke();
    px.lineWidth=1;
    [-7,-3,2,6].forEach(dx=>{px.beginPath();px.moveTo(x+dx,eyeY-9);px.lineTo(x+dx*1.2,eyeY-13);px.stroke();});
    px.strokeStyle = lvl>=1 ? 'rgba(200,90,90,.7)' : 'rgba(120,90,70,.6)';
    px.lineWidth=1.4;
    px.beginPath();px.moveTo(x-7,eyeY+9);px.quadraticCurveTo(x,eyeY+11,x+7,eyeY+9);px.stroke();
    if(squint){px.fillStyle='#e8be80';px.fillRect(x-9,eyeY-9,18,5);}
  }
  px.lineWidth=1.5; px.strokeStyle='#3a2818';

  function brows(yL,yR){
    px.strokeStyle='#241810';px.lineWidth=2;
    px.beginPath();px.moveTo(42,yL);px.lineTo(58,yL-2);px.moveTo(72,yR-2);px.lineTo(88,yR);px.stroke();
  }

  if(lvl===0){
    brows(76,76);
    eyeWhite(50);eyeWhite(80);iris(50,false);iris(80,false);
    px.strokeStyle='#241810';px.lineWidth=2;
    px.beginPath();px.moveTo(54,110);px.quadraticCurveTo(67,120,82,108);px.stroke();
    px.fillStyle='#fff';px.fillRect(72,109,6,3);
  } else if(lvl===1){
    brows(80,80);
    eyeWhite(50);eyeWhite(80);iris(50,true);iris(80,true);
    px.strokeStyle='#241810';px.lineWidth=2;
    px.beginPath();px.moveTo(56,112);px.quadraticCurveTo(66,108,78,114);px.stroke();
    px.fillStyle='rgba(120,200,255,.9)';
    px.beginPath();px.moveTo(98,70);px.quadraticCurveTo(103,80,98,85);px.quadraticCurveTo(93,80,98,70);px.fill();
  } else if(lvl===2){
    brows(76,82);
    eyeWhite(50);iris(50,false);
    px.strokeStyle='#241810';px.lineWidth=2.2;
    px.beginPath();px.moveTo(72,92);px.quadraticCurveTo(80,87,88,92);px.stroke();
    px.fillStyle='#fff';px.fillRect(55,107,24,7);
    px.strokeStyle='#241810';px.lineWidth=1;
    px.strokeRect(55,107,24,7);
    px.beginPath();px.moveTo(61,107);px.lineTo(61,114);px.moveTo(67,107);px.lineTo(67,114);px.moveTo(73,107);px.lineTo(73,114);px.stroke();
    px.save();px.translate(86,108);px.rotate(-0.4);
    px.fillStyle='#fff';px.fillRect(-12,-5,24,10);
    px.strokeStyle='#dd3333';px.lineWidth=1.5;
    px.beginPath();px.moveTo(-3,-4);px.lineTo(-3,4);px.moveTo(-7,0);px.lineTo(1,0);
    px.moveTo(5,-4);px.lineTo(5,4);px.moveTo(1,0);px.lineTo(9,0);px.stroke();
    px.restore();
    px.fillStyle='rgba(120,200,255,.9)';
    px.beginPath();px.moveTo(40,72);px.quadraticCurveTo(44,80,40,84);px.quadraticCurveTo(36,80,40,72);px.fill();
  } else {
    brows(80,80);
    px.fillStyle='rgba(60,40,80,.5)';
    px.beginPath();px.ellipse(50,98,9,4,0,0,7);px.fill();
    px.beginPath();px.ellipse(80,98,9,4,0,0,7);px.fill();
    px.strokeStyle='#241810';px.lineWidth=2.4;
    px.beginPath();
    px.moveTo(44,86);px.lineTo(56,96);px.moveTo(56,86);px.lineTo(44,96);
    px.moveTo(74,86);px.lineTo(86,96);px.moveTo(86,86);px.lineTo(74,96);
    px.stroke();
    px.fillStyle='#5a2020';px.beginPath();px.ellipse(67,112,7,5,0,0,7);px.fill();
    px.fillStyle='#cc5566';px.beginPath();px.ellipse(67,115,4,3,0,0,7);px.fill();
    px.fillStyle='rgba(120,200,255,.9)';
    [[98,72],[36,80],[92,86]].forEach(([sx,sy])=>{
      px.beginPath();px.moveTo(sx,sy);px.quadraticCurveTo(sx+4,sy+8,sx,sy+12);px.quadraticCurveTo(sx-4,sy+8,sx,sy);px.fill();
    });
  }

  px.strokeStyle='#c89868';px.lineWidth=1.4;
  px.beginPath();px.moveTo(63,104);px.quadraticCurveTo(62,106,64,106);px.stroke();
  px.beginPath();px.moveTo(70,104);px.quadraticCurveTo(71,106,69,106);px.stroke();
  px.fillStyle='rgba(255,248,238,.8)';px.beginPath();px.arc(66,99,1.3,0,7);px.fill();

  px.restore();
}

//============ MAP CANVAS ============
const mc = document.getElementById('mapCanvas');
const mx = mc.getContext('2d');
const TS=20, COLS=20, ROWS=13;
let MAP = buildMap();
function buildMap(){
  const m=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++){r.push(0);}m.push(r);}
  for(let y=4;y<=8;y++)for(let x=7;x<=12;x++)m[y][x]=2;
  for(let x=0;x<COLS;x++)m[6][x]=m[6][x]===2?2:1;
  for(let y=0;y<ROWS;y++)m[y][9]=m[y][9]===2?2:1;
  for(let y=0;y<=3;y++)for(let x=16;x<COLS;x++)m[y][x]=3;
  [[2,2],[3,5],[1,13],[10,3],[11,14],[2,8],[12,2],[10,11],[11,7],[0,11]].forEach(([y,x])=>{if(m[y]&&m[y][x]===0)m[y][x]=4;});
  return m;
}
const HERO_TX=9, HERO_TY=6;

let markers=[];
let sparkles=[];
function rebuildMarkers(){
  const spots=[[1,3],[2,15],[8,2],[9,15],[11,5],[3,11],[12,12],[7,16],[10,1],[1,7],[4,17],[11,9]];
  let i=0; markers=[];
  state.tasks.filter(t=>!t.done).forEach(t=>{
    const s = spots[i%spots.length]; i++;
    t.markerX = s[1]*TS+TS/2; t.markerY=s[0]*TS+TS/2;
    markers.push({id:t.id, tx:s[1], ty:s[0], overdue:isOverdue(t), name:t.name});
  });
}
function sparkleAt(x,y){
  if(x==null) return;
  for(let i=0;i<8;i++) sparkles.push({x,y,a:Math.PI/4*i,t:0});
}

function fitMap(){
  const w=window.innerWidth, h=Math.max(340, window.innerHeight);
  mc.width=w; mc.height=h;
}
window.addEventListener('resize', fitMap);

function drawMap(time){
  const W=mc.width, H=mc.height;
  mx.clearRect(0,0,W,H);
  const sx=W/(COLS*TS), sy=H/(ROWS*TS);
  mx.save();
  mx.scale(sx,sy);

  const shimmer = Math.sin(time/300);
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const t=MAP[y][x], px0=x*TS, py0=y*TS;
      const variant=(x*13+y*7)%3;
      if(t===0){
        const shades=['#1e4d1e','#236123','#1a431a'];
        mx.fillStyle=shades[variant]; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='#3aa03a';
        if((x+y)%2===0)mx.fillRect(px0+3,py0+3,3,3);
        mx.fillRect(px0+13,py0+11,2,2); mx.fillRect(px0+8,py0+15,2,2);
      } else if(t===1){
        mx.fillStyle='#6b4423'; mx.fillRect(px0,py0,TS,TS);
        mx.fillStyle='#4a3018'; mx.fillRect(px0,py0,TS,2); mx.fillRect(px0,py0,2,TS);
        mx.fillStyle='#8a6038'; mx.fillRect(px0+4,py0+9,3,3); mx.fillRect(px0+13,py0+4,2,2);
        mx.fillStyle='#5a3a1e'; mx.fillRect(px0+9,py0+13,2,2);
      } else if(t===2){
        mx.fillStyle=((x+y)%2===0)?'#999999':'#888888'; mx.fillRect(px0,py0,TS,TS);
        mx.strokeStyle='#5a5a5a'; mx.lineWidth=1;
        mx.strokeRect(px0+0.5,py0+0.5,TS-1,TS-1);
        mx.fillStyle='rgba(255,255,255,.12)'; mx.fillRect(px0+2,py0+2,5,5);
      } else if(t===3){
        mx.fillStyle='#1a3a6b'; mx.fillRect(px0,py0,TS,TS);
        mx.strokeStyle='#4488cc'; mx.lineWidth=1.5;
        for(let wy=4; wy<TS; wy+=7){
          mx.beginPath();
          for(let wx=0; wx<=TS; wx+=2){
            const yy=py0+wy+Math.sin((px0+wx)/5 + time/350 + wy)*1.6;
            if(wx===0)mx.moveTo(px0+wx,yy); else mx.lineTo(px0+wx,yy);
          }
          mx.stroke();
        }
      } else if(t===4){
        const shades=['#1e4d1e','#236123','#1a431a'];
        mx.fillStyle=shades[variant]; mx.fillRect(px0,py0,TS,TS);
      }
      if(t!==3){
        mx.fillStyle='rgba(0,0,0,.22)';
        mx.fillRect(px0,py0+TS-2,TS,2);
        mx.fillRect(px0+TS-2,py0,2,TS);
      }
    }
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(MAP[y][x]!==4) continue;
    const cxp=x*TS+TS/2, cyp=y*TS+TS/2;
    mx.fillStyle='rgba(0,0,0,.35)';
    mx.beginPath();mx.ellipse(cxp+2,cyp+6,11,5,0,0,7);mx.fill();
    mx.fillStyle='#3a2410';mx.beginPath();mx.arc(cxp,cyp+4,2.5,0,7);mx.fill();
    mx.fillStyle='#143d14';mx.beginPath();mx.arc(cxp,cyp,9,0,7);mx.fill();
    mx.beginPath();mx.arc(cxp-5,cyp-3,5,0,7);mx.fill();mx.beginPath();mx.arc(cxp+5,cyp+2,5,0,7);mx.fill();
    mx.fillStyle='#2a7a2a';mx.beginPath();mx.arc(cxp-2,cyp-1,6,0,7);mx.fill();
    mx.fillStyle='#4cb04c';mx.beginPath();mx.arc(cxp-3,cyp-3,3.5,0,7);mx.fill();
  }

  const fx=12*TS+10, fy=4*TS;
  mx.strokeStyle='#cccccc';mx.lineWidth=2;mx.beginPath();mx.moveTo(fx,fy-2);mx.lineTo(fx,fy+16);mx.stroke();
  const wave=Math.sin(time/200)*3;
  mx.fillStyle='#ee2222';mx.beginPath();mx.moveTo(fx,fy-2);mx.lineTo(fx+14,fy+2+wave);mx.lineTo(fx,fy+8);mx.closePath();mx.fill();

  const hx=HERO_TX*TS+TS/2, hy=HERO_TY*TS+TS/2;
  const lvl=hpLevel();

  mx.strokeStyle='rgba(255,255,255,0.1)';mx.lineWidth=1;
  markers.forEach(m=>{
    const cxp=m.tx*TS+TS/2, cyp=m.ty*TS+TS/2;
    mx.beginPath();mx.moveTo(hx,hy);mx.lineTo(cxp,cyp);mx.stroke();
  });

  mx.textAlign='center';mx.textBaseline='middle';
  const pulse = 0.5+0.5*Math.sin(time/250);
  markers.forEach(m=>{
    const cxp=m.tx*TS+TS/2, cyp=m.ty*TS+TS/2;
    const col = m.overdue ? 'rgba(238,34,34,' : 'rgba(255,235,120,';
    mx.fillStyle=col+(0.2+pulse*0.35)+')';
    mx.beginPath();mx.arc(cxp,cyp,14+pulse*3,0,7);mx.fill();
    mx.fillStyle=col+'0.9)';
    mx.beginPath();mx.arc(cxp,cyp,9,0,7);mx.fill();
    if(m.overdue){
      mx.fillStyle='#fff';
      mx.beginPath();mx.arc(cxp,cyp-1,5,0,7);mx.fill();
      mx.fillRect(cxp-3,cyp+3,6,3);
      mx.fillStyle='#220000';
      mx.beginPath();mx.arc(cxp-2,cyp-1,1.4,0,7);mx.fill();
      mx.beginPath();mx.arc(cxp+2,cyp-1,1.4,0,7);mx.fill();
      mx.fillRect(cxp-0.7,cyp+1,1.4,2);
    } else {
      mx.fillStyle='#3a2800';
      mx.font='bold 13px "Press Start 2P", monospace';
      mx.fillText('!', cxp, cyp);
    }
    mx.font='6px "Press Start 2P", monospace';
    mx.fillStyle=m.overdue?'#ff8888':'#ffe890';
    const label=(m.name||'').slice(0,8);
    mx.fillText(label, cxp, cyp+18);
  });

  sparkles.forEach(s=>{ s.t+=0.06;
    const r=s.t*18; const a=1-s.t;
    if(a>0){ mx.fillStyle='rgba(255,255,180,'+a+')';
      mx.fillRect(s.x+Math.cos(s.a)*r-2, s.y+Math.sin(s.a)*r-2,4,4);
    }
  });
  sparkles = sparkles.filter(s=>s.t<1);

  const tokCol=['#3a7aff','#ffcc22','#ff8822','#ff2222'][lvl];
  const ringCol=['rgba(80,140,255,','rgba(255,210,60,','rgba(255,140,40,','rgba(255,50,50,'][lvl];
  const bobMap = lvl===3 ? 3 : (lvl===0 ? -2 : 0);
  const tky=hy+bobMap;
  const ringR=12+pulse*5;
  mx.strokeStyle=ringCol+(0.5+pulse*0.4)+')'; mx.lineWidth=2;
  mx.beginPath();mx.arc(hx,tky+5,ringR,0,7);mx.stroke();
  mx.fillStyle='rgba(0,0,0,.35)';mx.beginPath();mx.ellipse(hx,tky+7,9,4,0,0,7);mx.fill();
  mx.save();
  mx.shadowColor=tokCol; mx.shadowBlur=12;
  mx.fillStyle=tokCol;
  mx.beginPath();mx.moveTo(hx,tky-14);mx.lineTo(hx+14,tky);mx.lineTo(hx,tky+14);mx.lineTo(hx-14,tky);mx.closePath();mx.fill();
  mx.restore();
  mx.strokeStyle='#fff';mx.lineWidth=1.5;
  mx.beginPath();mx.moveTo(hx,tky-14);mx.lineTo(hx+14,tky);mx.lineTo(hx,tky+14);mx.lineTo(hx-14,tky);mx.closePath();mx.stroke();
  mx.fillStyle='#fff';
  mx.beginPath();mx.moveTo(hx,tky-9);mx.lineTo(hx-4,tky-3);mx.lineTo(hx+4,tky-3);mx.closePath();mx.fill();
  mx.fillStyle='#ffe0b0';mx.beginPath();mx.arc(hx,tky+2,3,0,7);mx.fill();

  if(lvl===3){
    const v=mx.createRadialGradient(COLS*TS/2,ROWS*TS/2,40,COLS*TS/2,ROWS*TS/2,COLS*TS/1.4);
    v.addColorStop(0,'rgba(238,34,34,0)');v.addColorStop(1,'rgba(180,0,0,0.5)');
    mx.fillStyle=v;mx.fillRect(0,0,COLS*TS,ROWS*TS);
  }
  mx.restore();
}

//============ ANIM LOOP ============
function loop(time){
  const bob = Math.sin(time/1500*Math.PI)*2.2;
  drawPortrait(bob);
  drawMap(time);
  requestAnimationFrame(loop);
}

//============ INIT ============
document.getElementById('addBtn').onclick=()=>{
  const name=document.getElementById('taskName').value.trim();
  const due=document.getElementById('taskDate').value;
  if(!name) return;
  addTask(name, due||null);
  document.getElementById('taskName').value='';
  document.getElementById('taskDate').value='';
};
document.getElementById('taskName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addBtn').click();});
document.getElementById('reviveBtn').onclick=()=>{
  state.hp=HP_MAX;
  save(); refresh();
};
document.getElementById('collapseBtn').onclick=()=>{
  const lp=document.getElementById('listPanel');
  const fp=document.getElementById('formPanel');
  const c=lp.classList.toggle('collapsed');
  fp.classList.toggle('collapsed', c);
  document.getElementById('collapseBtn').textContent = c ? '^' : 'v';
};

drawHeart(); drawScroll();
fitMap();
load();
recalcHP();
save();
rebuildMarkers();
refresh();
requestAnimationFrame(loop);

setInterval(()=>{ recalcHP(); rebuildMarkers(); save(); refresh(); }, 3600*1000);
</script>
